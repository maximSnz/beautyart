<script>
// «Рука на пульсе» WB (только ИП) — шаг 2 «Протокола работ» WB (ROADMAP, этап 7; 13.11.2026, решение владельца: гипотезы WB ставятся и
// смотрятся здесь). Строка — размер WB (chrt_id) или группа перчаток (gloveFamily по «артикул продавца-размер», от 2 размеров).
// Таблица по дням (как РНП plan.html): с 10 дней до 1-го числа по конец месяца; заказы — «Лента заказов» без отмен (wb_orders, полная с 12.10.2026);
// цена заказа — выручка ÷ шт без отмен; ДРР — реклама размера (wb_cf_daily.ads: расход карточки, делённый на размеры по выручке заказов дня) ÷
// выручка ВСЕХ заказов дня (с отменами — как модель лимитов wb_drr_limits); лимиты — от цены дня по коэффициентам последнего дня wb_drr_limits;
// маржа ₽ — wb_cf_daily.mar (по дате операции финансового отчёта); остатки — wb_stock_history без строк «В пути…».
// SMART-гипотезы — wb_protocol (только по заказам), дата работы — wb_plan_meta (sql/2026-11-13_wb_protocol.sql); факт фиксирует ночная загрузка WB (шаг 8).
// ?pulse=<артикул-размер или семейство> | ?chrt=<id>; &m=YYYY-MM; &embed=1 — только таблица и гипотезы (окно товара «Протокола работ» WB).
const SUPABASE_URL='https://jvoofakrkhzoblhhuyvr.supabase.co';
const ANON='sb_publishable_IA4ReUU9xTL7hb_sbsHaFA_LPATJazE';
const HD={apikey:ANON,Authorization:'Bearer '+ANON};
const FEED_FULL_FROM='2026-10-12', NET_FLOOR=5, PSEUDO=/^В пути/;
const QS=new URLSearchParams(location.search), EMBED=QS.get('embed')==='1';
if(EMBED)document.body.classList.add('embed');
let PRODS=[], BYCHRT=new Map(), CUR=null, D=null, PROTO={}, NOTABLE=false, MONTH=QS.get('m')||'';
const EH_HIDE=new Set(), EF_SZ=new Set(); let EH_SEL=null;
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pad=n=>String(n).padStart(2,'0');
const fmt=n=>Number(n||0).toLocaleString('ru-RU',{maximumFractionDigits:0});
const f1=n=>Number(n||0).toLocaleString('ru-RU',{maximumFractionDigits:1});
const localISO=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const parseW=s=>{const [y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d);};
const ddmm=iso=>iso?iso.slice(8,10)+'.'+iso.slice(5,7):'—';
const addDaysISO=(iso,n)=>{const d=parseW(iso);d.setDate(d.getDate()+n);return localISO(d);};
const isWeekend=iso=>{const w=parseW(iso).getDay();return w===0||w===6;};
const mskDayOf=ts=>new Date(new Date(ts).getTime()+3*36e5).toISOString().slice(0,10);   // день по Москве (как order_day ленты)
function monthOfWeekISO(iso){const d=parseW(iso);d.setDate(d.getDate()-((d.getDay()+6)%7)+3);return d.getFullYear()+'-'+pad(d.getMonth()+1);}   // месяц недели — по четвергу, как plan.html
function effMonth(y,m){const last=new Date(y,m,0).getDate();let B=0,W=0;for(let d=1;d<=last;d++){const w=new Date(y,m-1,d).getDay();if(w===0||w===6)W++;else B++;}return B+0.7*W;}
function effDaysRange(f,t){let s=0;for(let d=f;d<=t;d=addDaysISO(d,1))s+=isWeekend(d)?0.7:1;return s;}
function weekdayOptions(start){const out=[];for(let i=1;out.length<3;i++){const d=addDaysISO(start,i);if(!isWeekend(d))out.push(d);}return out;}
function lastWeekdaysBefore(iso,n){const out=[];let d=addDaysISO(iso,-1);while(out.length<n){if(!isWeekend(d))out.unshift(d);d=addDaysISO(d,-1);}return out;}
function dform(n){const a=Math.abs(n)%100,b=a%10;return a>10&&a<20?'дней':b===1?'день':(b>=2&&b<=4?'дня':'дней');}
// группы перчаток — как plan.html (gloveFamily: артикул до кода цвета и фасовки включительно; размеры — от большего к меньшему)
const GLV_COLORS=new Set(['BLK','BLU','PNK','GRY','YLW','PUR','CLR','WHT','GRN','RED','ORG','BRN','BEG']);
const SIZE_ORDER=['XXXL','3XL','XXL','2XL','XL','L','M','S','XS','XXS'];
const sizeRank=o=>{const t=String(o).toUpperCase().replace(/М/g,'M').replace(/Х/g,'X').replace(/С/g,'S').split('-').reverse().find(x=>SIZE_ORDER.includes(x));return t?SIZE_ORDER.indexOf(t):SIZE_ORDER.length;};
const bySize=(a,b)=>sizeRank(a.offer)-sizeRank(b.offer)||String(a.offer).localeCompare(String(b.offer));
function gloveFamily(offer){const s=String(offer).split('-');if(s[0]!=='GLV')return null;
  for(let i=2;i<s.length;i++)if(GLV_COLORS.has(s[i])){const e=/^\d+$/.test(s[i+1]||'')?i+1:i;return e>i||e<s.length-1?s.slice(0,e+1).join('-'):null;}return null;}
const shortOf=o=>CUR&&CUR.isG&&o.indexOf(CUR.key)===0?o.slice(CUR.key.length).replace(/^-/,''):o;
let tellH=()=>{};
if(EMBED){const b=document.querySelector('.wrap');tellH=()=>{try{parent.postMessage({type:'ba-pulse-h',key:QS.get('pulse')||QS.get('chrt')||'',h:b.scrollHeight},'*');}catch(e){}};new ResizeObserver(()=>tellH()).observe(b);}

async function go(){
  if(!await BA_AUTH.login(SUPABASE_URL,HD))return;
  document.getElementById('login').classList.add('hide');
  document.getElementById('app').classList.remove('hide');
  init();
}
async function getAll(path){let out=[],off=0;
  for(;;){const r=await fetch(SUPABASE_URL+'/rest/v1/'+path+(path.includes('?')?'&':'?')+`limit=1000&offset=${off}`,{headers:HD});
    if(!r.ok){const e=new Error(path.split('?')[0]+' HTTP '+r.status);e.status=r.status;e.body=await r.text();throw e;}
    const j=await r.json();out=out.concat(j);if(j.length<1000)break;off+=1000;}
  return out;}
const noTable=e=>e&&(e.status===404||/42P01|PGRST205|does not exist|Could not find the table/.test(e.body||''));
async function init(){
  try{PRODS=(await getAll('wb_products?select=chrt_id,nm_id,vendor_code,tech_size,title,archived,wb_archived,wb_trash&order=chrt_id')).map(p=>{const sz=String(p.tech_size||'').trim();
      return {chrt:Number(p.chrt_id),nm:p.nm_id,vc:p.vendor_code||'',size:sz&&sz!=='0'?sz:'',offer:String(p.vendor_code||p.chrt_id).toUpperCase()+(sz&&sz!=='0'?'-'+sz.toUpperCase():''),title:p.title||'',off:!!(p.archived||p.wb_archived)};});
    BYCHRT=new Map(PRODS.map(p=>[p.chrt,p]));
  }catch(e){document.getElementById('err').textContent='Ошибка загрузки базы товаров WB: '+e.message;return;}
  const act=PRODS.filter(p=>!p.off),fam=new Map();act.forEach(p=>{const f=gloveFamily(p.offer);if(f)(fam.get(f)||fam.set(f,[]).get(f)).push(p);});
  document.getElementById('qlist').innerHTML=[...[...fam].filter(([,m])=>m.length>1).map(([f,m])=>`<option value="${esc(f)}">группа перчаток · ${m.length} разм.</option>`),
    ...act.sort((a,b)=>a.offer.localeCompare(b.offer)).map(p=>`<option value="${esc(p.offer)}">${esc(p.title)}</option>`)].join('');
  const now=new Date(),cm=localISO(now).slice(0,7),pm=localISO(new Date(now.getFullYear(),now.getMonth()-1,1)).slice(0,7);
  if(!MONTH)MONTH=cm;
  document.getElementById('mon').innerHTML=[pm,cm].map(m=>`<option value="${m}"${m===MONTH?' selected':''}>${['январь','февраль','март','апрель','май','июнь','июль','август','сентябрь','октябрь','ноябрь','декабрь'][+m.slice(5)-1]} ${m.slice(0,4)}</option>`).join('');
  const k=QS.get('pulse')||(QS.get('chrt')&&BYCHRT.get(Number(QS.get('chrt')))?BYCHRT.get(Number(QS.get('chrt'))).offer:'');
  if(k){document.getElementById('q').value=k;pick(k);}
}
// выбор: размер (артикул-размер) или семейство перчаток от 2 неархивных размеров
function pick(v){const key=String(v||'').trim().toUpperCase();if(!key)return;
  const p=PRODS.find(x=>x.offer===key);
  const ms=PRODS.filter(x=>!x.off&&gloveFamily(x.offer)===key).sort(bySize);
  if(p)CUR={key:p.offer,isG:false,members:[p]};
  else if(ms.length>1)CUR={key,isG:true,members:ms};
  else{document.getElementById('err').textContent=`«${v}» не найден в «Базе товаров WB».`;return;}
  document.getElementById('err').textContent='';EH_HIDE.clear();EF_SZ.clear();EH_SEL=null;
  if(!EMBED){const u=new URL(location.href);u.searchParams.set('pulse',CUR.key);u.searchParams.delete('chrt');history.replaceState(null,'',u);}
  show();}
async function show(){if(!CUR)return;
  const box=document.getElementById('pulseBox');box.innerHTML='<div class="psub">загрузка…</div>';
  document.getElementById('meta').textContent=CUR.isG?`${CUR.members.length} размеров: ${CUR.members.map(m=>shortOf(m.offer)).join(', ')}`:(CUR.members[0].title||'');
  try{D=await pulseData();box.innerHTML=pulseRender(D);}
  catch(e){box.innerHTML=`<div class="err">Ошибка загрузки: ${esc(e.message)}</div>`;return;}
  document.getElementById('hypBox').classList.remove('hide');
  await loadHyp();tellH();}

// ===== данные таблицы =====
async function pulseData(){
  const [y,m]=MONTH.split('-').map(Number),first=localISO(new Date(y,m-1,1-10)),last=localISO(new Date(y,m,0)),mStart=MONTH+'-01';
  const today=localISO(new Date()),yest=addDaysISO(today,-1),ids=CUR.members.map(p=>p.chrt),inIds=`chrt_id=in.(${ids.join(',')})`;
  const oFrom=[first,addDaysISO(today,-14)].sort()[0];   // заказы — и за 14 дней до сегодня (вес размеров в лимитах группы)
  const [ord,cf,stk,lim,plan,lastO]=await Promise.all([
    getAll(`wb_orders?source=eq.feed&${inIds}&order_day=gte.${oFrom}&order_day=lte.${last}&select=srid,order_day,chrt_id,price_with_disc,is_cancel&order=srid`),
    getAll(`wb_cf_daily?${inIds}&day=gte.${first}&day=lte.${last}&select=chrt_id,day,mar,ads,retail,no_cost_qty&order=chrt_id,day`),
    getAll(`wb_stock_history?${inIds}&report_date=gte.${first}&report_date=lte.${last}&select=report_date,barcode,warehouse_name,chrt_id,qty&order=report_date,barcode,warehouse_name`),
    getAll(`wb_drr_limits?${inIds}&day=gte.${addDaysISO(today,-14)}&select=*&order=day.desc,chrt_id`).catch(e=>{if(noTable(e))return [];throw e;}),
    getAll(`wb_sales_plan?month=eq.${MONTH}&${inIds}&select=chrt_id,plan_qty,price,margin_pct&order=chrt_id`),
    fetch(SUPABASE_URL+'/rest/v1/wb_orders?source=eq.feed&select=order_day&order=order_day.desc&limit=1',{headers:HD}).then(r=>{if(!r.ok)throw new Error('wb_orders HTTP '+r.status);return r.json();})]);
  // последний полный день ленты: не позже вчера (утром в базе бывают заказы сегодняшнего дня — неполные)
  const lastOrd=[lastO.length?lastO[0].order_day:'',yest].sort()[0];
  const days=[];for(let d=first;d<=last;d=addDaysISO(d,1))days.push(d);
  const size=c=>{const P=plan.find(x=>Number(x.chrt_id)===c),L=lim.find(x=>Number(x.chrt_id)===c);
    const S={chrt:c,offer:BYCHRT.get(c).offer,q:{},rev:{},qa:{},reva:{},ads:{},mar:{},noc:{},stk:{},q14:0,
      plan:P&&Number(P.plan_qty)>0?{qty:Number(P.plan_qty),price:Number(P.price||0),pct:P.margin_pct==null?null:Number(P.margin_pct)}:null,lim:L||null};
    ord.forEach(o=>{if(Number(o.chrt_id)!==c)return;const d=o.order_day,v=Number(o.price_with_disc||0);
      S.qa[d]=(S.qa[d]||0)+1;S.reva[d]=(S.reva[d]||0)+v;
      if(!o.is_cancel){S.q[d]=(S.q[d]||0)+1;S.rev[d]=(S.rev[d]||0)+v;if(d>=addDaysISO(today,-14)&&d<today)S.q14++;}});
    cf.forEach(x=>{if(Number(x.chrt_id)!==c)return;S.ads[x.day]=(S.ads[x.day]||0)+Number(x.ads||0);S.mar[x.day]=(S.mar[x.day]||0)+Number(x.mar||0);if(Number(x.no_cost_qty||0)>0)S.noc[x.day]=(S.noc[x.day]||0)+Number(x.no_cost_qty);});
    stk.forEach(x=>{if(Number(x.chrt_id)!==c||PSEUDO.test(x.warehouse_name||''))return;S.stk[x.report_date]=(S.stk[x.report_date]||0)+Number(x.qty||0);});
    return S;};
  const sizes=ids.map(size);

}
// лимиты ДРР при цене P — модель шага 7 wb-daily-load (purchasing.md, «Лимиты ДРР WB»): pre(P) = r − t − u ÷ (P × b);
// безубыточный = max(0, (pre − 5) × b), плановый = max(0, (pre − план маржинальности) × b); план — wb_sales_plan месяца страницы
function limAt(S,P){const L=S.lim;if(!L||!(P>0))return {ok:false};
  const b=Number(L.b),r=Number(L.r),t=Number(L.t),u=Number(L.u);if(!(b>0))return {ok:false};
  const pre=(r-t-u/(P*b))*100,pp=S.plan&&S.plan.pct!=null?S.plan.pct:(L.plan_pct==null?null:Number(L.plan_pct));

// значения размера по дням
function sizeVals(S,X){const {days,today,lastOrd,mStart}=X;let lastP=null;
  const exec=Object.entries(S.q).filter(([d])=>d>=mStart&&d<=lastOrd).reduce((s,[,v])=>s+v,0);
  const [y,m]=MONTH.split('-').map(Number),effM=effMonth(y,m),effRem=effDaysRange(today>mStart?today:mStart,X.last);
  return days.map(d=>{const has=d>=FEED_FULL_FROM&&d<=lastOrd&&d<today;
    const q=has?(S.q[d]||0):null,rev=has?(S.rev[d]||0):null,qa=S.qa[d]||0,reva=S.reva[d]||0;
    if(has&&qa>0)lastP=reva/qa;
    let planDay=null,catchDay=null;
    if(d>=today&&S.plan){const k=isWeekend(d)?0.7:1;planDay=S.plan.qty/effM*k;catchDay=effRem>0?Math.max(0,S.plan.qty-exec)/effRem*k:null;}
    const ads=S.ads[d]||0,P=d<today&&qa>0?reva/qa:(d>=today&&S.lim?Number(S.lim.price):lastP);
    const drr=d<today&&d<=lastOrd&&ads>0?(reva>0?ads/reva*100:Infinity):null;
    return {d,q,rev,qa,reva,price:q>0?rev/q:null,ads,drr,L:limAt(S,P),mar:S.mar[d]!=null?S.mar[d]:null,noc:S.noc[d]||0,stk:S.stk[d]!=null?S.stk[d]:null,planDay,catchDay};});}
// группа перчаток: суммы размеров; цена = Σ выручки ÷ Σ шт; ДРР = Σ рекламы ÷ Σ выручки всех заказов; лимиты — лимиты размеров при цене дня,

function groupVals(rows,sizes){return rows[0].map((_,i)=>{const c=rows.map(r=>r[i]),S=(f)=>c.some(x=>x[f]!=null)?c.reduce((s,x)=>s+(x[f]||0),0):null;
  const q=S('q'),rev=S('rev'),reva=c.reduce((s,x)=>s+x.reva,0),ads=c.reduce((s,x)=>s+x.ads,0),d=c[0].d;
  const ws=c.map((x,j)=>({L:x.L,w:x.reva>0?x.reva:sizes[j].q14})).filter(x=>x.L.ok&&x.w>0),W=ws.reduce((s,x)=>s+x.w,0);
  const L=W>0?{ok:true,grp:true,pre:ws.reduce((s,x)=>s+x.L.pre*x.w,0)/W,be:ws.reduce((s,x)=>s+x.L.be*x.w,0)/W,target:ws.every(x=>x.L.target!=null)?ws.reduce((s,x)=>s+x.L.target*x.w,0)/W:null}:{ok:false};
  return {d,q,rev,reva,price:q>0?rev/q:null,ads,drr:c.some(x=>x.drr!=null)?(reva>0?ads/reva*100:Infinity):null,L,mar:S('mar'),noc:c.reduce((s,x)=>s+x.noc,0),stk:S('stk'),
    planDay:c.some(x=>x.planDay!=null)?c.reduce((s,x)=>s+(x.planDay||0),0):null,catchDay:c.some(x=>x.catchDay!=null)?c.reduce((s,x)=>s+(x.catchDay||0),0):null};});}

function verdict(it){if(it.fact_ctx==null)return null;
  const base=it.baseline_ctx?JSON.parse(it.baseline_ctx):null,fact=JSON.parse(it.fact_ctx);if(!base)return null;

  const leg=Object.values(EH_ST).map(([c,t])=>`<span><b style="background:${c}"></b>${t}</span>`).join('')+'<span><i class="ehdl" style="position:static;display:inline-block"></i> контроль</span>';
  const flt=isG?`<div class="ehflt">${ms.map(p=>`<label><input type="checkbox"${EH_HIDE.has(p.chrt)?'':' checked'} onchange="EH_HIDE[this.checked?'delete':'add'](${p.chrt});hypDraw()">${esc(shortOf(p.offer))}</label>`).join('')}</div>`:'';
  const lst=(arr,title)=>arr.length?`<div class="psub" style="margin:4px 0 2px"><b>${title}</b></div>`+arr.sort((a,b)=>String(b.it.created_at).localeCompare(String(a.it.created_at))).map(x=>(isG?`<div class="psub" style="margin-top:4px"><b>${esc(x.p.offer)}</b></div>`:'')+renderItem(x.it)).join(''):'';
  const cs=byC.get(EH_SEL)||[],ds=(byD.get(EH_SEL)||[]).filter(x=>ehDay(x.it)!==EH_SEL);
  const det=(lst(cs,`Поставлены ${ddmm(EH_SEL)}`)+lst(ds,`Контроль ${ddmm(EH_SEL)}`))||`<div class="psub">${ddmm(EH_SEL)}: гипотез нет${EH_HIDE.size?' (с учётом фильтра размеров)':''}. Закрашенные дни — когда гипотезы ставились.</div>`;
  box.innerHTML=`<div class="psectitle">🎯 SMART-гипотезы WB · ${ddmm(from)}–${ddmm(to)}</div><div class="ehwrap"><div class="ehleft">${flt}${cal}<div class="ehleg">${leg}</div></div><div class="ehdet">${det}</div></div>`;
  tellH();}
// постановка — только по заказам; у группы — отмеченные размеры (по умолчанию — самый продаваемый за 14 дней), цель и база — свои у каждого,
// действие и день контроля — общие; на каждый размер — своя запись wb_protocol
async function ordersBaseWindow(chrt,start){const days=lastWeekdaysBefore(start,3);
  const rows=await getAll(`wb_orders?source=eq.feed&chrt_id=eq.${chrt}&order_day=gte.${days[0]}&order_day=lte.${days[2]}&is_cancel=eq.false&select=srid&order=srid`);
  return {avg:Math.round(rows.length/days.length*100)/100,from:days[0],to:days[2],days:days.length};}
function formDraw(){const box=document.getElementById('hypForm');
  if(NOTABLE){box.innerHTML='';return;}
  const isG=CUR.isG,ms=CUR.members,start=localISO(new Date());
  if(!EF_SZ.size){const best=[...D.sizes].sort((a,b)=>b.q14-a.q14)[0];EF_SZ.add(best?best.chrt:ms[0].chrt);}
  const late=lastWeekdaysBefore(start,3).filter(d=>d>D.lastOrd);
  const szs=ms.map(p=>{const c=EF_SZ.has(p.chrt);
    return `<span class="efsz${c?'':' efoff'}">${isG?`<label><input type="checkbox"${c?' checked':''} onchange="EF_SZ[this.checked?'add':'delete'](${p.chrt});formDraw()">${esc(shortOf(p.offer))}</label>`:''}`
      +`<input type="number" id="pt_${p.chrt}" step="0.01" placeholder="${isG?'цель':'Цель: заказы'}, шт/день" style="width:${isG?95:170}px"${c?'':' disabled'}><span class="psub" id="eb_${p.chrt}"></span></span>`;}).join('');
  box.innerHTML=`<div class="psectitle">➕ Новая гипотеза (по заказам)${isG?' — отметьте размеры':''}</div><div class="pfrow">${szs}</div>`
    +`<div class="pfrow"><input type="text" id="ea" placeholder="Гипотеза (действие)${isG?' — общее для отмеченных размеров':''}"><label>Контроль <select id="ed">${weekdayOptions(start).map(o=>`<option value="${o}">${ddmm(o)}</option>`).join('')}</select></label><button onclick="addHyp(this)">Добавить</button></div>`
    +`<div class="psub">База — заказы без отмен за 3 будних дня до сегодня; контроль — один из 3 следующих будних дней, факт — среднее по будням с дня после постановки по день контроля (фиксирует ночная загрузка WB).${late.length?` <b style="color:#E33D78">Заказы за ${late.map(ddmm).join(', ')} ещё не загружены — база будет занижена.</b>`:''}</div>`;
  ms.forEach(p=>{if(!EF_SZ.has(p.chrt))return;ordersBaseWindow(p.chrt,start).then(w=>{const el=document.getElementById('eb_'+p.chrt);if(el)el.textContent=`база ${f1(w.avg)}`;}).catch(()=>{});});
  tellH();}
async function post(table,body,q=''){const r=await fetch(SUPABASE_URL+`/rest/v1/${table}${q}`,{method:'POST',headers:{...HD,'Content-Type':'application/json',Prefer:q?'resolution=merge-duplicates,return=minimal':'return=minimal'},body:JSON.stringify(body)});
  if(!r.ok)throw new Error(`${table}: HTTP ${r.status}: ${(await r.text()).slice(0,200)}`);}
async function addHyp(btn){const ids=[...EF_SZ].filter(c=>CUR.members.some(m=>m.chrt===c));
  const action=(document.getElementById('ea').value||'').trim(),dl=document.getElementById('ed').value,start=localISO(new Date());
  if(!ids.length){alert('Отметьте хотя бы один размер');return;}if(!action){alert('Заполните текст гипотезы');return;}
  const tg={};for(const c of ids){const v=Number(String(document.getElementById('pt_'+c).value).replace(',','.'));if(String(document.getElementById('pt_'+c).value).trim()===''||!isFinite(v)||v<0){alert('Укажите цель (шт/день) для каждого отмеченного размера');return;}tg[c]=v;}
  const late=lastWeekdaysBefore(start,3).filter(d=>d>D.lastOrd);
  if(late.length&&!confirm(`Заказы за ${late.map(ddmm).join(', ')} ещё не загружены ночной загрузкой — база будет занижена. Всё равно поставить?`))return;
  const tM=monthOfWeekISO(dl),email=(window.BA_AUTH&&BA_AUTH.email())||null,msg=[];btn.disabled=true;
  try{for(const c of ids){const off=BYCHRT.get(c).offer;
      // одна активная гипотеза по заказам на размер с контролем в этом месяце (как addProto plan.html)
      const open=await getAll(`wb_protocol?chrt_id=eq.${c}&parent_id=is.null&fact_ctx=is.null&deadline=not.is.null&select=id,deadline&order=id`);
      const act=open.find(x=>monthOfWeekISO(x.deadline)===tM);if(act){msg.push(`${off}: уже есть активная гипотеза (контроль ${ddmm(act.deadline)}) — пропущен`);continue;}
      const b=await ordersBaseWindow(c,start);
      if(Math.abs(tg[c]-b.avg)<0.01){msg.push(`${off}: цель равна базе ${f1(b.avg)} — пропущен`);continue;}
      await post('wb_protocol',[{chrt_id:c,month:MONTH,action,deadline:dl,metric:'orders',target_orders:tg[c],user_email:email,
        baseline_ctx:JSON.stringify({orders:b.avg,orders_from:b.from,orders_to:b.to,orders_days:b.days,source:'wb_orders feed, без отмен'})}]);
      // дата работы = день контроля (как upsertPPM plan.html): строки других месяцев с датой работы — убрать
      const r=await fetch(SUPABASE_URL+`/rest/v1/wb_plan_meta?chrt_id=eq.${c}&work_date=not.is.null&month=neq.${tM}`,{method:'DELETE',headers:HD});if(!r.ok)msg.push(`${off}: дата работы — HTTP ${r.status}`);
      await post('wb_plan_meta',[{chrt_id:c,month:tM,work_date:dl,updated_at:new Date().toISOString()}],'?on_conflict=chrt_id,month');
      msg.push(`${off}: поставлена (база ${f1(b.avg)} → цель ${f1(tg[c])} шт/день)`);}
  }catch(e){msg.push('Ошибка: '+e.message);}finally{btn.disabled=false;}
  alert(msg.join('\n'));EH_SEL=start;await loadHyp();}
async function addChild(chrt,parentId,btn){const el=document.getElementById('pca_'+parentId),action=(el?el.value:'').trim();
  if(!action){alert('Введите текст дополнения');return;}btn.disabled=true;
  try{await post('wb_protocol',[{chrt_id:chrt,month:MONTH,action,parent_id:parentId,user_email:(window.BA_AUTH&&BA_AUTH.email())||null}]);}
  catch(e){alert('Ошибка сохранения: '+e.message);btn.disabled=false;return;}
  await loadHyp();}
if(BA_AUTH.has(SUPABASE_URL))go();
else if(EMBED){document.getElementById('login').classList.add('hide');document.getElementById('app').classList.remove('hide');document.getElementById('pulseBox').innerHTML='<div class="psub">Нет входа — откройте wb-pulse.html и войдите (вход общий с главной).</div>';}
</script>
