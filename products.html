<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Beauty Art — База товаров</title>
<link href="https://fonts.googleapis.com/css2?family=Forum&display=swap" rel="stylesheet">
<style>
 body{font-family:'Forum',-apple-system,sans-serif;background:linear-gradient(135deg,#78A6C7,#E33D78,#7D3673);min-height:100vh;padding:20px;margin:0}
 .login,.wrap{max-width:1100px;margin:40px auto;background:#fff;border-radius:16px;padding:30px;box-shadow:0 10px 30px rgba(28,13,46,.3)}
 h2{font-family:'Forum';color:#1C0D2E}
 input{padding:10px;border:2px solid rgba(84,66,115,.2);border-radius:8px;font-family:'Forum';font-size:1em}
 button{padding:10px 16px;border:none;border-radius:8px;background:linear-gradient(90deg,#78A6C7,#E33D78);color:#fff;font-family:'Forum';cursor:pointer}
 table{width:100%;border-collapse:collapse;font-size:.9em}
 th,td{padding:8px;border-bottom:1px dashed #cbd5e1;text-align:left}
 th{color:#666}
 .hide{display:none}
 .meta{color:#94a3b8;font-size:.85em;margin:8px 0}
 .err{color:#E33D78;font-size:.9em;margin:8px 0}
 a{color:#544273}
</style></head>
<body>
<div class="login" id="login">
  <h2>Закрытый раздел</h2>
  <input type="password" id="pwd" placeholder="Пароль" onkeypress="if(event.key==='Enter')go()">
  <button onclick="go()">Войти</button>
</div>
<div class="wrap hide" id="app">
  <h2>📦 База товаров (Ozon)</h2>
  <div class="meta" id="meta">загрузка…</div>
  <div class="err" id="err"></div>
  <input id="q" placeholder="Поиск по названию / артикулу" style="width:100%;margin-bottom:10px" oninput="render()">
  <button onclick="load()">⟳ Обновить</button>
  <a href="index.html" style="margin-left:10px">← на главную</a>
  <table><thead><tr><th>Артикул</th><th>Название</th><th>Цена, ₽</th><th>Остаток</th></tr></thead><tbody id="tb"></tbody></table>
</div>
<script>
const PASSWORD_HASH='8c6976e5b5410415bde908bd4dee15dfb167a9c873fc4bb8a81f6f2ab448a918';
const SUPABASE_URL='https://jvoofakrkhzoblhhuyvr.supabase.co';
const SUPABASE_ANON='sb_publishable_IA4ReUU9xTL7hb_sbsHaFA_LPATJazE';
let ROWS=[];
async function go(){
  const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(document.getElementById('pwd').value));
  const h=[...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('');
  if(h!==PASSWORD_HASH){alert('Неверный пароль');return;}
  document.getElementById('login').classList.add('hide');
  document.getElementById('app').classList.remove('hide');
  load();
}
async function load(){
  const err=document.getElementById('err'); err.textContent='';
  try{
    const r=await fetch(SUPABASE_URL+'/rest/v1/products?select=*&order=name.asc&limit=1000',
      {headers:{apikey:SUPABASE_ANON,Authorization:'Bearer '+SUPABASE_ANON}});
    if(!r.ok) throw new Error('HTTP '+r.status);
    ROWS=await r.json();
    const last=ROWS.reduce((m,x)=>x.updated_at&&x.updated_at>m?x.updated_at:m,'');
    document.getElementById('meta').textContent=ROWS.length
      ? `Всего товаров: ${ROWS.length} • обновлено: ${last?new Date(last).toLocaleString('ru-RU'):''}`
      : 'Данных пока нет — запустите синхронизацию Ozon → Supabase (следующий шаг).';
    render();
  }catch(e){ err.textContent='Ошибка загрузки: '+e.message; }
}
function render(){
  const q=document.getElementById('q').value.toLowerCase();
  const f=ROWS.filter(r=>(r.name||'').toLowerCase().includes(q)||(r.offer_id||'').toLowerCase().includes(q));
  document.getElementById('tb').innerHTML=f.slice(0,500).map(r=>
    `<tr><td>${r.offer_id||''}</td><td>${r.name||''}</td><td>${Number(r.price||0).toLocaleString('ru-RU')}</td><td>${r.stock||0}</td></tr>`).join('');
}
</script></body></html>
