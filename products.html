<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Beauty Art — База товаров</title>
<link href="https://fonts.googleapis.com/css2?family=Forum&display=swap" rel="stylesheet">
<style>
 body{font-family:'Forum',-apple-system,sans-serif;background:linear-gradient(135deg,#78A6C7,#E33D78,#7D3673);min-height:100vh;padding:20px;margin:0}
 .login,.wrap{max-width:1200px;margin:40px auto;background:#fff;border-radius:16px;padding:30px;box-shadow:0 10px 30px rgba(28,13,46,.3)}
 h2{font-family:'Forum';color:#1C0D2E}
 input,select{padding:6px 8px;border:2px solid rgba(84,66,115,.2);border-radius:8px;font-family:'Forum';font-size:.9em}
 button{padding:6px 10px;border:none;border-radius:8px;background:linear-gradient(90deg,#78A6C7,#E33D78);color:#fff;font-family:'Forum';cursor:pointer}
 table{width:100%;border-collapse:collapse;font-size:.88em}
 th,td{padding:6px 8px;border-bottom:1px dashed #cbd5e1;text-align:left;vertical-align:middle}
 th{color:#666}
 .hide{display:none}
 .meta{color:#94a3b8;font-size:.85em;margin:6px 0}
 .err{color:#E33D78;font-size:.9em;margin:8px 0}
 .cost{font-weight:700;color:#1C0D2E}
 .acts{white-space:nowrap}
 .acts button{margin-right:4px}
 .histrow td{background:#f8f9fb}
 .hist{font-size:.85em;color:#544273}
 .cur{color:#22c55e;font-weight:700}
 .toolbar{display:flex;gap:10px;align-items:center;margin-bottom:8px;flex-wrap:wrap}
 .toolbar input{flex:1;min-width:200px}
 .legend{margin-left:auto;color:#94a3b8;font-size:.8em;white-space:nowrap}
 details.arc{border:2px solid rgba(84,66,115,.15);border-radius:10px;background:#f8f9fb;margin:0 0 14px}
 details.arc summary{cursor:pointer;padding:10px 14px;font-family:'Forum';color:#544273;user-select:none}
 details.arc[open] summary{border-bottom:2px solid rgba(84,66,115,.1)}
 details.arc .inner{padding:10px 14px}
 tr.group td{background:linear-gradient(90deg,rgba(120,166,199,.18),transparent);font-weight:700;color:#544273;padding-top:16px;border-bottom:2px solid rgba(84,66,115,.2)}
</style></head>
<body>
<div class="login" id="login">
  <h2>Закрытый раздел</h2>
  <input type="password" id="pwd" placeholder="Пароль" onkeypress="if(event.key==='Enter')go()">
  <button onclick="go()">Войти</button>
</div>
<div class="wrap hide" id="app">
  <h2>📦 База товаров</h2>
  <div class="meta" id="meta">загрузка…</div>
  <div class="err" id="err"></div>
  <div class="toolbar">
    <input id="q" placeholder="Поиск по названию / артикулу" oninput="render()">
    <button onclick="load()">⟳ Обновить</button>
    <div class="legend">✎ цена • 🕘 история • 🗄 архив</div>
  </div>

  <details class="arc" id="arcDetails">
    <summary>🗄 Архив (<span id="arcCount">0</span>)</summary>
    <div class="inner">
      <table><thead><tr>
        <th>Артикул</th><th>Название</th><th>Поставщик</th><th>НДС</th><th>ЧЗ</th><th>Себестоимость, ₽</th><th>Действия</th>
      </tr></thead><tbody id="arcBody"></tbody></table>
    </div>
  </details>

  <table><thead><tr>
    <th>Артикул</th><th>Название</th><th>Поставщик</th><th>НДС</th><th>ЧЗ</th><th>Себестоимость, ₽</th><th>Действия</th>
  </tr></thead><tbody id="tb"></tbody></table>
</div>
<script>
const PASSWORD_HASH='8c6976e5b5410415bde908bd4dee15dfb167a9c873fc4bb8a81f6f2ab448a918';
const SUPABASE_URL='https://jvoofakrkhzoblhhuyvr.supabase.co';
const ANON='sb_publishable_IA4ReUU9xTL7hb_sbsHaFA_LPATJazE';
const HD={apikey:ANON,Authorization:'Bearer '+ANON};
let ROWS=[],PRICES={},META={};
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
const esc=s=>(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
async function go(){
  const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(document.getElementById('pwd').value));
  const h=[...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('');
  if(h!==PASSWORD_HASH){alert('Неверный пароль');return;}
  document.getElementById('login').classList.add('hide');
  document.getElementById('app').classList.remove('hide');
  load();
}
async function load(){
  const err=document.getElementById('err'); err.textContent='';
  for(let a=1;a<=3;a++){
    try{
      const [rp,rc,rm]=await Promise.all([
        fetch(SUPABASE_URL+'/rest/v1/products?select=product_id,offer_id,name,supplier,vat,cz,archived,updated_at&order=name.asc&limit=1000',{headers:HD}),
        fetch(SUPABASE_URL+'/rest/v1/product_prices?select=product_id,cost,created_at,created_by&order=created_at.desc&limit=10000',{headers:HD}),
        fetch(SUPABASE_URL+'/rest/v1/product_meta_history?select=product_id,field,value,created_at,created_by&order=created_at.desc&limit=10000',{headers:HD})
      ]);
      if(!rp.ok||!rc.ok||!rm.ok) throw new Error('HTTP '+rp.status);
      ROWS=await rp.json(); const pr=await rc.json(); const mr=await rm.json();
      PRICES={}; pr.forEach(p=>{(PRICES[p.product_id]=PRICES[p.product_id]||[]).push(p);});
      META={}; mr.forEach(m=>{(META[m.product_id]=META[m.product_id]||[]).push(m);});
      const act=ROWS.filter(r=>!r.archived).length;
      const last=ROWS.reduce((m,x)=>x.updated_at&&x.updated_at>m?x.updated_at:m,'');
      document.getElementById('meta').textContent=`Товаров в работе: ${act} • синхронизировано: ${last?new Date(last).toLocaleString('ru-RU'):''}`;
      render(); return;
    }catch(e){ if(a<3){await sleep(800*a);continue;} err.textContent='Ошибка загрузки: '+e.message; }
  }
}
function cells(r,cur){
  return `<td>${esc(r.offer_id)}</td><td>${esc(r.name)}</td>
    <td>${esc(r.supplier||'—')}</td>
    <td>${esc(r.vat||'—')}</td>
    <td><input type="checkbox" ${r.cz?'checked':''} onchange="setField(${r.product_id},'cz',this.checked)"></td>
    <td class="cost">${cur?Number(cur.cost).toLocaleString('ru-RU'):'—'}</td>`;
}
function render(){
  const q=document.getElementById('q').value.toLowerCase();
  const all=ROWS.filter(r=>(r.name||'').toLowerCase().includes(q)||(r.offer_id||'').toLowerCase().includes(q));
  const act=all.filter(r=>!r.archived);
  const arc=all.filter(r=>!!r.archived);
  document.getElementById('arcCount').textContent=arc.length;
  document.getElementById('arcBody').innerHTML=arc.map(r=>{
    const cur=(PRICES[r.product_id]||[])[0];
    return `<tr id="row-${r.product_id}">${cells(r,cur)}
      <td class="acts"><button onclick="hist(${r.product_id})">🕘</button><button onclick="setArchived(${r.product_id},false)">↩</button></td></tr>`;
  }).join('')||`<tr><td colspan="7" style="color:#94a3b8">Архив пуст</td></tr>`;
  // группировка активных по поставщику
  const sorted=[...act].sort((a,b)=>(a.supplier||'—').localeCompare(b.supplier||'—','ru')||(a.name||'').localeCompare(b.name||'','ru'));
  let html='', lastSup=null;
  for(const r of sorted){
    const sup=r.supplier||'—';
    if(sup!==lastSup){ html+=`<tr class="group"><td colspan="7">${esc(sup)}</td></tr>`; lastSup=sup; }
    const cur=(PRICES[r.product_id]||[])[0];
    html+=`<tr id="row-${r.product_id}">${cells(r,cur)}
      <td class="acts"><button onclick="editCost(${r.product_id},'${esc(r.offer_id)}')">✎</button><button onclick="hist(${r.product_id})">🕘</button><button onclick="setArchived(${r.product_id},true)">🗄</button></td></tr>`;
  }
  document.getElementById('tb').innerHTML=html;
}
async function setField(pid,field,val){
  try{
    const body={}; body[field]=val;
    const r=await fetch(SUPABASE_URL+`/rest/v1/products?product_id=eq.${pid}`,{method:'PATCH',headers:{...HD,'Content-Type':'application/json',Prefer:'return=minimal'},body:JSON.stringify(body)});
    if(!r.ok) throw new Error('HTTP '+r.status);
    const row=ROWS.find(x=>x.product_id===pid); if(row) row[field]=val;
  }catch(e){ alert('Не сохранилось: '+e.message); }
}
async function setArchived(pid,val){
  try{
    const r=await fetch(SUPABASE_URL+`/rest/v1/products?product_id=eq.${pid}`,{method:'PATCH',headers:{...HD,'Content-Type':'application/json',Prefer:'return=minimal'},body:JSON.stringify({archived:val})});
    if(!r.ok) throw new Error('HTTP '+r.status);
    await load();
  }catch(e){ alert('Не сохранилось: '+e.message); }
}
async function editCost(pid,offer){
  const cur=(PRICES[pid]||[])[0];
  const val=prompt(`Новая себестоимость для ${offer} (текущая: ${cur?cur.cost:'—'}):`, cur?cur.cost:'');
  if(val===null||val==='')return;
  const n=Number(String(val).replace(',','.').replace(/\s/g,''));
  if(!isFinite(n)||n<0){alert('Введите число');return;}
  try{
    const d0=new Date(); d0.setHours(0,0,0,0); const d1=new Date(d0); d1.setDate(d1.getDate()+1);
    await fetch(SUPABASE_URL+`/rest/v1/product_prices?product_id=eq.${pid}&created_by=eq.закупщик&created_at=gte.${d0.toISOString()}&created_at=lt.${d1.toISOString()}`,{method:'DELETE',headers:HD});
    const r=await fetch(SUPABASE_URL+'/rest/v1/product_prices',{method:'POST',
      headers:{...HD,'Content-Type':'application/json',Prefer:'return=minimal'},
      body:JSON.stringify([{product_id:pid,cost:n,created_by:'закупщик'}])});
    if(!r.ok) throw new Error('HTTP '+r.status);
    await load();
  }catch(e){ alert('Не сохранилось: '+e.message); }
}
function hist(pid){
  const old=document.getElementById('hist-'+pid); if(old){old.remove();return;}
  const seen=new Set(); const costs=[];
  for(const p of (PRICES[pid]||[])){ const k=new Date(p.created_at).toDateString(); if(seen.has(k))continue; seen.add(k); costs.push(p); }
  const dayMap=new Map();
  const add=(d,html)=>{ const k=d.toDateString(); if(!dayMap.has(k))dayMap.set(k,{d:new Date(d.getFullYear(),d.getMonth(),d.getDate()),parts:[]}); dayMap.get(k).parts.push(html); };
  costs.forEach((p,i)=>{ add(new Date(p.created_at), `<span class="${i===0?'cur':''}">${Number(p.cost).toLocaleString('ru-RU')} ₽</span>${i===0?' (текущая)':''}${p.created_by?' · '+esc(p.created_by):''}`); });
  (META[pid]||[]).forEach(m=>{ add(new Date(m.created_at), `${m.field==='supplier'?'Поставщик':'НДС'}: <b>${esc(m.value||'')}</b>${m.created_by?' · '+esc(m.created_by):''}`); });
  const lines=[...dayMap.values()].sort((a,b)=>b.d-a.d).map(g=>`<div>${g.d.toLocaleDateString('ru-RU')} — ${g.parts.join(' • ')}</div>`).join('');
  const html=`<tr class="histrow" id="hist-${pid}"><td colspan="7"><div class="hist">История изменений: `+(lines||'нет изменений')+`</div></td></tr>`;
  const row=document.getElementById('row-'+pid); if(row) row.insertAdjacentHTML('afterend',html);
}
</script></body></html>
