 }

<div class="login-box" id="login">

<script>
// Остатки WB (ИП) — шаг 3 плана переноса WB (ROADMAP, этап 1). Только чтение: данные ночной загрузки wb-daily-load.
// Решения владельца (purchasing.md): всё по WB в целом, вместе с заграницей (12.11.2026, в отличие от Ozon); спрос — все заказы
// «Ленты заказов» вместе с отменами за 28 дней до вчера (как «Среднесуточные продажи» Ozon — проверено 12.11.2026); сроки — wb_lead_times.
const SUPABASE_URL='https://jvoofakrkhzoblhhuyvr.supabase.co';
const ANON='sb_publishable_IA4ReUU9xTL7hb_sbsHaFA_LPATJazE';
const HD={apikey:ANON,Authorization:'Bearer '+ANON};
const DEMAND_DAYS=28;                       // окно спроса, как у Ozon
const SUP_TRANSIT=new Set([2,3,4,6]);       // поставки, которые везут или принимают: запланировано, отгрузка разрешена, идёт приёмка, отгружено на воротах
const PSEUDO=/^В пути/;                     // строки снимка «В пути до получателей» / «В пути возвраты на склад WB» — не склады
const COLS=11;
let P=[],ST={},ORD={},SUP={},LT=null,OKSC={},SNAP=null,WIN=null,OPEN=new Set();
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const nf=new Intl.NumberFormat('ru-RU',{maximumFractionDigits:0}), nf1=new Intl.NumberFormat('ru-RU',{maximumFractionDigits:1});
const art=r=>(r.vendor_code||'')+(r.tech_size&&r.tech_size!=='0'?' · '+r.tech_size:'');
const mskDay=n=>new Date(Date.now()+3*36e5+n*864e5).toISOString().slice(0,10);
const dm=s=>s?s.slice(8,10)+'.'+s.slice(5,7):'—';
async function go(){
  if(!await BA_AUTH.login(SUPABASE_URL,HD))return;
  document.getElementById('login').classList.add('hide');
  document.getElementById('app').classList.remove('hide');
  load();
}
async function getAll(path){
  let out=[],off=0;
  for(;;){
    const r=await fetch(SUPABASE_URL+path+(path.includes('?')?'&':'?')+`limit=1000&offset=${off}`,{headers:HD});
    if(!r.ok) throw new Error(path.split('?')[0].replace('/rest/v1/','')+' HTTP '+r.status);
    const j=await r.json(); out=out.concat(j); if(j.length<1000) break; off+=1000;
  }
  return out;
}
async function load(){
  const err=document.getElementById('err'); err.textContent='';
  try{
    const last=await getAll('/rest/v1/wb_stock_history?select=report_date&order=report_date.desc&limit=1');
    SNAP=last[0]?.report_date||null;
    const y=mskDay(-1); WIN={from:mskDay(-DEMAND_DAYS),to:y};
    const [pr,st,od,sp,sg,lt,ok]=await Promise.all([
      getAll('/rest/v1/wb_products?select=chrt_id,nm_id,vendor_code,tech_size,title,subject,supplier,box_qty,archived,wb_archived,wb_trash&order=chrt_id'),
      SNAP?getAll(`/rest/v1/wb_stock_history?select=barcode,warehouse_name,chrt_id,qty&report_date=eq.${SNAP}&order=barcode,warehouse_name`):[],
      getAll(`/rest/v1/wb_orders?select=srid,chrt_id,order_day,okrug,is_cancel&source=eq.feed&order_day=gte.${WIN.from}&order_day=lte.${WIN.to}&order=srid`),
      getAll('/rest/v1/wb_supplies?select=supply_id,status_id,warehouse_name,supply_date,create_date&order=supply_id'),
      getAll('/rest/v1/wb_supply_goods?select=supply_id,barcode,chrt_id,quantity,accepted_quantity&order=supply_id,barcode'),
      getAll('/rest/v1/wb_lead_times?select=*&region=eq.Россия').catch(()=>[]),
      getAll('/rest/v1/wb_okrug_sc?select=okrug,sc&order=okrug').catch(()=>[])
    ]);
    P=pr; LT=lt[0]||null; OKSC={}; ok.forEach(x=>OKSC[x.okrug]=x.sc);
    ST={}; st.forEach(x=>{ if(x.chrt_id==null)return; const s=ST[x.chrt_id]=ST[x.chrt_id]||{wh:0,toCl:0,ret:0,by:{}};
      if(x.warehouse_name==='В пути до получателей') s.toCl+=x.qty; else if(PSEUDO.test(x.warehouse_name)) s.ret+=x.qty;
      else { s.wh+=x.qty; s.by[x.warehouse_name]=(s.by[x.warehouse_name]||0)+x.qty; } });
    ORD={}; od.forEach(x=>{ if(x.chrt_id==null)return; const o=ORD[x.chrt_id]=ORD[x.chrt_id]||{n:0,c:0,ok:{}};
      o.n++; if(x.is_cancel)o.c++; const k=x.okrug||'не указан'; o.ok[k]=(o.ok[k]||0)+1; });
    const live=new Map(sp.filter(x=>SUP_TRANSIT.has(x.status_id)).map(x=>[x.supply_id,x]));
    SUP={}; sg.forEach(g=>{ const s=live.get(g.supply_id); if(!s||g.chrt_id==null)return; const left=Math.max(0,(g.quantity||0)-(g.accepted_quantity||0)); if(!left)return;
      const o=SUP[g.chrt_id]=SUP[g.chrt_id]||{q:0,list:[]}; o.q+=left; o.list.push(`${s.warehouse_name||'—'} №${g.supply_id}: ${nf.format(left)} шт`); });
    const lead=LT?['force_majeure_days','approval_days','supplier_to_ff_days','ff_assembly_days','ff_to_wb_days','acceptance_days'].reduce((s,k)=>s+(LT[k]||0),0):null;
    LT=LT?{...LT,lead}:null;
    document.getElementById('meta').textContent=`Остатки — снимок за ${dm(SNAP)} • спрос — заказы ${dm(WIN.from)}–${dm(WIN.to)} (${DEMAND_DAYS} дн, «Лента заказов», вместе с отменами и заграницей) • в поставках — ${live.size} поставок в пути и на приёмке`
      +(LT?` • сроки: до приёмки ${lead} дн + целевой запас ${LT.target_days} дн`:' • сроки WB не заданы (sql/2026-11-12_wb_lead_times.sql)');
    document.getElementById('legend').innerHTML=LT?`запас: <span class="d-red">&nbsp;меньше ${lead} дн&nbsp;</span> не успеем довезти • <span class="d-yel">&nbsp;${lead}–${lead+LT.target_days} дн&nbsp;</span> пора заказывать`:'';
    render();
  }catch(e){ err.textContent='Ошибка загрузки: '+e.message; }
}
function calc(r){
  const s=ST[r.chrt_id]||{wh:0,toCl:0,ret:0,by:{}}, o=ORD[r.chrt_id]||{n:0,c:0,ok:{}}, sp=SUP[r.chrt_id]||{q:0,list:[]};
  const dem=o.n/DEMAND_DAYS, days=dem>0?(s.wh+sp.q)/dem:null;
  return {s,o,sp,dem,days};
}
function dayCell(d,stockAll){
  if(d==null) return `<td class="n muted" title="Заказов за ${DEMAND_DAYS} дн нет">${stockAll?'∞':'—'}</td>`;
  const cls=LT?(d<LT.lead?'d-red':d<LT.lead+LT.target_days?'d-yel':''):'';
  return `<td class="n"><span class="${cls}" title="(остаток на складах + в поставках) ÷ спрос в день">${nf.format(Math.floor(d))}</span></td>`;
}
const HEAD=`<tr><th>Артикул</th><th>Название</th><th class="n" title="Сумма по всем складам WB (вместе с заграницей) на дату снимка">На складах, шт</th>
  <th class="n" title="Строка снимка WB «В пути до получателей» — уже заказано, в запас не входит">К покупателям, шт</th>
  <th class="n" title="Строка снимка WB «В пути возвраты на склад WB» — в запас не входит">Возвраты в пути, шт</th>
  <th class="n" title="Поставки FBO в пути и на приёмке: заявлено − принято">В поставках, шт</th>
  <th class="n" title="Все заказы «Ленты заказов» за ${DEMAND_DAYS} дн до вчера, вместе с отменами (как у Ozon)">Заказы ${DEMAND_DAYS} дн, шт</th>
  <th class="n" title="Заказы за ${DEMAND_DAYS} дн ÷ ${DEMAND_DAYS}">Спрос в день</th>
  <th class="n" title="(На складах + в поставках) ÷ спрос в день">Запас, дн</th><th class="n">В коробе</th><th>Арт. WB</th></tr>`;
function rowHtml(r,c){
  return `<tr class="row" id="row-${r.chrt_id}" onclick="toggle(${r.chrt_id})"><td>${OPEN.has(r.chrt_id)?'▾':'▸'} ${esc(art(r))}</td><td>${esc(r.title)}<div class="hint">${esc(r.subject||'')}</div></td>
    <td class="n">${nf.format(c.s.wh)}</td><td class="n muted">${nf.format(c.s.toCl)}</td><td class="n muted">${nf.format(c.s.ret)}</td>
    <td class="n" title="${esc(c.sp.list.join('\n'))}">${c.sp.q?nf.format(c.sp.q):'—'}</td>
    <td class="n" title="${c.o.c?`из них отмен: ${c.o.c}`:''}">${nf.format(c.o.n)}</td><td class="n">${c.dem?nf1.format(c.dem):'—'}</td>
    ${dayCell(c.days,c.s.wh+c.sp.q)}<td class="n">${r.box_qty??'<span class="muted">—</span>'}</td><td class="muted">${r.nm_id}</td></tr>`+(OPEN.has(r.chrt_id)?detHtml(r,c):'');
}
function detHtml(r,c){
  const wh=Object.entries(c.s.by).sort((a,b)=>b[1]-a[1]).map(([k,v])=>`<tr><td>${esc(k)}</td><td class="n">${nf.format(v)}</td></tr>`).join('')||'<tr><td class="muted">нет остатка</td></tr>';
  const tot=c.o.n, ok=Object.entries(c.o.ok).sort((a,b)=>b[1]-a[1]);
  const okH=ok.map(([k,v])=>`<tr><td>${esc(k)}</td><td class="n">${nf.format(v)}</td><td class="n">${nf1.format(v/tot*100)}%</td><td class="muted">${esc(OKSC[k]||'—')}</td></tr>`).join('')||'<tr><td class="muted">заказов нет</td></tr>';
  const sc={}; ok.forEach(([k,v])=>{ const t=OKSC[k]||'без СЦ в справочнике'; sc[t]=(sc[t]||0)+v; });
  const scH=Object.entries(sc).sort((a,b)=>b[1]-a[1]).map(([k,v])=>`<tr><td>${esc(k)}</td><td class="n">${nf1.format(v/tot*100)}%</td></tr>`).join('');
  return `<tr class="det"><td colspan="${COLS}"><div class="det">
    <div><b>Остаток по складам</b><table>${wh}</table></div>
    <div><b>Заказы по округам покупателей, ${DEMAND_DAYS} дн</b><table><tr><th>Округ</th><th class="n">шт</th><th class="n">доля</th><th>СЦ</th></tr>${okH}</table></div>
    ${tot?`<div><b>Подсказка деления по СЦ</b><table>${scH}</table><div class="hint">по справочнику «округ → СЦ»</div></div>`:''}
    ${c.sp.list.length?`<div><b>В поставках</b><div>${c.sp.list.map(esc).join('<br>')}</div></div>`:''}
  </div></td></tr>`;
}
function toggle(id){ OPEN.has(id)?OPEN.delete(id):OPEN.add(id); render(); }
function render(){
  const q=document.getElementById('q').value.toLowerCase().trim();
  const match=r=>!q||[r.title,r.vendor_code,String(r.nm_id),r.supplier].some(x=>String(x||'').toLowerCase().includes(q));
  const off=r=>r.archived||r.wb_archived||r.wb_trash;
  const act=P.filter(r=>!off(r)&&match(r)).map(r=>({r,c:calc(r)}));
  const arc=P.filter(r=>off(r)&&match(r)).map(r=>({r,c:calc(r)})).filter(x=>x.c.s.wh||x.c.sp.q||x.c.o.n);
  document.getElementById('thead').innerHTML=HEAD; document.getElementById('arcHead').innerHTML=HEAD;
  const key=x=>x.c.days==null?1e9:x.c.days;
  const grp={}; act.forEach(x=>{(grp[x.r.supplier||'—']=grp[x.r.supplier||'—']||[]).push(x);});
  const T=a=>a.reduce((t,x)=>({wh:t.wh+x.c.s.wh,toCl:t.toCl+x.c.s.toCl,ret:t.ret+x.c.s.ret,sp:t.sp+x.c.sp.q,n:t.n+x.c.o.n}),{wh:0,toCl:0,ret:0,sp:0,n:0});
  const totRow=(label,t)=>{ const dem=t.n/DEMAND_DAYS; return `<tr class="tot"><td colspan="2">${label}</td><td class="n">${nf.format(t.wh)}</td><td class="n">${nf.format(t.toCl)}</td><td class="n">${nf.format(t.ret)}</td><td class="n">${nf.format(t.sp)}</td><td class="n">${nf.format(t.n)}</td><td class="n">${dem?nf1.format(dem):'—'}</td>${dayCell(dem?(t.wh+t.sp)/dem:null,t.wh+t.sp)}<td></td><td></td></tr>`; };
  let html=totRow(`Итого: ${act.length} размеров`,T(act));
  Object.keys(grp).sort((a,b)=>a.localeCompare(b,'ru')).forEach(g=>{
    const a=grp[g].sort((x,y)=>key(x)-key(y)||String(x.r.vendor_code).localeCompare(String(y.r.vendor_code)));
    html+=`<tr class="group"><td colspan="${COLS}">${esc(g)} · ${a.length}</td></tr>`+a.map(x=>rowHtml(x.r,x.c)).join('');
  });
  document.getElementById('tb').innerHTML=html;
  document.getElementById('arcCount').textContent=arc.length;
  document.getElementById('arcBody').innerHTML=arc.sort((x,y)=>y.c.s.wh-x.c.s.wh).map(x=>rowHtml(x.r,x.c)).join('')||`<tr><td colspan="${COLS}" class="muted">Нет</td></tr>`;
}
if(BA_AUTH.has(SUPABASE_URL))go();
</script></body></html>
