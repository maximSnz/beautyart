        return `<tr><td title="${it.title}">${it.name}</td><td><span class="bsl"><button type="button" ${bEd?'':'disabled'} onclick="setBoost('${k}',${it.v-5})">−</button><input type="range" min="0" max="100" step="5" value="${it.v}" ${bEd?'':'disabled'} oninput="this.parentNode.querySelector('b').textContent='+'+this.value+'%'" onchange="setBoost('${k}',this.value)"><button type="button" ${bEd?'':'disabled'} onclick="setBoost('${k}',${it.v+5})">+</button><b>+${it.v}%</b></span></td><td>${nf.format(it.box)}</td></tr>`; }).join('')
      +(items.length>LT_PER?Array.from({length:LT_PER-pg.length},()=>'<tr class="pad"><td colspan="3"></td></tr>').join(''):'')
      +(items.length?'':'<tr><td colspan="3" class="mute">Ничего не найдено</td></tr>')
      +`</table>${items.length>LT_PER?pagerHtml(BT_PAGE,pages,items.length,'btPage'):''}</div>`;
  }
  h+=`</div>`;
  // сроки: у WB одна строка — WB в целом
  if(WLT){
    const inp=f=>ed?`<input class="num" type="number" min="0" step="1" value="${WLT[f]??0}" onchange="setLT('${f}',this.value)">`:(WLT[f]??0);
    h+=`<div class="ssec"><h4>Сроки реализации заявки</h4><div style="overflow-x:auto"><table class="lt2"><colgroup><col style="width:17%">${LT_F.map(()=>'<col style="width:9%">').join('')}<col style="width:7%"><col style="width:9%"><col style="width:9%"></colgroup>
      <thead><tr><th rowspan="2">Склад</th><th class="grp vs" colspan="6">Этапы поставки</th><th class="grp vs" colspan="3">Расчёт</th></tr>
      <tr>${LT_H.map((x,i)=>`<th${i?'':' class="vs"'}>${x}<span class="u">дн</span></th>`).join('')}<th class="vs">Покрытие<span class="u">дн</span></th><th>Запас<span class="u">дн</span></th><th>Вычесть заявок<span class="u">нед.</span></th></tr></thead><tbody>
      <tr><td>WB в целом</td>${LT_F.map((f,i)=>`<td${i?'':' class="vs"'}>${inp(f)}</td>`).join('')}<td class="vs"><span class="cov">${cov(WLT)}</span></td><td>${inp('target_days')}</td><td>${inp('prev_weeks')}</td></tr></tbody></table></div></div>`;
  }else h+=`<div class="ssec"><h4>Сроки реализации заявки</h4><span class="bad">Сроки WB не заданы</span></div>`;
  // размеры, которые не заказываем: поиск → выбор → чип; ✕ — вернуть в расчёт
  const xs=PROD.filter(p=>EXCL.has(p.chrt_id)).sort((a,b)=>art(a).localeCompare(art(b)));
  h+=`<div class="ssec"><h4>🚫 Товары не заказываем</h4>${HAS_EXCL?`<div class="xsearch"><input id="xq" placeholder="Найти размер: артикул или название" autocomplete="off" oninput="xSearch(this.value)"><div class="xres" id="xres"></div></div>`:'<div class="hint bad">Нужен SQL 2026-11-18_wb_purchase_settings.sql</div>'}${xs.length?`<div class="chips">${xs.map(p=>`<span class="chip" title="${esc(p.title)}">${esc(art(p))}<button title="Вернуть в расчёт" onclick="setExcl(${p.chrt_id},false)">✕</button></span>`).join('')}</div>`:''}</div>`;
  document.getElementById('lt').innerHTML=h;
}
function xSearch(q){
  const el=document.getElementById('xres'); q=String(q||'').trim().toLowerCase();
  if(q.length<2){ el.innerHTML=''; return; }
  const hits=PROD.filter(p=>!EXCL.has(p.chrt_id)&&[p.vendor_code,p.title,p.tech_size,String(p.nm_id)].some(x=>String(x||'').toLowerCase().includes(q))).slice(0,8);
  el.innerHTML=hits.length?hits.map(p=>`<div class="xi" onclick="setExcl(${p.chrt_id},true)"><b>${esc(art(p))}</b> <span>${esc(p.title)}</span></div>`).join(''):'<div class="xi mute">Ничего не найдено</div>';
}

// ===== действия =====
function shiftWeek(n){WEEK=addD(WEEK,n);loadWeek().catch(e=>document.getElementById('err').textContent='Ошибка: '+e.message);}
function fail(e){document.getElementById('err').textContent='Не сохранилось: '+e.message;}
const toInt=v=>{const n=Math.round(Number(String(v).replace(',','.')));return Number.isFinite(n)&&n>=0?n:0;};
const lineRow=(p,extra)=>({week:WEEK,chrt_id:p.chrt_id,ads:p.ads,stock:p.stock,transit:p.transit,prev_boxes:p.prev,box_qty:p.box_qty,calc_boxes:p.calc,requested_boxes:p.req,updated_at:new Date().toISOString(),...extra});
async function setReq(id,v){
  if(ST()!=='draft') return;
  const p=MODEL.find(x=>x.chrt_id===id);
  p.req=String(v).trim()===''?(p.calc||0):toInt(v); p.manual=p.req!==(p.calc||0); p.keep=true;
  try{ await upsert('wb_purchase_lines',[lineRow(p)],'week,chrt_id'); LINES.set(id,{...LINES.get(id),calc_boxes:p.calc,requested_boxes:p.req}); }catch(e){fail(e);}
  renderCards(); renderT3(); renderPal(); renderT1();
}
async function setDist(id,sc,v){
  if(ST()!=='distribution') return;
  const p=MODEL.find(x=>x.chrt_id===id); p.dist={...(p.dist||distOf(p))}; p.dist[sc]=toInt(v);
  try{ await upsert('wb_purchase_dist',SCS.map(s=>({week:WEEK,chrt_id:id,sc:s,boxes:p.dist[s]||0,updated_at:new Date().toISOString()})),'week,chrt_id,sc'); }catch(e){fail(e);}
  renderT1(); renderT3(); renderPal();
}
async function setLT(f,v){
  if(ST()!=='draft') return;
  WLT[f]=toInt(v);
  try{ await patchWeek({[f]:WLT[f]}); WEEKS[WEEK]={...WEEKS[WEEK],[f]:WLT[f]}; }catch(e){fail(e);}
  build(); render();
}
async function setMode(v){
  if(!HAS_MODE) return;
  const st=ST();
  if(!st){ MODE_NEW=v; build(); render(); return; }
  if(st!=='draft') return;
  try{ await patchWeek({demand_mode:v}); WEEKS[WEEK].demand_mode=v; build(); render(); }catch(e){fail(e);}
}
async function setBoost(g,v){
  v=Math.max(0,Math.min(100,Math.round((Number(v)||0)/5)*5));
  const st=ST(); if(!HAS_BOOST||(st&&st!=='draft')) return;
  const nb={...BOOST()}; if(v) nb[g]=v; else delete nb[g];
  if(!st){ BOOST_NEW=nb; build(); render(); return; }
  try{ await patchWeek({demand_boost:nb}); WEEKS[WEEK].demand_boost=nb; build(); render(); }catch(e){fail(e);}
}
async function setExcl(id,v){
  if(!HAS_EXCL) return;
  const p=PROD.find(x=>x.chrt_id===id); if(!p) return;
  if(!v&&!confirm(`Вернуть в расчёт «${art(p)}»? Действует сразу: черновики заявок пересчитаются.`)) return;
  try{
    if(v) await upsert('wb_purchase_excluded',[{chrt_id:id,user_email:BA_AUTH.email()||null,created_at:new Date().toISOString()}],'chrt_id');
    else{ const r=await fetch(`${SUPABASE_URL}/rest/v1/wb_purchase_excluded?chrt_id=eq.${id}`,{method:'DELETE',headers:HD}); if(!r.ok) throw new Error('wb_purchase_excluded HTTP '+r.status); }
    v?EXCL.add(id):EXCL.delete(id); build(); render();
  }catch(e){ fail(e); }
}
async function createWeek(){
  if(!WLT){ fail(new Error('нет сроков WB')); return; }
  if(!confirm(`Создать заявку WB на неделю ${ddmm(WEEK)}–${ddmm(addD(WEEK,6))}? Сроки скопируются ${LT_SRC.startsWith('copy')?'с недели '+ddmm(LT_SRC.slice(5)):'из справочника WB'}.`)) return;
  try{
    await upsert('wb_purchase_weeks',[{week:WEEK,status:'draft',...Object.fromEntries([...LT_F,'target_days','prev_weeks'].map(f=>[f,Number(WLT[f])||0])),...(HAS_MODE?{demand_mode:MODE_NEW}:{}),...(HAS_BOOST?{demand_boost:BOOST_NEW}:{})}],'week');
    await loadBase(); await loadWeek();
  }catch(e){fail(e);}
}
async function stepClick(i,el){
  const st=ST(), cur=st?STAGES.findIndex(s=>s[0]===st):-1;
  if(!st){ if(i===0) return createWeek(); return; }
  if(i===cur+1&&st==='at_buyer'){ window.open(SUPPLY_URL,'_blank'); return; }
  el.classList.add('busy');
  try{ if(i===cur+1) await nextStage(); else if(i<cur) await prevStage(i); }finally{ el.classList.remove('busy'); }
}
async function nextStage(){
  const st=ST(), err=document.getElementById('err'); err.textContent='';
  try{
    if(st==='draft'){
      if(!confirm('Отправить заявку закупщику? После этого «Заявлено» и сроки недели менять нельзя.')) return;
      const now=new Date().toISOString();
      await upsert('wb_purchase_lines',MODEL.filter(p=>p.keep).map(p=>lineRow(p,{updated_at:now})),'week,chrt_id');
      await patchWeek({status:'at_buyer',submitted_at:now});
    }else if(st==='distribution'){
      const bad=MODEL.filter(p=>secOf(p)>0&&distSum(p)!==secOf(p));
      if(bad.length){ err.textContent=`Сумма по СЦ не равна обеспеченному: ${bad.length} разм., напр. ${bad.slice(0,3).map(art).join(', ')}`; return; }
      if(!confirm('Подтвердить распределение и закрыть неделю?')) return;
      await patchWeek({status:'closed',confirmed_at:new Date().toISOString()});
    }else return;
    await loadBase(); await loadWeek();
  }catch(e){fail(e);}
}
async function prevStage(to){
  const i=STAGES.findIndex(s=>s[0]===ST()); if(i<=0) return;
  const j=to==null?i-1:to; if(j<0||j>=i) return;
  if(!confirm(`Вернуть неделю на шаг «${STAGES[j][1]}»?`)) return;
  try{ await patchWeek({status:STAGES[j][0]}); await loadBase(); await loadWeek(); }catch(e){fail(e);}
}
// ===== автораспределение по СЦ (18.11.2026, как заявка Ozon; решение владельца) =====
// Шаг 1 — обеспеченное размера (ФФ + согласовано) по СЦ в долях спроса округов за 28 дн (как по умолчанию при «Согласовано»).
// Шаг 2 — паллеты: СЦ вне нормы 0,8–1,15 (меньше 0,8 — догрузить до 0,8) выравниваются переносом коробов одного размера между СЦ:
//   донор — СЦ, где размера больше всего относительно его доли спроса, получатель — где меньше всего (и спрос там есть); итог размера не меняется;
//   донор после переноса — не ниже получателя по этой мере; СЦ в норме из нормы не выводим. Остатков по СЦ у WB нет — запас в днях по СЦ не считается.
function adNeed(x){ if(!(x>1e-9)) return 0; if(x<0.8) return 0.8-x; const lo=Math.ceil(x/1.15-1e-9), hi=Math.floor(x/0.8+1e-9); if(lo<=hi) return 0;
  const n=Math.floor(x), m=Math.ceil(x), rem=x-1.15*n, add=0.8*m-x; return add<=rem?add:-rem; }
function adPal(ps){ const P={}; ps.forEach(p=>{ if(!(p.boxes_per_pallet>0)) return; Object.entries(p.dist||{}).forEach(([s,k])=>{ if(k) P[s]=(P[s]||0)+k/p.boxes_per_pallet; }); }); return P; }
function autoDistCalc(ps){
  ps.forEach(p=>{ p.sh=scShares(p.chrt_id); p.dist=splitBoxes(secOf(p),p.sh); });
  const ratio=(p,s,k)=>p.sh[s]>0?k/(p.sh[s]*secOf(p)):Infinity;
  for(let it=0;it<4000;it++){
    const P=adPal(ps), bad=SCS.map(c=>({c,n:adNeed(P[c]||0)})).filter(x=>Math.abs(x.n)>1e-9).sort((a,b)=>Math.abs(a.n)-Math.abs(b.n));
    let moved=false;
    for(const {c,n} of bad){
      let best=null;
      for(const p of ps){ const bpp=p.boxes_per_pallet; if(!(bpp>0)) continue;
        for(const o of SCS){ if(o===c) continue;
          const [from,to]=n>0?[o,c]:[c,o]; if(!((p.dist[from]||0)>0)||!(p.sh[to]>0)) continue;
          const fA=ratio(p,from,(p.dist[from]||0)-1), tA=ratio(p,to,(p.dist[to]||0)+1);
          if(fA<tA) continue;                                              // не оголяем донора
          const po=P[o]||0, dpo=(n>0?-1:1)/bpp;
          if(adNeed(po)===0&&po>1e-9&&adNeed(po+dpo)!==0&&!(po+dpo<1e-9)) continue; // соседа в норме не ломаем
          const score=fA-tA; if(!best||score>best.score) best={p,from,to,score};
        }
      }
      if(best){ best.p.dist[best.from]--; if(!best.p.dist[best.from]) delete best.p.dist[best.from]; best.p.dist[best.to]=(best.p.dist[best.to]||0)+1; moved=true; break; }
    }
    if(!moved) break;
  }
}
async function autoDist(){
  if(ST()!=='distribution') return;
  const ps=MODEL.filter(p=>secOf(p)>0);
  if(!confirm(`Автораспределение перезапишет распределение по СЦ у ${ps.length} размеров: по долям спроса округов, с подгонкой паллет к норме. Продолжить?`)) return;
  autoDistCalc(ps);
  const now=new Date().toISOString(), rows=[];
  ps.forEach(p=>SCS.forEach(s=>rows.push({week:WEEK,chrt_id:p.chrt_id,sc:s,boxes:p.dist[s]||0,updated_at:now})));
  try{ await upsert('wb_purchase_dist',rows,'week,chrt_id,sc'); }catch(e){ fail(e); }
  render();
}
function stepNum(b,d){ const i=b.parentNode.querySelector('input'); if(!i||i.disabled) return; const x=Math.max(0,(Number(i.value)||0)+d); i.value=x; i.dispatchEvent(new Event('change',{bubbles:true})); }
function wrapNums(root){ root.querySelectorAll('input.num:not([data-stp])').forEach(i=>{ i.dataset.stp=1; const s=document.createElement('span'); s.className='stp'; s.onclick=e=>e.stopPropagation(); i.replaceWith(s); s.innerHTML='<button type="button" title="−1" onclick="stepNum(this,-1)">−</button>'; s.appendChild(i); s.insertAdjacentHTML('beforeend','<button type="button" title="+1" onclick="stepNum(this,1)">+</button>'); }); }
new MutationObserver(()=>wrapNums(document.getElementById('app'))).observe(document.getElementById('app'),{childList:true,subtree:true});
if(BA_AUTH.has(SUPABASE_URL))go();
