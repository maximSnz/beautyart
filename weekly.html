function niceScale(maxValue, tickCount = 4) {
  if (maxValue <= 0) maxValue = 1;
  const rawStep = maxValue / tickCount;
  const mag = Math.pow(10, Math.floor(Math.log10(rawStep)));
  const norm = rawStep / mag;
  let step;
  if (norm <= 1) step = mag;
  else if (norm <= 2) step = 2 * mag;
  else if (norm <= 2.5) step = 2.5 * mag;
  else if (norm <= 5) step = 5 * mag;
  else step = 10 * mag;
  return { step, max: Math.ceil(maxValue / step) * step };
}

function dailyHistory(){
  const tISO=localISO(BASE);
  const pAgg=new Map();
  for(const r of ROWS){
    const o=r.offer_id;
    const whs=new Set([...Object.keys(STOCK[o]||{}),...Object.keys(SALES[o]||{})]);
    whs.forEach(wh=>{
      const stock=STOCK[o]?.[wh]||0;
      const s1=SALES[o]?.[wh]?.[tISO]||0;
      if(stock===0&&s1===0)return;
      const cost=COST[r.product_id]||0;
      let p=pAgg.get(o);
      if(!p){p={o:o,pid:r.product_id,matrix:matrixOf(o),stock:0,sum:0,clusters:new Map()};pAgg.set(o,p);}
      p.stock+=stock; p.sum+=stock*cost;
      const cl=WHCLUSTER[wh]||'Прочее';
      if(!p.clusters.has(cl))p.clusters.set(cl,{cs:0,c1:0});
      const g=p.clusters.get(cl); g.cs+=stock; g.c1+=s1;
    });
  }
  const rows=[];
  const tMkt={m1:{sup:0,def:0},m2:{sup:0,def:0}};
  const cov={m1:{lt20:0,b2050:0,gt50:0},m2:{lt20:0,b2050:0,gt50:0}};
  const clAgg=new Map();
  pAgg.forEach(p=>{
    let up=0,down=0,total=0,s1total=0;
    p.clusters.forEach((g,c)=>{
      const dev=clusterDeviation(g.cs,g.c1);
      total+=dev; s1total+=g.c1;
      const dir=dev>0.01?'up':(dev<-0.01?'down':0);
      const chg=Math.abs(dev);
      if(dir==='up'){up+=chg; tMkt[p.matrix].sup+=dev;}
      else if(dir==='down'){down+=chg; tMkt[p.matrix].def+=dev;}
      const k=p.matrix+'|'+c;
      if(!clAgg.has(k))clAgg.set(k,{matrix:p.matrix,cluster:c,dev:0,up:0,down:0});
      const o=clAgg.get(k); o.dev+=dev;
      if(dir==='up')o.up+=chg; else if(dir==='down')o.down+=chg;
    });
    if(p.stock>0){
      const days=s1total>0?p.stock/s1total:Infinity;
      const b=days<20?'lt20':(days<=50?'b2050':'gt50');
      cov[p.matrix][b]++;
    }
    rows.push({entity_type:'product',entity_key:p.o,report_date:tISO,deviation:total,dev_up:up,dev_down:down});
  });
  clAgg.forEach(v=>rows.push({entity_type:'cluster',entity_key:v.matrix+':'+v.cluster,report_date:tISO,deviation:v.dev,dev_up:v.up,dev_down:v.down}));
  ['m1','m2'].forEach(mk=>{
    rows.push({entity_type:'market',entity_key:mk+':sup',report_date:tISO,deviation:tMkt[mk].sup,dev_up:null,dev_down:null});
    rows.push({entity_type:'market',entity_key:mk+':def',report_date:tISO,deviation:tMkt[mk].def,dev_up:null,dev_down:null});
    ['lt20','b2050','gt50'].forEach(b=>rows.push({entity_type:'coverage',entity_key:mk+':'+b,report_date:tISO,deviation:cov[mk][b],dev_up:null,dev_down:null}));
  });
  upsertHistoryMemory(rows);
  saveHistory(rows);
}
function parseCSV(t){const rows=[];let row=[],cur='',q=false;for(let i=0;i<t.length;i++){const c=t[i];if(q){if(c=='"'){if(t[i+1]=='"'){cur+='"';i++;}else q=false;}else cur+=c;}else{if(c=='"')q=true;else if(c==';'){row.push(cur);cur='';}else if(c=='\n'){row.push(cur);rows.push(row);row=[];cur='';}else if(c!='\r')cur+=c;}}if(cur!==''||row.length){row.push(cur);rows.push(row);}return rows;}

async function importFile(file){
  if(!file||importing)return;
  importing=true; document.getElementById('btnCsv').disabled=true;
  document.getElementById('progFill').classList.remove('bad');
  try{
    setP(5,'Чтение файла…');
    const text=await file.text();
    setP(15,'Разбор строк…');
    const rows=parseCSV(text);
    const agg=new Map(); let skipped=0;
    for(const r of rows){
      if(/отмен/i.test((r[4]||'').trim())){skipped++;continue;}
      const dt=(r[2]||'').trim().slice(0,10);
      if(!/^\d{4}-\d{2}-\d{2}$/.test(dt)){skipped++;continue;}
      const offer=(r[11]||'').trim(), qty=Number(r[18]||0), wh=(r[29]||'').trim();
      if(!offer||!wh||!isFinite(qty)){skipped++;continue;}
      const k=dt+'|'+offer+'|'+wh;
      agg.set(k,(agg.get(k)||0)+qty);
    }
    const out=[...agg.entries()].map(([k,qty])=>{const [sale_date,offer_id,warehouse_name]=k.split('|');return {sale_date,offer_id,warehouse_name,qty};});
    if(!out.length){ setP(100,'В файле нет подходящих строк (все пропущены).',true); setTimeout(()=>document.getElementById('progWrap').classList.add('hide'),5000); return; }
    for(let i=0;i<out.length;i+=500){
      const part=out.slice(i,i+500);
      setP(30+Math.round((i/out.length)*60),`Запись в базу: ${Math.min(i+500,out.length)} из ${out.length}…`);
      const r=await fetch(SUPABASE_URL+'/rest/v1/product_sales?on_conflict=sale_date,offer_id,warehouse_name',{method:'POST',headers:{...HD,'Content-Type':'application/json',Prefer:'resolution=merge-duplicates'},body:JSON.stringify(part)});
      if(!r.ok)throw new Error('HTTP '+r.status);
    }
    setP(100,`✔ Готово! Импортировано строк: ${out.length} (пропущено: ${skipped}). Данные обновляются…`);
    await load();
    setTimeout(()=>document.getElementById('progWrap').classList.add('hide'),5000);
  }catch(e){
    setP(100,'Ошибка импорта: '+e.message,true);
  }finally{
    importing=false; document.getElementById('btnCsv').disabled=false;
    document.getElementById('fileInput').value='';
  }
}

function clusterDeviation(cs,c1){
  if(cs<=0)return 0;
  const req=cs/T_REPORT;
  return (req-c1)/SMOOTH_DAYS;
}
function recText(pid,cs,c1,T){
  if(cs<=0)return null;
  const req=cs/T;
  const raw=req-c1;
  if(Math.abs(raw)<=Math.max(0.5,0.05*(c1>0?c1:req)))return null;
  const smooth=raw/SMOOTH_DAYS;
  const base=(c1>0?c1:req);
  const pct=Math.round(Math.abs(raw)/base*100);
  const change=Math.abs(smooth);
  if(smooth>0)return {txt:`увеличить на ${f1(smooth)} шт/день (за ${SMOOTH_DAYS} дн, +${pct}%)`,cls:'r',change};
  return {txt:`уменьшить на ${f1(-smooth)} шт/день (за ${SMOOTH_DAYS} дн, −${pct}%)`,cls:'g',change};
}
function kpiPctFromHistory(entityType, entityKey, dir){
  const recs=DEVIATION_HISTORY.filter(r=>r.entity_type===entityType&&r.entity_key===entityKey)
    .sort((a,b)=>a.report_date.localeCompare(b.report_date));
  const todayISO=localISO(BASE);
  const val=(r)=>{
    let v=(dir==='up')?r.dev_up:r.dev_down;
    if(v==null) v=(r.deviation!=null?Math.abs(Number(r.deviation)):null);
    return v!=null?Math.abs(Number(v)):null;
  };
  const curRec=recs.find(r=>r.report_date===todayISO);
  const cur=curRec?val(curRec):null;
  const prevDays=[...new Set(recs.filter(r=>r.report_date<todayISO).map(r=>r.report_date))].sort();
  const dayVals=prevDays.map(d=>{const r=recs.find(x=>x.report_date===d);return r?val(r):null;}).filter(v=>v!=null);
  const mk=(n)=>{
    if(cur==null) return null;
    if(dayVals.length<n) return {pct:null,cur:cur,base:null,abs:null,small:false};
    const last=dayVals.slice(-n);
    const base=last.reduce((s,v)=>s+v,0)/n;
    const abs=cur-base;
    if(base<MATERIAL) return {pct:null,cur:cur,base:base,abs:abs,small:true};
    let pct=(cur-base)/base*100;
    pct=Math.max(-999,Math.min(999,pct));
    return {pct:pct,cur:cur,base:base,abs:abs,small:false};
  };
  return [mk(1),mk(3),mk(7)];
}

function arcPath(cx,cy,rO,rI,a0,a1){
  const p=(r,a)=>[cx+r*Math.cos(a),cy+r*Math.sin(a)];
  const [x0,y0]=p(rO,a0),[x1,y1]=p(rO,a1),[x2,y2]=p(rI,a1),[x3,y3]=p(rI,a0);
  const large=(a1-a0)>Math.PI?1:0;
  return `M${x0.toFixed(2)} ${y0.toFixed(2)} A${rO} ${rO} 0 ${large} 1 ${x1.toFixed(2)} ${y1.toFixed(2)} L${x2.toFixed(2)} ${y2.toFixed(2)} A${rI} ${rI} 0 ${large} 0 ${x3.toFixed(2)} ${y3.toFixed(2)} Z`;
}

  svg += `<text x="${padL-8}" y="${padT-6}" text-anchor="end" font-size="10" font-weight="700" fill="#7D3673" font-family="Forum">шт/день</text>`;
  svg += `<line x1="${padL}" y1="${padT}" x2="${padL}" y2="${padT+innerH}" stroke="#94a3b8" stroke-width="1.5"/>`;
  svg += `<line x1="${padL}" y1="${padT+innerH}" x2="${W-padR}" y2="${padT+innerH}" stroke="#94a3b8" stroke-width="1.5"/>`;
  days.forEach((d, i) => { svg += `<text x="${x(i)}" y="${padT+innerH+16}" text-anchor="middle" font-size="10" fill="#94a3b8" font-family="Forum">${d.slice(8,10)}.${d.slice(5,7)}</text>`; });
  svg += `<text x="${W-padR}" y="${padT+innerH+30}" text-anchor="end" font-size="10" font-weight="700" fill="#7D3673" font-family="Forum">дни</text>`;
  const mkPath = (vals, col, dashed) => {
    if (vals.length < 2) return '';
    let dstr = `M ${x(0)} ${y(vals[0])}`;
    vals.forEach((v, i) => { if (i > 0) dstr += ` L ${x(i)} ${y(v)}`; });
    return `<path ${dashed?'':'class="chart-line"'} d="${dstr}" fill="none" stroke="${col}" stroke-width="2.5" stroke-linecap="round" ${dashed?'stroke-dasharray="6 5"':''}/>`;
  };
  [['m1',C_M1],['m2',C_M2]].forEach(([mk,col]) => {
    svg += mkPath(series[mk].sup, col, false);
    svg += mkPath(series[mk].def, col, true);
    days.forEach((d, i) => {
      const tipVal = `Профицит: +${fmt(series[mk].sup[i])} шт/день • Дефицит: ${fmt(series[mk].def[i])} шт/день`;
      svg += `<circle class="chart-point" cx="${x(i)}" cy="${y(series[mk].sup[i])}" r="3.5" fill="${col}" data-label="${MATRIX_NAME[mk]}, ${d.slice(5)}" data-value="${tipVal}"/>`;
      svg += `<circle class="chart-point" cx="${x(i)}" cy="${y(series[mk].def[i])}" r="3.5" fill="#fff" stroke="${col}" stroke-width="2" data-label="${MATRIX_NAME[mk]}, ${d.slice(5)}" data-value="${tipVal}"/>`;
    });
  });
  svg += `</svg>`;
  boxEl.querySelectorAll('svg').forEach(el => el.remove());
  boxEl.insertAdjacentHTML('beforeend', svg);
  boxEl.querySelectorAll('.chart-line').forEach(path => {
    const len = path.getTotalLength();
    path.style.strokeDasharray = len;
    path.style.strokeDashoffset = len;
    path.getBoundingClientRect();
    path.style.transition = 'stroke-dashoffset 1s ease';
    path.style.strokeDashoffset = '0';
  });
  attachChart(boxEl, tipEl);
}
function render(){

  const buildEntries=(excludeFire)=>{

      whs.forEach(wh=>{
        if(excludeFire&&FIRE.has(wh))return;
        const stock=STOCK[o]?.[wh]||0;
        const s1=SALES[o]?.[wh]?.[d1]||0, s2=SALES[o]?.[wh]?.[d2]||0, s3=SALES[o]?.[wh]?.[d3]||0, s4=SALES[o]?.[wh]?.[d4]||0;
        if(stock===0&&s1===0&&s2===0&&s3===0&&s4===0)return;
        const cost=COST[r.product_id]||0, sum=stock*cost;
        arr.push({o,pid:r.product_id,name:r.name,cost,stock,sum,s1,s2,s3,s4,cluster:WHCLUSTER[wh]||'Прочее',wh,matrix:matrixOf(o)});
      });
    }
    return arr;
  };

  const head7=`<tr><th>Наименование</th><th>Остаток</th><th>Сумма</th><th>Дней</th><th>${lbl(d3)}</th><th>${lbl(d2)}</th><th>${lbl(d1)}</th></tr>`;
  let html='';
  if(MODE==='products'||MODE==='clusters'){
    const prodAgg=new Map();
    entries.forEach(e=>{
      let p=prodAgg.get(e.o);
      if(!p){p={o:e.o,pid:e.pid,name:e.name,matrix:e.matrix,stock:0,sum:0,clusters:new Map(),pairs:[]};prodAgg.set(e.o,p);}
      p.stock+=e.stock;p.sum+=e.sum;p.pairs.push({o:e.o,wh:e.wh});
      if(!p.clusters.has(e.cluster))p.clusters.set(e.cluster,[]);
      p.clusters.get(e.cluster).push(e);
    });
    const toClArr=(p)=>[...p.clusters.entries()].map(([c,a])=>({
      c,arr:a,
      cs:a.reduce((s,e)=>s+e.stock,0), csum:a.reduce((s,e)=>s+e.sum,0),
      c1:a.reduce((s,e)=>s+e.s1,0), c2:a.reduce((s,e)=>s+e.s2,0), c3:a.reduce((s,e)=>s+e.s3,0), c4:a.reduce((s,e)=>s+e.s4,0)
    })).map(g=>{
      const dev=clusterDeviation(g.cs,g.c1);
      g.dev=dev; g.dir=dev>0.01?'up':dev<-0.01?'down':0;
      g.change=Math.abs(dev);

    const prods=[...prodAgg.values()].map(p=>{

      const btn=inFire?`<button class="wact" title="Вернуть в основной список" onclick="toggleFire('${w.id}',event)">🧯</button>`:`<button class="wact" title="В список «Пожар»" onclick="toggleFire('${w.id}',event)">🔥</button>`;
      const body=w.rows.length?w.rows.map(o=>`<tr><td>${esc(o.o)}</td><td>${esc(o.name)}</td><td class="num">${fmt(o.stock)}</td><td class="num">${fmt(o.cost)}</td><td class="num">${fmt(o.sum)}</td>${daysCell(o.stock,o.s1)}${cmpCell(o.s3,o.s4)}${cmpCell(o.s2,o.s3)}${cmpCell(o.s1,o.s2)}</tr>`).join(''):`<tr><td colspan="9" style="color:#94a3b8">нет данных</td></tr>`;
      return `<details class="wh"><summary>${btn}<span class="whname">${esc(w.name)}</span><span class="whtot">${fmt(w.sum)} ₽ • ${fmt(w.total)} шт</span></summary>
        <div class="tablewrap"><table><thead>${head}</thead><tbody>${body}</tbody></table></div></details>`;
    };
    const clusterBlock=(o,inFire)=>`<details class="cluster"><summary><span class="clname">${esc(o.c)}</span><span class="cltot">${fmt(o.ws.reduce((s,w)=>s+w.sum,0))} ₽ • ${fmt(o.ws.reduce((s,w)=>s+w.total,0))} шт</span></summary>`+o.ws.sort((a,b)=>b.sum-a.sum).map(w=>whBlock(w,inFire)).join('')+`</details>`;
    const fireList=sortC(fireC), mainList=sortC(mainC);
    if(fireList.length)html+=`<details class="fire"><summary>🔥 Пожар</summary><div class="firebody">${fireList.map(o=>clusterBlock(o,true)).join('')}</div></details>`;
    html+=mainList.map(o=>clusterBlock(o,false)).join('');
  }
  document.getElementById('clusters').innerHTML=html||'<div class="meta">Нет данных под фильтр.</div>';
  const grandEl=document.getElementById('grand');
  if(MODE==='summary'){
    grandEl.style.display='';
    const tStock=entries.reduce((s,e)=>s+e.stock,0);
    const tSum=entries.reduce((s,e)=>s+e.sum,0);
    grandEl.innerHTML=`<span>ИТОГО по всем складам:</span><span>${fmt(tSum)} ₽ • ${fmt(tStock)} шт</span>`;
  }else{ grandEl.style.display='none'; grandEl.innerHTML=''; }
}
</script></body></html>
