<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Beauty Art — Управление остатками</title>
<link href="https://fonts.googleapis.com/css2?family=Forum&display=swap" rel="stylesheet">
<style>
 body{font-family:'Forum',-apple-system,sans-serif;background:linear-gradient(135deg,#78A6C7,#E33D78,#7D3673);min-height:100vh;padding:20px;margin:0}
 .login,.wrap{max-width:1200px;margin:40px auto;background:#fff;border-radius:16px;padding:30px;box-shadow:0 10px 30px rgba(28,13,46,.3)}
 h2{font-family:'Forum';color:#1C0D2E}
 input{padding:6px 8px;border:2px solid rgba(84,66,115,.2);border-radius:8px;font-family:'Forum';font-size:.9em}
 button{padding:6px 10px;border:none;border-radius:8px;background:linear-gradient(90deg,#78A6C7,#E33D78);color:#fff;font-family:'Forum';cursor:pointer}
 button:disabled{opacity:.5;cursor:not-allowed}
 .tablewrap{overflow-x:auto;-webkit-overflow-scrolling:touch}
 table{width:100%;border-collapse:collapse;font-size:.85em;min-width:980px}
 th,td{padding:6px 8px;border-bottom:1px dashed #cbd5e1;text-align:left;vertical-align:middle}
 th{color:#666}
 .hide{display:none}
 .meta{color:#94a3b8;font-size:.85em;margin:6px 0}
 .err{color:#E33D78;font-size:.9em;margin:8px 0}
 .num{font-weight:700;color:#1C0D2E;white-space:nowrap}
 .g{color:#16a34a}.r{color:#E33D78}.o{color:#d97706}.n{color:#94a3b8}
 .rec{display:inline-block;margin-left:12px;font-size:.85em;font-weight:700;white-space:normal}
 .rec.r{color:#E33D78}.rec.g{color:#16a34a}
 .toolbar{display:flex;gap:10px;align-items:center;margin-bottom:8px;flex-wrap:wrap}
 .toolbar input[type=text]{flex:1;min-width:180px}
 .mode{display:flex;border:2px solid rgba(84,66,115,.25);border-radius:10px;overflow:hidden;flex:0 0 auto}
 .mode button{padding:7px 12px;border:none;background:#fff;color:#544273;font-family:'Forum';font-size:.85em;cursor:pointer;border-radius:0}
 .mode button.on{background:linear-gradient(90deg,#78A6C7,#E33D78);color:#fff}
 .switch{display:flex;align-items:center;gap:8px;font-size:.85em;color:#544273;white-space:nowrap;cursor:pointer;user-select:none}
 .switch input{display:none}
 .knob{width:42px;height:22px;border-radius:22px;background:#cbd5e1;position:relative;transition:.2s;flex:0 0 auto}
 .knob::after{content:"";position:absolute;top:2px;left:2px;width:18px;height:18px;border-radius:50%;background:#fff;transition:.2s}
 .switch input:checked+.knob{background:#E33D78}
 .switch input:checked+.knob::after{left:22px}
 .progress{margin:10px 0}
 .progtext{font-size:.85em;color:#544273;margin-bottom:4px}
 .progbar{height:8px;border-radius:8px;background:#e2e8f0;overflow:hidden}
 .progfill{height:100%;width:0%;background:linear-gradient(90deg,#78A6C7,#E33D78);transition:width .2s}
 .progfill.bad{background:#E33D78}
 .topblock{border:2px solid rgba(227,61,120,.3);border-radius:12px;background:#fff5f8;padding:12px 14px;margin:0 0 16px}
 .toptitle{font-family:'Forum';font-weight:700;color:#E33D78;font-size:1em;margin-bottom:8px}
 .topitem{display:flex;align-items:center;gap:8px;width:100%;text-align:left;background:#fff;border:1px solid rgba(84,66,115,.15);border-radius:8px;padding:6px 10px;margin-bottom:6px;cursor:pointer;flex-wrap:wrap}
 .topitem:hover{border-color:#E33D78}
 .topname{flex:1;color:#1C0D2E;font-weight:700;font-size:.88em;min-width:140px}
 .topdir{font-size:.8em;font-weight:700;white-space:nowrap}
 .topchg{color:#544273;font-size:.82em;white-space:nowrap}
 .kp{font-size:.75em;font-weight:700;border-radius:5px;padding:1px 6px;background:rgba(148,163,184,.12);white-space:nowrap}
 .chartcard{border:2px solid rgba(84,66,115,.12);border-radius:12px;background:#fff;padding:10px 12px;margin:0 0 14px}
 .charttitle{font-size:.85em;font-weight:700;color:#544273;margin-bottom:6px}
 @keyframes flash{0%{background:rgba(227,61,120,.35);}100%{background:transparent;}}
 .hlflash{animation:flash 2s ease;}
 details.matrix{border:3px solid rgba(125,54,115,.3);border-radius:14px;background:#fdf7fb;margin:0 0 18px}
 details.matrix>summary{cursor:pointer;padding:14px 18px;font-family:'Forum';font-weight:700;color:#1C0D2E;font-size:1.15em;list-style:none;display:flex;align-items:center;gap:12px}
 details.matrix>summary::before{content:"▸ ";}
 details.matrix[open]>summary::before{content:"▾ ";}
 details.matrix[open]>summary{border-bottom:3px solid rgba(125,54,115,.15)}
 .matrixbody{padding:14px 14px 6px}
 details.fire{border:2px dashed rgba(227,61,120,.55);border-radius:10px;background:#fff5f8;margin:0 0 16px}
 details.fire>summary{cursor:pointer;padding:12px 14px;font-family:'Forum';font-weight:700;color:#E33D78;font-size:1.05em;list-style:none;display:flex;align-items:center;gap:8px}
 details.fire>summary::before{content:"▸ ";}
 details.fire[open]>summary::before{content:"▾ ";}
 .firebody{padding:0 12px 12px}
 details.sup{border:2px solid rgba(125,54,115,.3);border-radius:12px;background:#fdf7fb;margin:0 0 16px}
 details.sup>summary{cursor:pointer;padding:12px 16px;font-family:'Forum';font-weight:700;color:#7D3673;font-size:1.05em;list-style:none;display:flex;align-items:center;gap:10px}
 details.sup>summary::before{content:"▸ ";}
 details.sup[open]>summary::before{content:"▾ ";}
 details.sup[open]>summary{border-bottom:2px solid rgba(125,54,115,.15)}
 .supbody{padding:12px 12px 4px}
 details.cluster{border:2px solid rgba(84,66,115,.15);border-radius:10px;background:#f8f9fb;margin:0 0 12px}
 details.cluster>summary{cursor:pointer;padding:10px 14px;font-family:'Forum';font-weight:700;color:#544273;user-select:none;list-style:none;display:flex;align-items:center;gap:10px}
 details.cluster>summary::before{content:"▸ ";}
 details.cluster[open]>summary::before{content:"▾ ";}
 details.cluster[open]>summary{border-bottom:2px solid rgba(84,66,115,.1)}
 .clname{flex:1;text-align:left}
 .cltot{color:#1C0D2E;font-size:.9em;white-space:nowrap;margin-left:auto}
 details.wh{margin:8px 10px;border:1px solid rgba(84,66,115,.12);border-radius:8px;background:#fff}
 details.wh>summary{cursor:pointer;padding:8px 10px;display:flex;align-items:center;gap:8px;font-weight:700;color:#33506b;list-style:none}
 details.wh>summary::before{content:"▸ ";}
 details.wh[open]>summary::before{content:"▾ ";}
 .whname{flex:1;text-align:left}
 .whtot{margin-left:auto;color:#1C0D2E;font-size:.85em;white-space:nowrap}
 tr.clrow td{background:rgba(120,166,199,.18);font-weight:700;cursor:pointer}
 tr.clrow td:first-child{color:#33506b}
 .caret{display:inline-block;margin-right:8px;transition:transform .15s}
 .clbody.closed .caret{transform:rotate(-90deg)}
 .clbody.closed tr.whrow{display:none}
 td.whcell{padding-left:30px;color:#544273}
 .wact{padding:2px 7px;font-size:.95em;margin:0}
 .grand{margin-top:14px;padding:12px 14px;border-radius:10px;background:linear-gradient(90deg,rgba(120,166,199,.2),rgba(227,61,120,.15));font-weight:700;color:#1C0D2E;display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap}
 @media (max-width:640px){
   body{padding:8px}
   .login,.wrap{padding:16px;margin:16px auto;border-radius:12px}
   h2{font-size:1.15em}
   .toolbar{flex-direction:column;align-items:stretch}
   .mode{margin-left:0}
   button{padding:10px 14px;font-size:1em}
   table{font-size:.78em;min-width:900px}
   th,td{padding:5px 6px}
   .meta{font-size:.78em}
 }
</style></head>
<body>
<div class="login" id="login">
  <h2>Закрытый раздел</h2>
  <input type="password" id="pwd" placeholder="Пароль" onkeypress="if(event.key==='Enter')go()">
  <button onclick="go()">Войти</button>
</div>
<div class="wrap hide" id="app">
  <h2>📦 Управление остатками</h2>
  <div class="meta" id="meta">загрузка…</div>
  <div class="err" id="err"></div>
  <div class="toolbar">
    <input type="text" id="q" placeholder="Поиск по названию / артикулу" oninput="render()">
    <input type="month" id="month" onchange="onMonth(this.value)">
    <button id="btnCsv" onclick="fileInput.click()">⬆ CSV продаж</button>
    <input type="file" id="fileInput" accept=".csv" style="display:none" onchange="importFile(this.files[0])">
    <button onclick="load()">⟳ Обновить</button>
    <label class="switch"><input type="checkbox" id="fireToggle" checked onchange="setIncludeFire(this.checked)"><span class="knob"></span>учитывать «пожар»</label>
    <div class="mode">
      <button id="modeSum" class="on" onclick="setMode('summary')">Сводная</button>
      <button id="modePr" onclick="setMode('products')">По товарам</button>
      <button id="modeCl" onclick="setMode('clusters')">По кластерам</button>
    </div>
  </div>
  <div class="progress hide" id="progWrap">
    <div class="progtext" id="progText">Загрузка…</div>
    <div class="progbar"><div class="progfill" id="progFill"></div></div>
  </div>
  <div id="clusters"></div>
  <div class="grand" id="grand"></div>
</div>
<script>
const PASSWORD_HASH='8c6976e5b5410415bde908bd4dee15dfb167a9c873fc4bb8a81f6f2ab448a918';
const SUPABASE_URL='https://jvoofakrkhzoblhhuyvr.supabase.co';
const ANON='sb_publishable_IA4ReUU9xTL7hb_sbsHaFA_LPATJazE';
const HD={apikey:ANON,Authorization:'Bearer '+ANON};
let ROWS=[],COST={},STOCK={},WHCLUSTER={},SALES={},SUPPLIER={},PLAN_QTY={},DATES=new Set(),BASE=null,SALESCOUNT=0;
let FIRE=new Set(JSON.parse(localStorage.getItem('fire_wh')||'[]'));
let importing=false, MODE='summary', INCLUDE_FIRE=true;
let MONTH='2026-09';
let T_REPORT=11;
const SMOOTH_DAYS=7;
const MATRIX_NAME={m1:'Алекс',m2:'Александр'};
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
const esc=s=>(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt=n=>Number(n||0).toLocaleString('ru-RU',{maximumFractionDigits:0});
const f1=n=>Number(n||0).toLocaleString('ru-RU',{maximumFractionDigits:1});
const localISO=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
const parseISO=s=>{const [y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d);};
const DOW_TARGET={0:7,1:13,2:12,3:11,4:10,5:9,6:8};
const DOW_NAME={0:'вс',1:'пн',2:'вт',3:'ср',4:'чт',5:'пт',6:'сб'};
function matrixOf(offer){ return (/^(CAP|GLV|SEAL)-/.test(offer))?'m1':'m2'; }
function setMode(m){
  MODE=m;
  document.getElementById('modeSum').classList.toggle('on',m==='summary');
  document.getElementById('modePr').classList.toggle('on',m==='products');
  document.getElementById('modeCl').classList.toggle('on',m==='clusters');
  render();
}
function setIncludeFire(v){ INCLUDE_FIRE=v; render(); }
function jump(attr,val){
  const el=document.querySelector('[data-'+attr+'="'+val+'"]');
  if(!el)return;
  let n=el;
  while(n){ if(n.tagName==='DETAILS') n.open=true; n=n.parentElement; }
  el.scrollIntoView({behavior:'smooth',block:'center'});
  el.classList.remove('hlflash'); void el.offsetWidth; el.classList.add('hlflash');
  setTimeout(()=>el.classList.remove('hlflash'),2000);
}
async function fetchAll(path){let out=[],off=0;while(true){const r=await fetch(SUPABASE_URL+path+(path.includes('?')?'&':'?')+`limit=1000&offset=${off}`,{headers:HD});if(!r.ok)throw new Error('HTTP '+r.status);const j=await r.json();out=out.concat(j);if(j.length<1000)break;off+=1000;}return out;}
async function go(){
  const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(document.getElementById('pwd').value));
  const h=[...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('');
  if(h!==PASSWORD_HASH){alert('Неверный пароль');return;}
  document.getElementById('login').classList.add('hide');
  document.getElementById('app').classList.remove('hide');
  document.getElementById('month').value=MONTH;
  load();
}
async function loadPlan(){
  const r=await fetch(SUPABASE_URL+`/rest/v1/sales_plan?month=eq.${MONTH}&select=product_id,plan_qty`,{headers:HD});
  if(!r.ok)throw new Error('HTTP '+r.status);
  PLAN_QTY={}; (await r.json()).forEach(x=>PLAN_QTY[x.product_id]=Number(x.plan_qty||0));
}
function parseCSV(t){const rows=[];let row=[],cur='',q=false;for(let i=0;i<t.length;i++){const c=t[i];if(q){if(c=='"'){if(t[i+1]=='"'){cur+='"';i++;}else q=false;}else cur+=c;}else{if(c=='"')q=true;else if(c==';'){row.push(cur);cur='';}else if(c=='\n'){row.push(cur);rows.push(row);row=[];cur='';}else if(c!='\r')cur+=c;}}if(cur!==''||row.length){row.push(cur);rows.push(row);}return rows;}
function setP(pct,txt,bad){
  document.getElementById('progWrap').classList.remove('hide');
  const f=document.getElementById('progFill');
  f.style.width=pct+'%'; f.classList.toggle('bad',!!bad);
  document.getElementById('progText').textContent=txt;
}
async function importFile(file){
  if(!file||importing)return;
  importing=true; document.getElementById('btnCsv').disabled=true;
  document.getElementById('progFill').classList.remove('bad');
  try{
    setP(5,'Чтение файла…');
    const text=await file.text();
    setP(15,'Разбор строк…');
    const rows=parseCSV(text);
    const agg=new Map(); let skipped=0;
    for(const r of rows){
      if(/отмен/i.test((r[4]||'').trim())){skipped++;continue;}
      const dt=(r[2]||'').trim().slice(0,10);
      if(!/^\d{4}-\d{2}-\d{2}$/.test(dt)){skipped++;continue;}
      const offer=(r[11]||'').trim(), qty=Number(r[18]||0), wh=(r[29]||'').trim();
      if(!offer||!wh||!isFinite(qty)){skipped++;continue;}
      const k=dt+'|'+offer+'|'+wh;
      agg.set(k,(agg.get(k)||0)+qty);
    }
    const out=[...agg.entries()].map(([k,qty])=>{const [sale_date,offer_id,warehouse_name]=k.split('|');return {sale_date,offer_id,warehouse_name,qty};});
    if(!out.length){ setP(100,'В файле нет подходящих строк (все пропущены).',true); setTimeout(()=>document.getElementById('progWrap').classList.add('hide'),5000); return; }
    for(let i=0;i<out.length;i+=500){
      const part=out.slice(i,i+500);
      setP(30+Math.round((i/out.length)*60),`Запись в базу: ${Math.min(i+500,out.length)} из ${out.length}…`);
      const r=await fetch(SUPABASE_URL+'/rest/v1/product_sales?on_conflict=sale_date,offer_id,warehouse_name',{method:'POST',headers:{...HD,'Content-Type':'application/json',Prefer:'resolution=merge-duplicates'},body:JSON.stringify(part)});
      if(!r.ok)throw new Error('HTTP '+r.status);
    }
    setP(100,`✔ Готово! Импортировано строк: ${out.length} (пропущено: ${skipped}). Данные обновляются…`);
    await load();
    setTimeout(()=>document.getElementById('progWrap').classList.add('hide'),5000);
  }catch(e){
    setP(100,'Ошибка импорта: '+e.message,true);
  }finally{
    importing=false; document.getElementById('btnCsv').disabled=false;
    document.getElementById('fileInput').value='';
  }
}
function toggleFire(id,ev){
  ev.preventDefault(); ev.stopPropagation();
  if(FIRE.has(id))FIRE.delete(id); else FIRE.add(id);
  localStorage.setItem('fire_wh',JSON.stringify([...FIRE]));
  render();
}
function daysInMonth(ym){const [y,m]=ym.split('-').map(Number);return new Date(y,m,0).getDate();}
async function load(){
  const err=document.getElementById('err'); err.textContent='';
  for(let a=1;a<=3;a++){
    try{
      const [rp,rc,rs,rl]=await Promise.all([
        fetchAll('/rest/v1/products?select=product_id,offer_id,name,stock,supplier,archived,updated_at'),
        fetchAll('/rest/v1/product_prices?select=product_id,cost,created_at&order=created_at.desc'),
        fetchAll('/rest/v1/product_stocks?select=product_id,warehouse_name,cluster,present'),
        fetchAll('/rest/v1/product_sales?select=sale_date,offer_id,warehouse_name,qty')
      ]);
      await loadPlan();
      ROWS=rp.filter(x=>!x.archived);
      const pidOffer={}; rp.forEach(p=>pidOffer[p.product_id]=p.offer_id);
      COST={}; rc.forEach(p=>{ if(COST[p.product_id]==null) COST[p.product_id]=Number(p.cost||0); });
      SUPPLIER={}; rp.forEach(p=>{ SUPPLIER[p.product_id]=(p.supplier||'').trim(); });
      STOCK={}; WHCLUSTER={};
      rs.forEach(s=>{
        const o=pidOffer[s.product_id]; if(!o)return;
        (STOCK[o]=STOCK[o]||{}); STOCK[o][s.warehouse_name]=(STOCK[o][s.warehouse_name]||0)+(s.present||0);
        if(!WHCLUSTER[s.warehouse_name])WHCLUSTER[s.warehouse_name]=s.cluster||'Прочее';
      });
      SALES={}; DATES=new Set(); let max=null;
      rl.forEach(x=>{
        DATES.add(x.sale_date);
        ((SALES[x.offer_id]=SALES[x.offer_id]||{})[x.warehouse_name]=SALES[x.offer_id][x.warehouse_name]||{});
        SALES[x.offer_id][x.warehouse_name][x.sale_date]=(SALES[x.offer_id][x.warehouse_name][x.sale_date]||0)+x.qty;
        if(!max||x.sale_date>max)max=x.sale_date;
      });
      SALESCOUNT=rl.length;
      const now=new Date();
      const yest=new Date(now.getFullYear(),now.getMonth(),now.getDate()-1);
      BASE=(DATES.has(localISO(yest)))?yest:(max?parseISO(max):yest);
      T_REPORT=DOW_TARGET[BASE.getDay()];
      const tStock=ROWS.reduce((s,x)=>s+(x.stock||0),0);
      const tSum=ROWS.reduce((s,x)=>s+(x.stock||0)*(COST[x.product_id]||0),0);
      const last=ROWS.reduce((m,x)=>x.updated_at&&x.updated_at>m?x.updated_at:m,'');
      document.getElementById('meta').textContent=`Позиций: ${ROWS.length} • ИТОГО FBO: ${fmt(tStock)} шт • ${fmt(tSum)} ₽ • отчётный день: ${localISO(BASE)} • план: ${MONTH} • норма (${DOW_NAME[BASE.getDay()]}): ${T_REPORT} дн • записей продаж: ${SALESCOUNT} • обновлено: ${last?new Date(last).toLocaleString('ru-RU'):''}`;
      render(); return;
    }catch(e){ if(a<3){await sleep(800*a);continue;} err.textContent='Ошибка загрузки: '+e.message; }
  }
}
async function onMonth(v){ if(!v)return; MONTH=v; const err=document.getElementById('err'); err.textContent='';
  try{ await loadPlan(); render(); }catch(e){ err.textContent='Ошибка: '+e.message; }
}
function daysCell(stock,s1){
  if(s1>0){const d=stock/s1;const cls=(d<7||d>13)?'r':'g';return `<td class="num ${cls}">${f1(d)}</td>`;}
  if(stock>0)return `<td class="num r">∞</td>`;
  return `<td class="num n">0</td>`;
}
function cmpCell(v,prev){
  let cls='n',ar='→';
  if(v>prev){cls='g';ar='↑';}else if(v<prev){cls='r';ar='↓';}
  return `<td class="num ${cls}">${fmt(v)} ${ar}</td>`;
}
function signedSmooth(cs,c){ if(cs<=0)return 0; const req=cs/T_REPORT; return (req-c)/SMOOTH_DAYS; }
function recText(pid,cs,c1,T){
  if(cs<=0)return null;
  const req=cs/T;
  const raw=req-c1;
  if(Math.abs(raw)<=Math.max(0.5,0.05*(c1>0?c1:req)))return null;
  const smooth=raw/SMOOTH_DAYS;
  const base=(c1>0?c1:req);
  const pct=Math.round(Math.abs(raw)/base*100);
  const change=Math.abs(smooth);
  if(smooth>0)return {txt:`увеличить на ${f1(smooth)} шт/день (за ${SMOOTH_DAYS} дн, +${pct}%)`,cls:'r',change};
  return {txt:`уменьшить на ${f1(-smooth)} шт/день (за ${SMOOTH_DAYS} дн, −${pct}%)`,cls:'g',change};
}
function planDaily(pid){ const pq=PLAN_QTY[pid]||0; return pq>0? pq/daysInMonth(MONTH):0; }
// % отклонения оборачиваемости от цели на окнах 1/3/7 дн
function kpiPct(pairs,stock){
  const out=[];
  [1,3,7].forEach(w=>{
    let sum=0;
    for(let i=0;i<w;i++){
      const dt=localISO(new Date(BASE.getFullYear(),BASE.getMonth(),BASE.getDate()-i));
      for(const pr of pairs) sum+= SALES[pr.o]?.[pr.wh]?.[dt]||0;
    }
    const A=sum/w;
    if(A<=0||stock<=0){out.push(null);return;}
    const D=stock/A;
    out.push((D-T_REPORT)/T_REPORT*100);
  });
  return out;
}
function kpiBadges(k){
  return k.map((v,i)=>{
    const lab=['1д','3д','7д'][i];
    if(v==null)return `<span class="kp n">${lab} —</span>`;
    const cls=v>0?'r':v<0?'g':'n';
    return `<span class="kp ${cls}">${lab} ${v>0?'+':''}${Math.round(v)}%</span>`;
  }).join('');
}
function devChart(mk,offers){
  const days=[]; for(let i=13;i>=0;i--) days.push(localISO(new Date(BASE.getFullYear(),BASE.getMonth(),BASE.getDate()-i)));
  let base=0; offers.forEach(o=>{ /* base below via pid map */ });
  return null;
}
function render(){
  const q=document.getElementById('q').value.toLowerCase();
  const match=r=>(r.name||'').toLowerCase().includes(q)||(r.offer_id||'').toLowerCase().includes(q);
  const d1=localISO(BASE);
  const d2=localISO(new Date(BASE.getFullYear(),BASE.getMonth(),BASE.getDate()-1));
  const d3=localISO(new Date(BASE.getFullYear(),BASE.getMonth(),BASE.getDate()-2));
  const d4=localISO(new Date(BASE.getFullYear(),BASE.getMonth(),BASE.getDate()-3));
  const lbl=x=>{const d=parseISO(x);return d.getDate()+'.'+String(d.getMonth()+1).padStart(2,'0');};
  const buildEntries=(excludeFire)=>{
    const arr=[];
    for(const r of ROWS){ if(!match(r))continue; const o=r.offer_id;
      const whs=new Set([...Object.keys(STOCK[o]||{}),...Object.keys(SALES[o]||{})]);
      whs.forEach(wh=>{
        if(excludeFire&&FIRE.has(wh))return;
        const stock=STOCK[o]?.[wh]||0;
        const s1=SALES[o]?.[wh]?.[d1]||0, s2=SALES[o]?.[wh]?.[d2]||0, s3=SALES[o]?.[wh]?.[d3]||0, s4=SALES[o]?.[wh]?.[d4]||0;
        if(stock===0&&s1===0&&s2===0&&s3===0&&s4===0)return;
        const cost=COST[r.product_id]||0, sum=stock*cost;
        arr.push({o,pid:r.product_id,name:r.name,cost,stock,sum,s1,s2,s3,s4,cluster:WHCLUSTER[wh]||'Прочее',wh,matrix:matrixOf(o)});
      });
    }
    return arr;
  };
  const entries=(MODE==='summary')?buildEntries(!INCLUDE_FIRE):buildEntries(true);
  const whRows=(arr)=>arr.sort((a,b)=>b.sum-a.sum).map(e=>`<tr class="whrow"><td class="whcell">${esc(e.wh)}</td><td class="num">${fmt(e.stock)}</td><td class="num">${fmt(e.sum)}</td>${daysCell(e.stock,e.s1)}${cmpCell(e.s3,e.s4)}${cmpCell(e.s2,e.s3)}${cmpCell(e.s1,e.s2)}</tr>`).join('');
  const head7=`<tr><th>Наименование</th><th>Остаток</th><th>Сумма</th><th>Дней</th><th>${lbl(d3)}</th><th>${lbl(d2)}</th><th>${lbl(d1)}</th></tr>`;
  let html='';
  if(MODE==='products'||MODE==='clusters'){
    const prodAgg=new Map();
    entries.forEach(e=>{
      let p=prodAgg.get(e.o);
      if(!p){p={o:e.o,pid:e.pid,name:e.name,matrix:e.matrix,stock:0,sum:0,clusters:new Map(),pairs:[]};prodAgg.set(e.o,p);}
      p.stock+=e.stock;p.sum+=e.sum;p.pairs.push({o:e.o,wh:e.wh});
      if(!p.clusters.has(e.cluster))p.clusters.set(e.cluster,[]);
      p.clusters.get(e.cluster).push(e);
    });
    const prods=[...prodAgg.values()].map(p=>{p.clArr=toClArr(p);return p;});
    function toClArr(p){return [...p.clusters.entries()].map(([c,a])=>({
      c,arr:a,
      cs:a.reduce((s,e)=>s+e.stock,0), csum:a.reduce((s,e)=>s+e.sum,0),
      c1:a.reduce((s,e)=>s+e.s1,0), c2:a.reduce((s,e)=>s+e.s2,0), c3:a.reduce((s,e)=>s+e.s3,0), c4:a.reduce((s,e)=>s+e.s4,0)
    })).map(g=>{ g.rec=recText(p.pid,g.cs,g.c1,T_REPORT); g.dir=g.rec?(g.rec.cls==='r'?'up':'down'):0; g.change=g.rec?g.rec.change:0; g.signed=signedSmooth(g.cs,g.c1); return g; }).sort((a,b)=>b.csum-a.csum);}
    const byMatrix=new Map();
    prods.forEach(p=>{if(!byMatrix.has(p.matrix))byMatrix.set(p.matrix,[]);byMatrix.get(p.matrix).push(p);});
    // Диаграммы отклонения от базы по дням
    const chartBlock=(mk)=>{
      const mProds=prods.filter(p=>p.matrix===mk);
      const offerSet=new Set(mProds.map(p=>p.o));
      let base=0; mProds.forEach(p=>base+=planDaily(p.pid));
      const days=[]; for(let i=13;i>=0;i--) days.push(localISO(new Date(BASE.getFullYear(),BASE.getMonth(),BASE.getDate()-i)));
      const vals=days.map(dt=>{
        let act=0;
        offerSet.forEach(o=>{ const wm=SALES[o]||{}; for(const wh in wm) act+= wm[wh][dt]||0; });
        return act-base;
      });
      const maxAbs=Math.max(...vals.map(v=>Math.abs(v)),1);
      const W=600,H=150,pL=8,pR=8,pT=26,pB=14;
      const X=i=>pL+i*((W-pL-pR)/(days.length-1));
      const Y=v=>pT+(1-((v+maxAbs)/(2*maxAbs)))*(H-pT-pB);
      const pts=vals.map((v,i)=>`${X(i)},${Y(v)}`).join(' ');
      return `<div class="chartcard"><div class="charttitle">📈 ${MATRIX_NAME[mk]} — отклонение от базы по дням (факт − план, шт/день)</div>
        <svg viewBox="0 0 ${W} ${H}" style="width:100%;height:auto;background:#fff;border:1px solid rgba(84,66,115,.12);border-radius:8px">
          <line x1="${pL}" y1="${Y(0)}" x2="${W-pR}" y2="${Y(0)}" stroke="#cbd5e1" stroke-dasharray="4 3"/>
          <polyline points="${pts}" fill="none" stroke="#7D3673" stroke-width="2"/>
          ${vals.map((v,i)=>`<circle cx="${X(i)}" cy="${Y(v)}" r="3" fill="${v>0?'#E33D78':v<0?'#16a34a':'#94a3b8'}"/><text x="${X(i)}" y="${Y(v)-6}" text-anchor="middle" font-size="9" fill="${v>0?'#E33D78':v<0?'#16a34a':'#94a3b8'}">${v>0?'+':''}${fmt(v)}</text>`).join('')}
        </svg></div>`;
    };
    html+=chartBlock('m1')+chartBlock('m2');
    // Топ по матрицам
    const topBlock=(mk,isProd)=>{
      let items=[];
      if(isProd){
        byMatrix.get(mk)?.forEach(p=>{
          const signed=p.clArr.reduce((s,g)=>s+g.signed,0);
          items.push({name:p.name,ref:p.o,attr:'prod',signed,pairs:p.pairs,stock:p.stock});
        });
      }else{
        const clMap=new Map();
        byMatrix.get(mk)?.forEach(p=>{p.clArr.forEach(g=>{ if(!g.dir)return;
          if(!clMap.has(g.c))clMap.set(g.c,{name:g.c,signed:0,pairs:[],stock:0});
          const c=clMap.get(g.c); c.signed+=g.signed; c.stock+=g.cs; c.pairs.push(...g.arr.map(e=>({o:e.o,wh:e.wh})));
        });});
        clMap.forEach(c=>items.push({name:c.name,ref:c.name,attr:'cluster',signed:c.signed,pairs:c.pairs,stock:c.stock}));
      }
      items=items.filter(x=>Math.abs(x.signed)>0).sort((a,b)=>Math.abs(b.signed)-Math.abs(a.signed)).slice(0,isProd?10:4);
      if(!items.length)return '';
      return `<div class="topblock"><div class="toptitle">🎯 ${MATRIX_NAME[mk]} — топ ${isProd?'товаров':'кластеров'}</div>`+
        items.map(x=>{
          const dir=x.signed>0?`<span class="topdir r">↑ увеличить</span>`:`<span class="topdir g">↓ уменьшить</span>`;
          return `<button class="topitem" onclick="jump('${x.attr}','${esc(x.ref)}')"><span class="topname">${esc(x.name)}</span>${dir}<span class="topchg">Σ ${f1(Math.abs(x.signed))} шт/день</span>${kpiBadges(kpiPct(x.pairs,x.stock))}</button>`;
        }).join('')+`</div>`;
    };
    html+=topBlock('m1',MODE==='products')+topBlock('m2',MODE==='products');
    if(MODE==='products'){
      const prodNode=(p,dir)=>{
        const cl=p.clArr.filter(g=>g.dir===dir);
        const ch=cl.reduce((s,g)=>s+g.change,0);
        let out=`<details class="cluster" data-prod="${esc(p.o)}"><summary><span class="clname">${esc(p.name)}</span><span class="cltot">Σ ${f1(ch)} шт/день • ${cl.length} кл.</span></summary><div class="tablewrap"><table><thead>${head7}</thead>`;
        cl.forEach(g=>{
          out+=`<tbody class="clbody closed"><tr class="clrow" onclick="this.closest('tbody').classList.toggle('closed')">
            <td><span class="caret">▾</span>${esc(g.c)}${g.rec?`<span class="rec ${g.rec.cls}">${g.rec.txt}</span>`:''}</td>
            <td class="num">${fmt(g.cs)}</td><td class="num">${fmt(g.csum)}</td>${daysCell(g.cs,g.c1)}${cmpCell(g.c3,g.c4)}${cmpCell(g.c2,g.c3)}${cmpCell(g.c1,g.c2)}</tr>`+whRows(g.arr)+`</tbody>`;
        });
        out+=`</table></div></details>`;
        return out;
      };
      const section=(title,arr,dir)=>{
        const list=arr.filter(p=>p.clArr.some(g=>g.dir===dir))
          .map(p=>{p._ch=p.clArr.filter(g=>g.dir===dir).reduce((s,g)=>s+g.change,0);return p;})
          .sort((a,b)=>b._ch-a._ch);
        if(!list.length)return '';
        const total=list.reduce((s,p)=>s+p._ch,0);
        return `<details class="sup"><summary><span class="clname">${title} — ${list.length} поз.</span><span class="cltot">Σ ${f1(total)} шт/день</span></summary><div class="supbody">`+list.map(p=>prodNode(p,dir)).join('')+`</div></details>`;
      };
      [...byMatrix.keys()].sort().forEach(mk=>{
        const arr=byMatrix.get(mk);
        const mSum=arr.reduce((s,p)=>s+p.sum,0), mStock=arr.reduce((s,p)=>s+p.stock,0);
        html+=`<details class="matrix"><summary><span class="clname">${MATRIX_NAME[mk]}</span><span class="cltot">${fmt(mSum)} ₽ • ${fmt(mStock)} шт</span></summary><div class="matrixbody">`;
        html+=section('📦 Профицит (увеличить продажи)',arr,'up');
        html+=section('⛔ Дефицит (снизить продажи)',arr,'down');
        html+=`</div></details>`;
      });
    }else{
      const clusterNode=(cname,list)=>{
        const ch=list.reduce((s,x)=>s+x.change,0);
        let out=`<details class="cluster" data-cluster="${esc(cname)}"><summary><span class="clname">${esc(cname)}</span><span class="cltot">Σ ${f1(ch)} шт/день • ${list.length} поз.</span></summary><div class="tablewrap"><table><thead>${head7}</thead>`;
        list.sort((a,b)=>b.change-a.change).forEach(x=>{
          out+=`<tbody class="clbody closed"><tr class="clrow" onclick="this.closest('tbody').classList.toggle('closed')">
            <td><span class="caret">▾</span>${esc(x.name)}${x.rec?`<span class="rec ${x.rec.cls}">${x.rec.txt}</span>`:''}</td>
            <td class="num">${fmt(x.cs)}</td><td class="num">${fmt(x.csum)}</td>${daysCell(x.cs,x.c1)}${cmpCell(x.c3,x.c4)}${cmpCell(x.c2,x.c3)}${cmpCell(x.c1,x.c2)}</tr>`+whRows(x.arr)+`</tbody>`;
        });
        out+=`</table></div></details>`;
        return out;
      };
      const clusterSection=(title,pc,dir)=>{
        const list=pc.filter(x=>x.dir===dir);
        if(!list.length)return '';
        const byCl=new Map();
        list.forEach(x=>{if(!byCl.has(x.cluster))byCl.set(x.cluster,[]);byCl.get(x.cluster).push(x);});
        const clusters=[...byCl.entries()].map(([c,a])=>({c,a,ch:a.reduce((s,x)=>s+x.change,0)})).sort((a,b)=>b.ch-a.ch);
        const total=clusters.reduce((s,c)=>s+c.ch,0);
        return `<details class="sup"><summary><span class="clname">${title} — ${clusters.length} кл.</span><span class="cltot">Σ ${f1(total)} шт/день</span></summary><div class="supbody">`+clusters.map(cl=>clusterNode(cl.c,cl.a)).join('')+`</div></details>`;
      };
      [...byMatrix.keys()].sort().forEach(mk=>{
        const arr=byMatrix.get(mk);
        const pc=[];
        arr.forEach(p=>{p.clArr.forEach(g=>{ if(g.dir) pc.push({o:p.o,name:p.name,cluster:g.c,cs:g.cs,csum:g.csum,c1:g.c1,c2:g.c2,c3:g.c3,c4:g.c4,rec:g.rec,dir:g.dir,change:g.change,signed:g.signed,arr:g.arr}); });});
        const mSum=arr.reduce((s,p)=>s+p.sum,0), mStock=arr.reduce((s,p)=>s+p.stock,0);
        html+=`<details class="matrix"><summary><span class="clname">${MATRIX_NAME[mk]}</span><span class="cltot">${fmt(mSum)} ₽ • ${fmt(mStock)} шт</span></summary><div class="matrixbody">`;
        html+=clusterSection('📦 Профицит (увеличить продажи)',pc,'up');
        html+=clusterSection('⛔ Дефицит (снизить продажи)',pc,'down');
        html+=`</div></details>`;
      });
    }
  }else{
    const whMap=new Map();
    entries.forEach(e=>{if(!whMap.has(e.wh))whMap.set(e.wh,{id:e.wh,name:e.wh,cluster:e.cluster,rows:[]});whMap.get(e.wh).rows.push(e);});
    whMap.forEach(w=>{w.rows.sort((a,b)=>b.sum-a.sum);w.total=w.rows.reduce((s,x)=>s+x.stock,0);w.sum=w.rows.reduce((s,x)=>s+x.sum,0);});
    const mainC=new Map(), fireC=new Map();
    whMap.forEach(w=>{const t=FIRE.has(w.id)?fireC:mainC;if(!t.has(w.cluster))t.set(w.cluster,[]);t.get(w.cluster).push(w);});
    const sortC=map=>[...map.entries()].map(([c,ws])=>({c,ws,sum:ws.reduce((s,w)=>s+w.sum,0)})).sort((a,b)=>b.sum-a.sum);
    const head=`<tr><th>Артикул</th><th>Название</th><th>Остаток</th><th>Цена</th><th>Сумма</th><th>Дней</th><th>${lbl(d3)}</th><th>${lbl(d2)}</th><th>${lbl(d1)}</th></tr>`;
    const whBlock=(w,inFire)=>{
      const btn=inFire?`<button class="wact" title="Вернуть в основной список" onclick="toggleFire('${w.id}',event)">🧯</button>`:`<button class="wact" title="В список «Пожар»" onclick="toggleFire('${w.id}',event)">🔥</button>`;
      const body=w.rows.length?w.rows.map(o=>`<tr><td>${esc(o.o)}</td><td>${esc(o.name)}</td><td class="num">${fmt(o.stock)}</td><td class="num">${fmt(o.cost)}</td><td class="num">${fmt(o.sum)}</td>${daysCell(o.stock,o.s1)}${cmpCell(o.s3,o.s4)}${cmpCell(o.s2,o.s3)}${cmpCell(o.s1,o.s2)}</tr>`).join(''):`<tr><td colspan="9" style="color:#94a3b8">нет данных</td></tr>`;
      return `<details class="wh"><summary>${btn}<span class="whname">${esc(w.name)}</span><span class="whtot">${fmt(w.sum)} ₽ • ${fmt(w.total)} шт</span></summary>
        <div class="tablewrap"><table><thead>${head}</thead><tbody>${body}</tbody></table></div></details>`;
    };
    const clusterBlock=(o,inFire)=>`<details class="cluster"><summary><span class="clname">${esc(o.c)}</span><span class="cltot">${fmt(o.ws.reduce((s,w)=>s+w.sum,0))} ₽ • ${fmt(o.ws.reduce((s,w)=>s+w.total,0))} шт</span></summary>`+o.ws.sort((a,b)=>b.sum-a.sum).map(w=>whBlock(w,inFire)).join('')+`</details>`;
    const fireList=sortC(fireC), mainList=sortC(mainC);
    if(INCLUDE_FIRE&&fireList.length)html+=`<details class="fire"><summary>🔥 Пожар</summary><div class="firebody">${fireList.map(o=>clusterBlock(o,true)).join('')}</div></details>`;
    html+=mainList.map(o=>clusterBlock(o,false)).join('');
  }
  document.getElementById('clusters').innerHTML=html||'<div class="meta">Нет данных под фильтр.</div>';
  const grandEl=document.getElementById('grand');
  if(MODE==='summary'){
    grandEl.style.display='';
    const tStock=entries.reduce((s,e)=>s+e.stock,0);
    const tSum=entries.reduce((s,e)=>s+e.sum,0);
    grandEl.innerHTML=`<span>ИТОГО по всем складам:</span><span>${fmt(tSum)} ₽ • ${fmt(tStock)} шт</span>`;
  }else{ grandEl.style.display='none'; grandEl.innerHTML=''; }
}
</script></body></html>
