name: ozon-api-probe
on:
  workflow_dispatch:   # только ручной запуск; только чтение из Ozon, в базу не пишет
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20' }
      - name: Probe Ozon API (structure only)
        run: node scripts/ozon_api_probe.mjs
        env:
          OZON_CLIENT_ID: ${{ secrets.OZON_CLIENT_ID }}
          OZON_API_KEY: ${{ secrets.OZON_API_KEY }}
