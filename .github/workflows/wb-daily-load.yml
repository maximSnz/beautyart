name: wb-daily-load
# Ночная загрузка WB (ИП): заказы («Лента заказов» API), остатки по складам, поставки → wb_orders, wb_stock_history, wb_supplies,
# wb_supply_goods — после wb-products-sync. Запись в базу — только если переменная репозитория WB_LOAD_WRITE = 1
# (Settings → Variables) или при ручном запуске с write=1; иначе режим проверки — в базу ничего не пишется.
# Итоги — в журнал бота администратора (admin_load_log, «WB»); ошибка — сообщение в Telegram.
on:
  workflow_run:
    workflows: [wb-products-sync]
    types: [completed]
  workflow_dispatch:
    inputs:
      day:
        description: 'День ГГГГ-ММ-ДД (пусто — вчера по Москве)'
        required: false
        default: ''
      write:
        description: 'Записать в базу (1) или только проверить (0)'
        type: choice
        options: ['0', '1']
        default: '0'
concurrency: wb-daily-load
jobs:
  load:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20' }
      - name: WB API -> Supabase
        run: node scripts/wb_daily_load.mjs
        env:
          DAY: ${{ github.event.inputs.day }}
          WRITE: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.write || vars.WB_LOAD_WRITE || '0' }}
          WB_API_TOKEN: ${{ secrets.WB_API_TOKEN }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      - name: Журнал бота администратора (всегда, даже при ошибке)
        if: always()
        run: node scripts/admin_notify.mjs
        env:
          MODE: load
          LOAD: wb
          STATUS: ${{ job.status }}
          DAY: ${{ github.event.inputs.day }}
          WRITE: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.write || vars.WB_LOAD_WRITE || '0' }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
