name: wb-ads-probe
# Проба API рекламы WB: кампании, фактические затраты, расход по артикулам и дням (fullstats).
# Только чтение из WB, в базу не пишет; в лог — без рублей (репозиторий публичный), суммы — в Telegram.
on:
  workflow_dispatch:
    inputs:
      from:
        description: 'С ГГГГ-ММ-ДД'
        required: false
        default: '2026-10-26'
      to:
        description: 'По ГГГГ-ММ-ДД (период не больше 31 дня)'
        required: false
        default: '2026-11-01'
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20' }
      - name: WB ads probe
        run: node scripts/wb_ads_probe.mjs
        env:
          FROM: ${{ github.event.inputs.from }}
          TO: ${{ github.event.inputs.to }}
          WB_API_TOKEN: ${{ secrets.WB_API_TOKEN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
