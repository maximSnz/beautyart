name: ozon-products-sync
on:
  workflow_dispatch:
  schedule:
    - cron: '0 22 * * *'   # 22:00 UTC = 01:00 Мск, раз в сутки: GitHub задерживает плановые запуски на часы — встаём в очередь раньше
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      # день заказа по UTC кончается в 03:00 Мск — раньше 03:05 Мск ждём, иначе ночная загрузка возьмёт неполный вчерашний день
      - name: Wait until 03:05 Msk
        if: github.event_name == 'schedule'
        run: |
          if [ "$(date -u +%H)" -ge 21 ]; then
            s=$(( $(date -u -d 'tomorrow 00:05' +%s) - $(date -u +%s) )); echo "Ждём $((s/60)) мин до 03:05 Мск"; sleep $s
          fi
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20' }
      - name: Sync Ozon -> Supabase
        run: node scripts/ozon_to_supabase.mjs
        env:
          OZON_CLIENT_ID: ${{ secrets.OZON_CLIENT_ID }}
          OZON_API_KEY: ${{ secrets.OZON_API_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
