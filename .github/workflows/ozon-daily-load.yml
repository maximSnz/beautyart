name: ozon-daily-load
# Ночная загрузка из API Ozon вместо CSV (заказы, остатки, отклонения, начисления, реклама, пересчёт CF) — после ozon-products-sync.
# Запись в базу — только если переменная репозитория OZON_LOAD_WRITE = 1 (Settings → Variables) или при ручном запуске с write=1;
# иначе режим проверки: всё считается и сверяется с базой, в базу ничего не пишется.
on:
  workflow_run:
    workflows: [ozon-products-sync]
    types: [completed]
  workflow_dispatch:
    inputs:
      day:
        description: 'День ГГГГ-ММ-ДД (пусто — вчера по Москве)'
        required: false
        default: ''
      write:
        description: 'Записать в базу (1) или только проверить (0)'
        type: choice
        options: ['0', '1']
        default: '0'
concurrency: ozon-daily-load
jobs:
  load:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20' }
      - name: Ozon API -> Supabase (daily)
        run: node scripts/ozon_daily_load.mjs
        env:
          DAY: ${{ github.event.inputs.day }}
          WRITE: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.write || vars.OZON_LOAD_WRITE || '0' }}
          OZON_CLIENT_ID: ${{ secrets.OZON_CLIENT_ID }}
          OZON_API_KEY: ${{ secrets.OZON_API_KEY }}
          OZON_PERF_CLIENT_ID: ${{ secrets.OZON_PERF_CLIENT_ID }}
          OZON_PERF_CLIENT_SECRET: ${{ secrets.OZON_PERF_CLIENT_SECRET }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      - name: Telegram — сводка владельцу (всегда, даже при ошибке)
        if: always()
        run: node scripts/admin_notify.mjs
        env:
          MODE: load
          STATUS: ${{ job.status }}
          DAY: ${{ github.event.inputs.day }}
          WRITE: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.write || vars.OZON_LOAD_WRITE || '0' }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
