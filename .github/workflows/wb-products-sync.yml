name: wb-products-sync
# Карточки и размеры WB → wb_products (база ИП). Пишет только поля WB; поля закупки ведёт wb-products.html.
on:
  workflow_dispatch:
  schedule:
    - cron: '15 21 * * *'   # 21:15 UTC = 00:15 Мск: GitHub задерживает плановые запуски на часы — встаём в очередь сразу после конца дня по Москве (день WB — по Мск), за ним wb-daily-load
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20' }
      - name: Sync WB cards -> Supabase
        run: node scripts/wb_products_sync.mjs
        env:
          WB_API_TOKEN: ${{ secrets.WB_API_TOKEN }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
