<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Beauty Art - Закрытый раздел</title>
    <link href="https://fonts.googleapis.com/css2?family=Forum&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Forum', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #78A6C7 0%, #E33D78 50%, #7D3673 100%);
            min-height: 100vh;
            display: flex; align-items: center; justify-content: center;
            padding: 20px;
        }
        body.content-visible { display: block; padding: 40px 20px; }
        
        .login-box {
            background: white; border-radius: 16px; padding: 40px;
            box-shadow: 0 10px 40px rgba(28, 13, 46, 0.3);
            border: 2px solid rgba(84, 66, 115, 0.2);
            width: 100%; max-width: 400px; text-align: center;
        }
        .login-logo { width: 80px; height: auto; margin-bottom: 15px; }
        .login-title { font-family: 'Forum', serif; font-size: 1.8em; color: #1C0D2E; margin-bottom: 10px; }
        .login-subtitle { color: #666; font-size: 0.95em; margin-bottom: 25px; font-family: 'Forum', serif; }
        .password-input {
            width: 100%; padding: 14px 16px; border: 2px solid rgba(84, 66, 115, 0.2);
            border-radius: 10px; font-size: 1em; font-family: 'Forum', serif; margin-bottom: 15px;
        }
        .password-input:focus { outline: none; border-color: #E33D78; }
        .login-btn {
            width: 100%; padding: 14px; background: linear-gradient(135deg, #78A6C7, #E33D78);
            color: white; border: none; border-radius: 10px; font-size: 1.05em;
            font-family: 'Forum', serif; cursor: pointer; transition: all 0.3s;
        }
        .login-btn:hover { transform: translateY(-2px); box-shadow: 0 6px 20px rgba(227,61,120,0.4); }
        .error-message { display: none; color: #E33D78; font-size: 0.9em; margin-top: 15px; font-family: 'Forum', serif; }
        
        .protected-content { display: none; width: 100%; max-width: 1200px; margin: 0 auto; }
        .protected-content.visible { display: block; }
        
        .header {
            display: flex; align-items: center; gap: 20px; margin-bottom: 20px;
            padding: 25px 30px; background: rgba(255,255,255,0.15);
            backdrop-filter: blur(20px); border-radius: 16px;
            border: 2px solid rgba(255,255,255,0.3);
        }
        .header img { width: 80px; height: auto; }
        .company-name { font-family: 'Forum', serif; font-size: 2.5em; color: white; letter-spacing: 2px; }
        h1 { color: white; text-align: center; margin-bottom: 30px; font-size: 2.2em; font-family: 'Forum', serif; }
        .back-link { display: inline-block; color: white; font-family: 'Forum', serif; margin-bottom: 20px; text-decoration: none; font-size: 1.1em; }
        .back-link:hover { opacity: 0.8; }
        
        .block {
            background: white; border-radius: 16px; padding: 30px; margin-bottom: 30px;
            box-shadow: 0 10px 30px rgba(28,13,46,0.3); border: 2px solid rgba(84,66,115,0.2);
        }
        .block-title {
            font-size: 1.8em; margin-bottom: 25px; color: #1C0D2E; display: flex;
            align-items: center; gap: 10px; font-family: 'Forum', serif;
            border-bottom: 3px solid #78A6C7; padding-bottom: 15px;
        }
        .icon { font-size: 1.5em; }
        .three-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px; }
        .column {
            background: #f8f9fb; border-radius: 12px; padding: 20px;
            border: 2px solid rgba(84,66,115,0.2); display: flex; flex-direction: column;
        }
        .column-title {
            font-size: 1.3em; color: #544273; margin-bottom: 15px;
            padding-bottom: 10px; border-bottom: 2px solid #78A6C7; font-family: 'Forum', serif;
        }
        .column-items { display: flex; flex-direction: column; gap: 10px; }
        .table-card {
            background: white; padding: 15px; border-radius: 10px; text-decoration: none;
            color: #333; transition: all 0.3s; border: 2px solid transparent; display: block;
        }
        .table-card:hover { transform: translateY(-3px); box-shadow: 0 6px 15px rgba(84,66,115,0.2); border-color: #78A6C7; }
        .table-card h3 { font-size: 1em; margin-bottom: 4px; color: #544273; font-family: 'Forum', serif; }
        .table-card p { font-size: 0.85em; color: #666; font-family: 'Forum', serif; }
        
        @media (max-width: 900px) { .three-grid { grid-template-columns: 1fr; } }
    </style>
</head>
<body>
    <div class="login-box" id="loginBox">
        <img src="https://i.ibb.co/ZzbPQmQt/IMG-8031.png" alt="Logo" class="login-logo">
        <div class="login-title">Закрытый раздел</div>
        <div class="login-subtitle">Введите пароль для доступа</div>
        <input type="password" id="passwordInput" class="password-input" placeholder="Пароль" onkeypress="if(event.key==='Enter')checkPassword()">
        <button class="login-btn" onclick="checkPassword()">Войти</button>
        <div class="error-message" id="errorMessage">Неверный пароль. Попробуйте ещё раз.</div>
    </div>

    <div class="protected-content" id="protectedContent">
        <a href="index.html" class="back-link">← Вернуться на главную</a>
        <div class="header">
            <img src="https://i.ibb.co/ZzbPQmQt/IMG-8031.png" alt="Logo">
            <div class="company-name">Beauty Art</div>
        </div>
        <h1>Закрытый раздел</h1>
        
        <div class="block">
            <div class="block-title"><span class="icon">🔒</span> Служебные документы</div>
            <div class="three-grid">
                <div class="column">
                    <div class="column-title">Пример раздела</div>
                    <div class="column-items">
                        <a href="#" target="_blank" class="table-card">
                            <h3>Пример ссылки</h3><p>Описание документа</p>
                        </a>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        // ⚠️ ЗАМЕНИТЕ на хеш вашего пароля из Шага 1
        const PASSWORD_HASH = '8c6976e5b5410415bde908bd4dee15dfb167a9c873fc4bb8a81f6f2ab448a918';

        async function hashPassword(password) {
            const encoder = new TextEncoder();
            const data = encoder.encode(password);
            const hashBuffer = await crypto.subtle.digest('SHA-256', data);
            const hashArray = Array.from(new Uint8Array(hashBuffer));
            return hashArray.map(b => b.toString(16).padStart(2, '0')).join('');
        }

        async function checkPassword() {
            const input = document.getElementById('passwordInput').value;
            const errorEl = document.getElementById('errorMessage');
            if (!input) { errorEl.style.display = 'block'; errorEl.textContent = 'Введите пароль'; return; }
            const inputHash = await hashPassword(input);
            if (inputHash === PASSWORD_HASH) {
                document.getElementById('loginBox').style.display = 'none';
                document.getElementById('protectedContent').classList.add('visible');
                document.body.classList.add('content-visible');
                sessionStorage.setItem('accessGranted', 'true');
            } else {
                errorEl.style.display = 'block';
                errorEl.textContent = 'Неверный пароль. Попробуйте ещё раз.';
                document.getElementById('passwordInput').value = '';
            }
        }

        if (sessionStorage.getItem('accessGranted') === 'true') {
            document.getElementById('loginBox').style.display = 'none';
            document.getElementById('protectedContent').classList.add('visible');
            document.body.classList.add('content-visible');
        }
    </script>
</body>
</html>
