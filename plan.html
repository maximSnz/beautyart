<html lang="ru">
<head>

<title>Beauty Art — Реализация плана продаж</title>
<link href="https://fonts.googleapis.com/css2?family=Forum&display=swap" rel="stylesheet">
<style>
 .login-box {
    max-width: 400px;
    margin: 100px auto;
    background: white;
    border-radius: 16px;
    padding: 40px;
    box-shadow: 0 10px 40px rgba(28,13,46,0.3);
    border: 2px solid rgba(84,66,115,0.2);
    text-align: center;
}

.login-logo {
    width: 80px;
    height: auto;
    margin-bottom: 15px;
}

.login-title {
    font-family: 'Forum', serif;
    font-size: 1.8em;
    color: #1C0D2E;
    margin-bottom: 10px;
}

.login-subtitle {
    color: #666;
    font-size: 0.95em;
    margin-bottom: 25px;
    font-family: 'Forum', serif;
}

.password-input {
    width: 100%;
    padding: 14px 16px;
    border: 2px solid rgba(84,66,115,0.2);
    border-radius: 10px;
    font-size: 1em;
    font-family: 'Forum', serif;
    margin-bottom: 15px;
    box-sizing: border-box;
}

.password-input:focus {
    outline: none;
    border-color: #E33D78;
}

.login-btn {
    width: 100%;
    padding: 14px;
    background: linear-gradient(135deg, #78A6C7, #E33D78);
    color: white;
    border: none;
    border-radius: 10px;
    font-size: 1.05em;
    font-family: 'Forum', serif;
    cursor: pointer;
    transition: all 0.3s;
}

.login-btn:hover {
    transform: translateY(-2px);
    box-shadow: 0 6px 20px rgba(227,61,120,0.4);
}

.error-message {
    display: none;
    color: #E33D78;
    font-size: 0.9em;
    margin-top: 15px;
    font-family: 'Forum', serif;
}
 body{font-family:'Forum',-apple-system,sans-serif;background:linear-gradient(135deg,#78A6C7,#E33D78,#7D3673);min-height:100vh;padding:20px;margin:0}
 .login{max-width:1200px;margin:40px auto;background:#fff;border-radius:16px;padding:30px;box-shadow:0 10px 30px rgba(28,13,46,.3)}

 .tablewrap{overflow-x:auto;-webkit-overflow-scrolling:touch}
 table{width:100%;border-collapse:collapse;font-size:.78em;min-width:900px}
 th,td{padding:5px 7px;border-bottom:1px dashed #cbd5e1;text-align:left;vertical-align:middle}
 th{color:#666;white-space:nowrap}

 .factcell{color:#94a3b8}
 td.wcell.factcell{color:#1C0D2E}  /* недельный факт — как месячные значения (30.10.2026) */

 .editable{cursor:pointer;white-space:nowrap}
 .editable::after{content:" ✎";opacity:.3;font-size:.8em}

 td.okey{cursor:pointer}
 td.okey:hover{color:#E33D78}

 .stocklink{color:#544273;text-decoration:underline;transition:transform .2s ease,color .2s;display:inline-block}
 .stocklink:hover{transform:scale(1.05);color:#E33D78}
 tr.zeroplan td{opacity:.45}
 tr.rowdown td{background:rgba(227,61,120,.12)}
 tr.rowup td{background:rgba(22,163,74,.12)}
 tr.anareq td{background:rgba(227,61,120,.6)!important;font-weight:700} /* запрос аналитики от РОПа — важнее подсветки роста/падения */

 /* протокол не влияет на ширину колонок таблицы: занимает всю строку, широкие таблицы внутри прокручиваются (30.10.2026) */

 .pnote{border:1px solid rgba(84,66,115,.1);border-radius:6px;padding:6px 10px;margin-bottom:5px;background:#fefefe}

 .pnote button{padding:1px 6px;font-size:.75em;margin-top:4px}

 .progfill.bad{background:#E33D78}
 th.mhead{background:linear-gradient(90deg,rgba(120,166,199,.18),transparent);color:#544273;font-size:.95em}
 th.sub{background:rgba(120,166,199,.1)}
 th.whead{background:rgba(227,61,120,.08);color:#7D3673}
 th.wsub{background:rgba(227,61,120,.05);font-size:.75em}
 .mtoggle{padding:0 5px;margin-right:4px;background:none;border:1px solid rgba(84,66,115,.3);border-radius:5px;color:#544273;cursor:pointer;font-size:.8em}
 td.wcell{background:rgba(227,61,120,.03)}
 th.sep,td.sep{border-left:1px dashed rgba(84,66,115,.3)}
 tr.mgroup td{background:linear-gradient(90deg,rgba(125,54,115,.18),transparent);font-weight:700;color:#7D3673;padding-top:12px;border-bottom:2px solid rgba(125,54,115,.25)}
 tr.mgroup button{background:none;border:1px solid rgba(125,54,115,.4);border-radius:5px;color:#7D3673;cursor:pointer;padding:0 6px;margin-right:6px}
 .mxcard{border:2px solid rgba(84,66,115,.12);border-radius:12px;background:#fff;padding:12px 14px;margin:0 0 14px}
 .mxtitle{font-family:'Forum';font-weight:700;color:#544273;font-size:1em;margin-bottom:8px}
 .totalhead{cursor:pointer;user-select:none}
 .totalhead:hover{color:#E33D78}
 .totalcaret{display:inline-block;margin-right:6px;color:#544273}
 .mxbody{display:flex;gap:12px;align-items:stretch;flex-wrap:wrap;min-height:280px}
 .panel{border:1px solid rgba(84,66,115,.15);border-radius:12px;background:#fff;padding:10px 12px;display:flex;flex-direction:column;gap:8px;min-width:0}
 .panelhead{display:flex;align-items:center;gap:8px}
 .paneltitle{font-family:'Forum';font-size:.82em;font-weight:700;color:#544273}
 .panelhead .pieSwitch{margin-left:auto}
 .panel-charts{flex:1 1 520px;min-width:460px}
.panel-speedo {
  flex: 0 0 168px;
  width: 168px;
}
.speedo-wrap {
  flex: 1;
  display: flex;
  flex-direction: column;
  justify-content: space-evenly;
  gap: 6px;
}
.speedo-item {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 2px;
  border-radius: 10px;
  padding: 4px 2px;
}
.speedo-item.clickable { cursor: pointer; transition: background .15s; }
.speedo-item.clickable:hover { background: rgba(120,166,199,.12); }
.speedo-label {
  font-family: 'Forum';
  font-size: .78em;

}
.speedo-svg {

}
.speedo-val {
  font-family: 'Forum';

}
.speedo-val.ok { color: #16a34a; }
.speedo-val.warn { color: #d97706; }

}
 .panel-kpi{flex:1 1 100%;min-width:0}
 .piesrow{display:flex;gap:10px;flex:1;align-items:flex-start}
 .piecard{display:flex;flex-direction:column;flex:0 0 242px;width:242px;overflow:hidden}
 .ptitle{font-size:.72em;color:#94a3b8;font-weight:700;margin-bottom:4px}
 .piebox{display:flex;flex-direction:column;gap:8px;align-items:flex-start;width:100%}
 .pieWrap{position:relative;width:120px;height:120px;flex:0 0 auto}
 svg.pie{width:100%;height:100%;display:block;animation:piein .5s ease}
 @keyframes piein{from{opacity:0;transform:scale(.9) rotate(-15deg)}to{opacity:1;transform:none}}
 .seg{cursor:pointer;transition:transform .18s ease,opacity .18s ease;transform-origin:110px 110px}
 .seg:hover,.seg.hl{transform:scale(1.06)}
 svg.dim .seg:not(:hover):not(.hl){opacity:.4}
 .pieCenter{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;pointer-events:none;text-align:center;padding:0 18px}
 .pcVal{font-size:.72em;font-weight:700;color:#1C0D2E;line-height:1.1}
 .pcCap{font-size:.6em;color:#94a3b8;margin-top:2px}
 .tip{position:fixed;z-index:50;background:#1C0D2E;color:#fff;border-radius:8px;padding:6px 10px;font-size:.78em;pointer-events:none;opacity:0;transition:opacity .12s;white-space:nowrap;box-shadow:0 4px 14px rgba(28,13,46,.4)}
 .legend{font-size:.72em;color:#544273}
 .lrow{display:flex;align-items:center;gap:8px;margin:4px 0;white-space:nowrap;cursor:pointer;padding:3px 6px;border-radius:6px;transition:background .15s;width:100%;overflow:hidden}
 .lrow:hover,.lrow.hl{background:rgba(120,166,199,.18)}
 .dot{width:12px;height:12px;border-radius:3px;display:inline-block;flex:0 0 auto}

 .kpisrow{display:flex;align-items:stretch;flex:1;gap:0}

 .kpititle{font-size:.72em;color:#94a3b8;font-weight:700;flex:0 0 auto}
 .kpirow{flex:1 1 0;min-height:0;padding:4px 2px;border-bottom:1px dashed rgba(84,66,115,.12)}
 .kpirow:last-child{border-bottom:none}
 .klabel{font-size:.66em;color:#94a3b8;white-space:nowrap}
 .kval{font-size:.95em;font-weight:700;color:#1C0D2E;white-space:nowrap}
 .panel-hypotheses{flex:1 1 100%;width:100%}

 .hypo-num{font-family:'Forum';font-size:1.8em;font-weight:700;line-height:1;color:#1C0D2E;margin-bottom:4px}
 .hypo-active .hypo-num{color:#64748b}
 .hypo-success .hypo-num{color:#16a34a}
 .hypo-fail .hypo-num{color:#E33D78}
 .hypo-label{font-size:.72em;color:#94a3b8;font-weight:700}
 .hypo-icon{position:absolute;top:6px;right:6px;font-size:.9em;opacity:.5}

 .ksub{font-size:.65em;color:#94a3b8;font-weight:400;margin-top:2px;line-height:1.2}
 .header{max-width:1200px;margin:20px auto 20px;display:flex;align-items:center;gap:20px;padding:25px 30px;background:rgba(255,255,255,0.15);border-radius:16px;border:2px solid rgba(255,255,255,0.3);box-shadow:0 8px 32px rgba(28,13,46,0.2);position:relative;z-index:200}

const EFF_CACHE={};
function effMonth(y,m){
  const key=y+'-'+m;
  if(EFF_CACHE[key]!=null)return EFF_CACHE[key];
  const last=new Date(y,m,0).getDate();
  let B=0,W=0;
  for(let d=1;d<=last;d++){const wd=new Date(y,m-1,d).getDay();if(wd===0||wd===6)W++;else B++;}
  return EFF_CACHE[key]=B+0.7*W;
}
function effDaysRange(fromISO,toISO){
  if(fromISO>toISO)return 0;
  let B=0,W=0,d=parseW(fromISO);const end=parseW(toISO);
  while(d<=end){const wd=d.getDay();if(wd===0||wd===6)W++;else B++;d.setDate(d.getDate()+1);}
  return B+0.7*W;
}
function dayShare(p,dateISO,metric){
  const ym=dateISO.slice(0,7);
  const pl=planOf(p.product_id,ym);
  if(!pl||!(pl.plan_qty>0))return null;
  const [y,m]=ym.split('-').map(Number);
  const q=pl.plan_qty/effMonth(y,m)*(isWeekend(dateISO)?0.7:1);
  if(metric==='sales')return q;
  if(metric==='revn')return q*pl.price;
  if(metric==='mar')return q*pl.price*pl.margin_pct/100*KAPPA.k;
  return null;
}

}

function parseCSV(t){const rows=[];let row=[],cur='',q=false;for(let i=0;i<t.length;i++){const c=t[i];if(q){if(c=='"'){if(t[i+1]=='"'){cur+='"';i++;}else q=false;}else cur+=c;}else{if(c=='"')q=true;else if(c==';'){row.push(cur);cur='';}else if(c==','){row.push(cur);cur='';}else if(c=='\n'){row.push(cur);rows.push(row);row=[];cur='';}else if(c!='\r')cur+=c;}}if(cur!==''||row.length){row.push(cur);rows.push(row);}return rows;}

async function syncPnl(extraWeeks){

  if(!weeks.length)return;
  const first=weeks[0], last=localISO(weekEnd(parseW(weeks[weeks.length-1])));
  let rows=[];
  let dcur=first;
  while(dcur<=last){
    let off=0;
    while(true){
      let j=null;
      for(let a=0;a<4;a++){
        const r=await fetch(SUPABASE_URL+`/rest/v1/ozon_charges?charge_date=eq.${dcur}&order=row_key&select=offer_id,charge_date,charge_type,amount,qty,price&limit=1000&offset=${off}`,{headers:HD});
        if(r.ok){j=await r.json();break;}
        await sleep(700*(a+1));
      }
      if(j==null)throw new Error('syncPnl: сервер недоступен на дне '+dcur+', пересчёт прерван БЕЗ записи фактов');
      rows=rows.concat(j); if(j.length<1000)break; off+=1000;
    }
    dcur=addDaysISO(dcur,1);
  }
  const adsMap=await loadAdSpend(first,last);
  const day=new Map();
  rows.forEach(c=>{
    const pid=OFFER_PID[c.offer_id]; if(!pid)return;
    const d=c.charge_date; if(!d)return;
    let m=day.get(pid); if(!m){m=new Map();day.set(pid,m);}
    let g=m.get(d); if(!g){g={pnl:0,sales:0,gmv:0,revg:0,ug:0,revP:0};m.set(d,g);}
    const amt=Number(c.amount||0), qty=Number(c.qty||0), price=Number(c.price||0);
    g.pnl+=amt;
    if(c.charge_type==='Выручка'){ g.gmv+=price*qty; g.revg+=price*qty; g.ug+=qty; g.sales+=qty; g.revP+=amt; }
    else if(c.charge_type==='Возврат выручки'){ g.gmv+=price*qty; g.sales-=qty; g.revP+=amt; }
  });
  const body=[];
  weeks.forEach(w=>{
    const ws=parseW(w); const wDays=[];
    for(let i=0;i<7;i++){ const d=new Date(ws); d.setDate(d.getDate()+i); wDays.push(localISO(d)); }
    day.forEach((m,pid)=>{
      let pnl=0,sales=0,gmv=0,revg=0,ug=0,revP=0,cogs=0,ads=0,prov=false,any=false;
      const am=adsMap.get(pid);
      wDays.forEach(d=>{
        const g=m.get(d); if(!g)return;
        any=true;
        pnl+=g.pnl; sales+=g.sales; gmv+=g.gmv; revg+=g.revg; ug+=g.ug; revP+=g.revP;
        ads+=am?(am.get(d)||0):0;
        const ci=costAt(pid,d);
        cogs+=ci.cost*g.sales;
        if(ci.prov)prov=true;
      });
      if(!any)return;
      const tax=TAX_RATE*revP;
      const mar=pnl-cogs-ads-tax, retn=gmv;
      const row=(metric,fact)=>({product_id:pid,week:w,metric,fact,cogs:Math.round(cogs*100)/100,cost_provisional:prov});
      body.push(row('sales',sales));
      body.push(row('revn',Math.round(retn*100)/100));
      body.push(row('mar',Math.round(mar*100)/100));
      body.push(row('revg',Math.round(revg*100)/100));
      body.push(row('ug',ug));
      if(ug>0)body.push(row('price',Math.round(revg/ug*100)/100));
      if(retn!==0)body.push(row('pct',Math.round(mar/retn*10000)/100));
    });
  });
  for(let i=0;i<body.length;i+=500){
    const part=body.slice(i,i+500);
    await fetch(SUPABASE_URL+'/rest/v1/sales_plan_weeks?on_conflict=product_id,week,metric',{method:'POST',headers:{...HD,'Content-Type':'application/json',Prefer:'resolution=merge-duplicates'},body:JSON.stringify(part)});
  }
  // дневная маржа CF (для суточного графика главной) — та же формула, что у недели, по каждому дню с начислениями:
  // mar = pnl − себестоимость × продажи − реклама дня − налог × выручка P; сумма дней недели = недельный факт
  const dayBody=[];
  day.forEach((m,pid)=>{
    const am=adsMap.get(pid);
    m.forEach((g,d)=>{
      if(d<first||d>last)return;
      const ci=costAt(pid,d),ads=am?(am.get(d)||0):0,cogs=ci.cost*g.sales;
      const mar=g.pnl-cogs-ads-TAX_RATE*g.revP;
      dayBody.push({product_id:pid,day:d,mar:Math.round(mar*100)/100,revn:Math.round(g.gmv*100)/100,sales:g.sales,cogs:Math.round(cogs*100)/100,cost_provisional:!!ci.prov,updated_at:new Date().toISOString()});
    });
  });
  for(let i=0;i<dayBody.length;i+=500){
    const r=await fetch(SUPABASE_URL+'/rest/v1/cf_daily?on_conflict=product_id,day',{method:'POST',headers:{...HD,'Content-Type':'application/json',Prefer:'resolution=merge-duplicates'},body:JSON.stringify(dayBody.slice(i,i+500))});
    if(!r.ok){console.warn('cf_daily: HTTP',r.status,'— дневная маржа не сохранена (нет таблицы?)');break;}
  }
}

    if(!r.ok)throw new Error('product_sales HTTP '+r.status);
    const j=await r.json();
    j.forEach(x=>{
      let m=byOffer.get(x.offer_id);if(!m){m=new Map();byOffer.set(x.offer_id,m);}m.set(x.sale_date,(m.get(x.sale_date)||0)+Number(x.qty||0));
      let rd=revDay.get(x.offer_id);if(!rd){rd=new Map();revDay.set(x.offer_id,rd);}rd.set(x.sale_date,(rd.get(x.sale_date)||0)+Number(x.revenue||0));
      if(x.sale_date>=periodStart&&x.sale_date<=execEndAll)revOffer.set(x.offer_id,(revOffer.get(x.offer_id)||0)+Number(x.revenue||0));
    });
    if(j.length<1000)break;off+=1000;
  }
  const effRemain=tISO<=periodEnd?effDaysRange(tISO<periodStart?periodStart:tISO,periodEnd):0;
  const effTotal=effDaysRange(periodStart,periodEnd);
  const res={m1:[],m2:[]};

    const gid=matrixOf(p.offer_id);
    const m=byOffer.get(p.offer_id);
    let sum=0;baseDays.forEach(x=>{sum+=m?(m.get(x)||0):0;});

    const yest=m?(m.get(yISO)||0):0;
    const execEnd=yISO<periodEnd?yISO:periodEnd;
    let exec=0;
    if(m)m.forEach((v,k)=>{if(k>=periodStart&&k<=execEnd)exec+=v;});
    const eElapsed=effDaysRange(periodStart, yISO<periodEnd?yISO:periodEnd);
    const proj=eElapsed>0? exec/eElapsed*effTotal : null;

    const remain=need-exec;
    const rc=effRemain>0?remain/effRemain:0;
    const rp=effTotal>0?need/effTotal:0;
    const k=yIsWe?0.7:1;
    const expected=rp*k;
    const rcExp=rc*k;
const price=pl.price||0;
const yestRub=yest*price;
const avgRub=avg*price;
const rcExpRub=rcExp*price;
const expectedRub=expected*price;
res[gid].push({offer:p.offer_id,yest:yest,avg:avg,devAvg:yest-avg,rc:rc,rcExp:rcExp,devCatch:avg-rcExp,rp:rp,expected:expected,devPlan:yest-expected,proj:proj,price:price,yestRub:yestRub,avgRub:avgRub,devAvgRub:yestRub-avgRub,rcExpRub:rcExpRub,devCatchRub:avgRub-rcExpRub,expectedRub:expectedRub,devPlanRub:yestRub-expectedRub});

  // прогноз выручки (PNL) по фактической выручке, как на главном дашборде:
  // выручка с 1-го числа по вчера / эфф. дни прошедшие × эфф. дни месяца (все неархивные позиции группы)

  const val=document.getElementById(`speedoval_${type}_${gid}`);
  const sub=document.getElementById(`speedosub_${type}_${gid}`);
  if(!svg||!val||!sub)return;
  const reset=()=>{svg.innerHTML='';val.textContent='—';val.className='speedo-val n';val.style.color='';};

  const now=new Date(); now.setHours(0,0,0,0);
  const [yy,mm]=MONTH.split('-').map(Number);
  const periodStart=localISO(new Date(yy,mm-1,1));
  const periodEnd=localISO(new Date(yy,mm,0));

  if(!WEEKISO.length){reset();sub.textContent='нет недель';return;}
  if(localISO(now)<periodStart){reset();sub.textContent='старт '+ddmm(periodStart);return;}
  if(localISO(now)>periodEnd){reset();sub.textContent='завершён';return;}

  const data=await computeOrderTemps();
  const rows=data[gid]||[];
  let F=0,P=0;
  rows.forEach(x=>{
    const pl=PLAN[ROWS.find(r=>r.offer_id===x.offer)?.product_id]||{};
    const price=pl.price||1;
    if(type==='orders'){P+=x.expected;F+=Math.min(x.yest,x.expected);}
    else{P+=x.expected*price;F+=x.yest*price;}
  });
  if(!rows.length||P<=0){reset();sub.textContent='нет данных';return;}

  const pct=F/P*100;
  const cls=pct>=90?'ok':(pct>=80?'warn':'bad');
  const emoji=pct>=95?'🚀':(pct>=90?'🔥':(pct>=80?'🙂':(pct>=60?'😐':'💩')));
  const col=speedoColor(pct);
  const angle=-90+Math.min(pct,100)/100*180;
  const zones=[[-90,18,'#E33D78'],[18,54,'#d97706'],[54,72,'#f59e0b'],[72,81,'#16a34a'],[81,90,'#4ade80']];

  svg.innerHTML=`
    <path d="${speedoArc(-90,90)}" fill="none" stroke="#e2e8f0" stroke-width="8" stroke-linecap="round"/>
    ${zones.map(z=>`<path d="${speedoArc(z[0],z[1])}" fill="none" stroke="${z[2]}" stroke-width="8" opacity="0.35"/>`).join('')}
    <g transform="rotate(${angle} 40 45)">
      <path d="M 38.3 47 L 40 16.5 L 41.7 47 Z" fill="${col}"/>
      <text x="40" y="13" text-anchor="middle" font-size="9" transform="rotate(${-angle} 40 13)">${emoji}</text>
    </g>
    <circle cx="40" cy="45" r="3" fill="${col}"/>
  `;

  val.textContent=Math.round(pct)+'%';
  val.className='speedo-val '+cls;
  val.style.color=col;

  const unit=type==='orders'?'шт':'₽';
  sub.textContent=`${fmt(Math.round(F))} / ${fmt(Math.round(P))} ${unit}`;

}

    byType.set(c.charge_type,(byType.get(c.charge_type)||0)+amt);

  });

    return `<div class="prec"><b>${esc(t)}</b> <span class="${v<0?'r':'g'}">${fmt2(v)} ₽</span></div>`;
  };

    +`<div class="prec"><b>PNL до себестоимости</b> <span class="${pnl<0?'r':'g'}">${fmt2(pnl)} ₽</span></div>`
    +`<div class="prec"><b>− себестоимость × продажи</b> <span class="r">−${fmt2(cost*sales)} ₽</span> <span style="opacity:.5;font-size:.85em">(${fmt2(cost)} ₽ × ${sales} шт)</span></div>`

    +`<div class="prec"><b>Налог (3% от выручки P)</b> <span class="r">−${fmt2(tax)} ₽</span></div>`
    +`<div class="prec"><b>Маржа чистая</b> <span class="${marNet<0?'r':'g'}">${fmt2(marNet)} ₽</span>${gmvNet>0?` <span style="opacity:.5;font-size:.85em">• маржинальность ${fmt2(marNet/gmvNet*100)}%</span>`:''}</div>`;

}

function getRec(pid,key,w){ return (WD[pid]&&WD[pid][key]&&WD[pid][key][w])?WD[pid][key][w]:{plan:0,forecast:null,fact:null}; }
function monthlyPlan(p,key){
  const pl=PLAN[p.product_id]||{price:Number(p.price||0),plan_qty:0,margin_pct:0};
  const cost=COST[p.product_id]||0;
  if(key==='qty'||key==='revo')return null;
  if(key==='sales')return pl.plan_qty;
  if(key==='revn')return pl.plan_qty*pl.price;
  if(key==='mar')return pl.plan_qty*pl.price*pl.margin_pct/100*KAPPA.k;

}
function elapsedInfo(){
  if(!WEEKISO.length) return {E:0,T:0};
  const [ey,em]=MONTH.split('-').map(Number);
  const first=new Date(ey,em-1,1);
  const last=new Date(ey,em,0);
  const T=daysBetween(first,last)+1;
  const today=new Date(); today.setHours(0,0,0,0);
  let E;
  if(today>last) E=T;
  else if(today<first) E=0;
  else { const D=new Date(today); D.setDate(D.getDate()-1); E=daysBetween(first,D)+1; }
  if(E<0)E=0; if(E>T)E=T;
  return {E,T};
}

function calcFactToDate(p,key){
  key=WDKEY[key]||key;
  if(!WEEKISO.length) return null;
  const [y,m]=MONTH.split('-').map(Number);
  const first=new Date(y,m-1,1), last=new Date(y,m,0);
  const today=new Date(); today.setHours(0,0,0,0);
  const D=new Date(today); D.setDate(D.getDate()-1);
  if(D<first) return null;
  const end=D<last?D:last;
  let F=0,any=false;
  const cweeks=calendarWeeksOfMonth(y,m);
  for(const w of cweeks){
    const rec=getRec(p.product_id,key,w);
    if(rec.fact==null) continue;
    any=true;
    let elapsed=0;
    for(let i=0;i<7;i++){ if(parseW(addDaysISO(w,i))<=D) elapsed++; }
    const per=rec.fact/Math.max(elapsed,1);
    for(let i=0;i<7;i++){
      const dd=parseW(addDaysISO(w,i));
      if(dd>=first&&dd<=end) F+=per;
    }
  }
  if(!any) return null;
  return F;
}
function calcForecast(p,key){
  const F=calcFactToDate(p,key);
  if(F==null) return null;
  const [y,m]=MONTH.split('-').map(Number);
  const first=new Date(y,m-1,1), last=new Date(y,m,0);
  const today=new Date(); today.setHours(0,0,0,0);
  const D=new Date(today); D.setDate(D.getDate()-1);
  const end=D<last?D:last;
  const E=effDaysRange(localISO(first),localISO(end));
  if(E<=0) return null;
  const T=effDaysRange(localISO(first),localISO(last));
  return F/E*T;
}
const calcForecastQty=p=>calcForecast(p,'qty');
function projVal(p,key){
  const planV=monthlyPlan(p,key);
  const P=calcForecast(p,key);
  if(P!=null) return {ffV:P, dev:planV==null?null:P-planV};
  if(planV==null) return {ffV:null, dev:null};
  const {E,T}=elapsedInfo();

}
function seriesFor(p,key){
  const P=monthlyPlan(p,key);
  key=WDKEY[key]||key;
  const today=new Date(); today.setHours(0,0,0,0);
  const n=WEEKISO.length;
  const recs=WEEKISO.map(w=>getRec(p.product_id,key,w));
  const past=WEEKISO.map(w=>weekEnd(parseW(w))<today);
  const val=new Array(n).fill(0);
  const kind=new Array(n).fill('auto');
  let sumFactCalc=0;
  for(let i=0;i<n;i++){
    const f=recs[i].fact;
    if(f!=null){
      if(past[i]){ val[i]=f; kind[i]='fact'; sumFactCalc+=f; }
      else{
        const w=parseW(WEEKISO[i]);
        const D=new Date(today); D.setDate(D.getDate()-1);
        let E=daysBetween(w,D)+1; if(E<0)E=0; if(E>7)E=7;
        const v=E>0? f+(f/E)*(7-E) : f;
        val[i]=v; kind[i]='calc'; sumFactCalc+=v;
      }
    } else if(recs[i].forecast!=null){
      val[i]=recs[i].forecast; kind[i]='manual';
    }
  }
  const nonFact=kind.filter(k=>k==='auto'||k==='manual').length;
  const baseline=nonFact>0?(P-sumFactCalc)/nonFact:0;
  return WEEKISO.map((w,i)=>{
    let fc;
    if(kind[i]==='auto'){
      const wt=weekTargetParts(p,w,key);
      fc=wt.total>0?wt.total:baseline;
    }
    else fc=val[i];
    return { past:past[i], fact:recs[i].fact, manual:kind[i]==='manual', locked:kind[i]==='fact'||kind[i]==='calc', forecast:fc };
  });
}
function collVal(p,key){
  const mt=METRICS.find(m=>m.key===key);
  if(mt.add) return seriesFor(p,key).reduce((a,x)=>a+x.forecast,0);
  const cur=currentWeekISO();
  if(cur){ const rec=getRec(p.product_id,key,cur);
    const today=new Date(); today.setHours(0,0,0,0);
    const v=(weekEnd(parseW(cur))<today&&rec.fact!=null)?rec.fact:(rec.forecast!=null?rec.forecast:null);
    if(v!=null) return v; }
  return monthlyPlan(p,key);
}
function forecastClose(p,key){
  const mt=METRICS.find(m=>m.key===key);
  const series=seriesFor(p,key);
  let lastFact=null; series.forEach(s=>{ if(s.fact!=null) lastFact=s.fact; });
  if(!mt.add){ return lastFact!=null?lastFact:collVal(p,key); }
  if(lastFact==null){ return series.reduce((a,s)=>a+s.forecast,0); }
  let sumFact=0,noFact=0;
  series.forEach(s=>{ if(s.fact!=null) sumFact+=s.fact; else noFact++; });
  return sumFact + lastFact*noFact;
}
function devFor(p,key){ return forecastClose(p,key)-monthlyPlan(p,key); }

function recFor(pid,key){

  if(!cw) return null;
  const cwIdx=WEEKISO.indexOf(cw);

  if(!nw) return null;

  const nxtV=rN.forecast!=null?rN.forecast:(rN.fact!=null?rN.fact:null);
  if(curV==null||nxtV==null) return null;

}
function recForV2(pid,key){
  const mt=METRICS.find(m=>m.key===key);
  if(!mt.add) return recFor(pid,key);
  const cw=currentWeekISO(); if(!cw) return null;
  const ci=WEEKISO.indexOf(cw); if(ci<0) return null;
  const series=seriesFor({product_id:pid},key);
  let bi=ci;
  while(bi>0&&series[bi].fact==null)bi--;
  if(series[bi].fact==null)return null;
  const ni=bi+1;
  const cur=series[bi].forecast;
  const p=BYID[pid]; if(!p)return null;
  let target,nwISO,parts=null;
  if(ni<WEEKISO.length){
    nwISO=WEEKISO[ni];
    const recN=getRec(pid,WDKEY[key]||key,nwISO);
    if(recN.forecast!=null){ target=recN.forecast; }

  }else{

    const wt=weekTargetParts(p,nwISO,key);
    if(!wt.total)return null;
    target=wt.total; parts=wt.parts;
  }

  const pct=cur!==0?(d/Math.abs(cur)*100):0;

function recText(r,unit){
  if(!r) return {text:'—',cls:'n'};
  const abs=Math.abs(r.d);
  const pctF=(r.pct<0?'−':'+')+Math.round(Math.abs(r.pct))+'%';
  const u=unit?(' '+unit):'';
  if(r.d>0.0001) return {text:`увеличить на ${fmt(abs)}${u} (${pctF})`,cls:'r'};
  if(r.d<-0.0001) return {text:`уменьшить на ${fmt(abs)}${u} (${pctF})`,cls:'g'};
  return {text:'без изменений',cls:'n'};
}
function verdict(it){
  const base=it.baseline_ctx?JSON.parse(it.baseline_ctx):null;
  if(!base||!('orders' in base)){
    if(it.fact_dev==null)return null;
    const B=Number(it.baseline_dev||0),T=Number(it.target_dev||0),F=Number(it.fact_dev||0);
    if(B===T)return F>=B?'success':'fail';
    const pr=(F-B)/(T-B),tol=Math.abs(T-B)*0.1;
    if(pr>=1||Math.abs(F-T)<=tol)return 'success';
    return pr>0?'partial':'fail';
  }
  if(it.fact_ctx==null)return null;
  const fact=JSON.parse(it.fact_ctx);
  const m=it.metric||'orders';
  const B=(m==='orders')?base.orders:base.pct;
  const F=(m==='orders')?fact.orders:fact.pct;
  const T=(m==='orders')?Number(it.target_orders):Number(it.target_pct);
  if(B==null||F==null||T==null||isNaN(T))return null;
  if(Math.abs(T-B)<0.01)return F>=B?'success':'fail';
  const pr=(F-B)/(T-B),tol=Math.abs(T-B)*0.1;
  if(pr>=1||Math.abs(F-T)<=tol)return 'success';
  if(pr>0)return 'partial';
  return 'fail';
}
function addDaysISO(iso,n){const d=parseW(iso);d.setDate(d.getDate()+n);return localISO(d);}
function isWeekend(iso){const w=parseW(iso).getDay();return w===0||w===6;}
function lastWeekdayBefore(iso){let d=addDaysISO(iso,-1);while(isWeekend(d))d=addDaysISO(d,-1);return d;}
function weekdayOptions(startISO){
  const out=[];
  let i=1;
  while(out.length<3){
    const d=addDaysISO(startISO,i);
    if(!isWeekend(d))out.push(d);
    i++;
  }
  return out;
}

async function fetchChargesMap(pid,from,to){
  const offer=(BYID[pid]||{}).offer_id;const map=new Map();let off=0;
  while(true){
    let j=null;
    for(let a=0;a<3;a++){
      const r=await fetch(SUPABASE_URL+`/rest/v1/ozon_charges?offer_id=eq.${encodeURIComponent(offer)}&event_date=gte.${from}&event_date=lte.${to}&select=event_date,charge_type,amount,qty,price&order=row_key&limit=1000&offset=${off}`,{headers:HD});
      if(r.ok){j=await r.json();break;}
      await sleep(700*(a+1));
    }
    if(j==null){console.warn('fetchChargesMap: сервер недоступен после ретраев',offer,from,to);break;}
    j.forEach(c=>{const d=c.event_date;if(!d)return;let g=map.get(d);if(!g){g={pnl:0,gmv:0,sales:0,revP:0};map.set(d,g);}const amt=Number(c.amount||0),qty=Number(c.qty||0),price=Number(c.price||0);g.pnl+=amt;if(c.charge_type==='Выручка'){g.gmv+=price*qty;g.sales+=qty;g.revP+=amt;}else if(c.charge_type==='Возврат выручки'){g.gmv+=price*qty;g.sales-=qty;g.revP+=amt;}});
    if(j.length<1000)break;off+=1000;
  }
  return map;
}
async function ordersForDay(pid,iso){const m=await fetchSalesMap(pid,iso,iso);return m.get(iso)||0;}
async function ordersAvgWeekdays(pid,from,to){
  const m=await fetchSalesMap(pid,from,to);
  let sum=0,cnt=0,d=from;
  while(d<=to){if(!isWeekend(d)){sum+=(m.get(d)||0);cnt++;}d=addDaysISO(d,1);}
  if(!cnt)return null;
  return Math.round(sum/cnt*100)/100;
}
 function lastWeekdaysBefore(iso,n){const out=[];let d=addDaysISO(iso,-1);while(out.length<n){if(!isWeekend(d))out.unshift(d);d=addDaysISO(d,-1);}return out;}
async function ordersBaseWindow(pid,startISO){
  const days=lastWeekdaysBefore(startISO,3);
  const m=await fetchSalesMap(pid,days[0],days[days.length-1]);
  let sum=0;days.forEach(d=>{sum+=(m.get(d)||0);});
  return {avg:Math.round(sum/days.length*100)/100,from:days[0],to:days[days.length-1],days:days.length};
}
async function marginAggPeriod(pid,fromISO,toISO){
  const map=await fetchChargesMap(pid,fromISO,toISO);
  const adsMap=await loadAdSpend(fromISO,toISO);
  const adsByDay=adsMap.get(pid)||new Map();
  let pnl=0,gmv=0,sales=0,revP=0,cogs=0,cnt=0,ads=0,d=fromISO;
  while(d<=toISO){
    const g=map.get(d);
    if(g&&g.gmv>0){pnl+=g.pnl;gmv+=g.gmv;sales+=g.sales;revP+=g.revP||0;cogs+=costAt(pid,d).cost*g.sales;cnt++;}
    ads+=adsByDay.get(d)||0;
    d=addDaysISO(d,1);
  }
  if(!cnt||gmv<=0)return null;
  const tax=TAX_RATE*revP;  // себестоимость — на дату (costAt), как syncPnl
  return {pct:Math.round(((pnl-cogs-ads-tax)/gmv*100)*100)/100,from:fromISO,to:toISO,days:cnt};
}

  if(!r.ok){alert('Ошибка сохранения: HTTP '+r.status+': '+(await r.text()));return;}

function arcPath(cx,cy,rO,rI,a0,a1){
  const p=(r,a)=>[cx+r*Math.cos(a),cy+r*Math.sin(a)];

}

    const rev=pl.plan_qty*pl.price, mar=pl.plan_qty*pl.price*pl.margin_pct/100;
    tRub+=rev; tMar+=mar*KAPPA.k; tMarRaw+=mar;

    if(pvRev.ffV!=null)tFRev+=pvRev.ffV;
    if(pvMar.ffV!=null)tFMar+=pvMar.ffV;
    const fRev=calcFactToDate(p,'revn'), fMar=calcFactToDate(p,'mar');
    if(fRev!=null){ factRev+=fRev; factCnt++; }
    if(fMar!=null) factMar+=fMar;
    const b=pl.margin_pct<=5?buckets[0]:(pl.margin_pct<=10?buckets[1]:buckets[2]); b.rev+=rev; b.cnt+=1;
  });
  return {buckets,tRub,tMar,tMarRaw,tFRev,tFMar,tOrd,tOrdRev,factRev,factMar,factCnt};
}
function hypStats(list){
  let active=0,success=0,fail=0;
  list.forEach(p=>{
    const items=(PROTO[p.product_id]||[]).filter(it=>{
      if(it.parent_id)return false;
      return it.deadline?monthOfWeekISO(it.deadline)===MONTH:it.month===MONTH;
    });
    items.forEach(it=>{
      if(it.fact_dev==null) active++;
      else{
        const v=verdict(it);
        if(v==='success'||v==='partial') success++;
        if(v==='fail') fail++;
      }
    });
  });
  return {active,success,fail};
}

  const last=r1.ok?((await r1.json())[0]||{}).report_date:null;
  if(!last){RESTOCK={map:new Map()};return RESTOCK;}
  const r2=await fetch(SUPABASE_URL+`/rest/v1/stock_history?report_date=lte.${addDaysISO(last,-2)}&select=report_date&order=report_date.desc&limit=1`,{headers:HD});
  const prev=r2.ok?((await r2.json())[0]||{}).report_date:null;
  const sum=rows=>{const m=new Map();rows.forEach(x=>m.set(x.offer_id,(m.get(x.offer_id)||0)+Number(x.stock||0)));return m;};
  const [a,b]=await Promise.all([pages(`stock_history?report_date=eq.${last}&select=offer_id,stock`),prev?pages(`stock_history?report_date=eq.${prev}&select=offer_id,stock`):Promise.resolve([])]);

async function mktAddSku(btn,pid){const k=btn.dataset.k,box=btn.closest('.mkedit');
  const sku=btn.dataset.s||mktSkuOf(box.querySelector('input').value);if(!sku){alert('Введите SKU (цифры) или ссылку вида ozon.ru/product/…-123456789');return;}
  const role=btn.dataset.s?'competitor':box.querySelector('select').value;btn.disabled=true;
  try{await mktWrite('POST','market_groups?on_conflict=grp_key,sku',[{grp_key:k,title:btn.dataset.t||null,sku,role,note:null,...mktWho()}]);embedMarket(pid);}
  catch(e){alert('Не сохранено: '+e.message);btn.disabled=false;}}
async function mktRoleSet(sel,pid){sel.disabled=true;
  try{await mktWrite('PATCH',mktQ(sel.dataset.k,sel.dataset.s),{role:sel.value,...mktWho()});embedMarket(pid);}catch(e){alert('Не сохранено: '+e.message);sel.disabled=false;}}
async function mktDel(btn,pid){if(!confirm('Убрать SKU '+btn.dataset.s+' из группы?'))return;btn.disabled=true;
  try{await mktWrite('DELETE',mktQ(btn.dataset.k,btn.dataset.s),null);embedMarket(pid);}catch(e){alert('Не удалено: '+e.message);btn.disabled=false;}}
async function mktNewGroup(pid){const G=PROTO_GROUPS[pid],ms=G?G.members:[BYID[pid]];
  try{const have=new Set((await mktGet(`market_groups?sku=in.(${ms.map(p=>String(p.raw?.sku||'')).filter(Boolean).join(',')})&select=sku&order=grp_key,sku`)).map(x=>x.sku));
    const rows=ms.filter(p=>p.raw?.sku!=null&&!have.has(String(p.raw.sku))).map(p=>({grp_key:'ручная:'+p.raw.sku,title:p.offer_id+' — '+(p.name||''),sku:String(p.raw.sku),role:'our',note:null,...mktWho()}));
    if(!rows.length)return;await mktWrite('POST','market_groups?on_conflict=grp_key,sku',rows);rows.forEach(r=>MKT_EDIT.add(r.grp_key));embedMarket(pid);}
  catch(e){alert('Не создано: '+e.message);}}
if(BA_AUTH.has(SUPABASE_URL))go();
</script>
