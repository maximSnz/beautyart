<html lang="ru">

<style>
 .login-box {
    max-width: 400px;
    margin: 100px auto;
    background: white;
    border-radius: 16px;
    padding: 40px;

    width: 80px;
    height: auto;
    margin-bottom: 15px;
}

.login-title {

    color: #1C0D2E;
    margin-bottom: 10px;
}

.login-subtitle {
    color: #666;

    margin-bottom: 25px;
    font-family: 'Forum', serif;
}

.password-input {
    width: 100%;

 th.mhead{background:linear-gradient(90deg,rgba(120,166,199,.18),transparent);color:#544273;font-size:.95em}
 th.sub{background:rgba(120,166,199,.1)}

 th.sep,td.sep{border-left:1px dashed rgba(84,66,115,.3)}
 tr.mgroup td{background:linear-gradient(90deg,rgba(125,54,115,.18),transparent);font-weight:700;color:#7D3673;padding-top:12px;border-bottom:2px solid rgba(125,54,115,.25)}
 tr.mgroup button{background:none;border:1px solid rgba(125,54,115,.4);border-radius:5px;color:#7D3673;cursor:pointer;padding:0 6px;margin-right:6px}

 .panel{border:1px solid rgba(84,66,115,.15);border-radius:12px;background:#fff;padding:10px 12px;display:flex;flex-direction:column;gap:8px;min-width:0}

.panel-speedo {
  flex: 0 0 168px;
  width: 168px;
}
.speedo-wrap {
  flex: 1;
  display: flex;
  flex-direction: column;
  justify-content: space-evenly;
  gap: 6px;
}
.speedo-item {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 2px;

.speedo-item.clickable { cursor: pointer; transition: background .15s; }
.speedo-item.clickable:hover { background: rgba(120,166,199,.12); }

}

}
.speedo-val.ok { color: #16a34a; }

}
 .panel-kpi{flex:1 1 100%;min-width:0}
 .piesrow{display:flex;gap:10px;flex:1;align-items:flex-start}

 svg.pie{width:100%;height:100%;display:block;animation:piein .5s ease}
 @keyframes piein{from{opacity:0;transform:scale(.9) rotate(-15deg)}to{opacity:1;transform:none}}
 .seg{cursor:pointer;transition:transform .18s ease,opacity .18s ease;transform-origin:110px 110px}
 .seg:hover,.seg.hl{transform:scale(1.06)}
 svg.dim .seg:not(:hover):not(.hl){opacity:.4}
 .pieCenter{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;pointer-events:none;text-align:center;padding:0 18px}
 .pcVal{font-size:.72em;font-weight:700;color:#1C0D2E;line-height:1.1}
 .pcCap{font-size:.6em;color:#94a3b8;margin-top:2px}
 .tip{position:fixed;z-index:50;background:#1C0D2E;color:#fff;border-radius:8px;padding:6px 10px;font-size:.78em;pointer-events:none;opacity:0;transition:opacity .12s;white-space:nowrap;box-shadow:0 4px 14px rgba(28,13,46,.4)}
 .legend{font-size:.72em;color:#544273}
 .lrow{display:flex;align-items:center;gap:8px;margin:4px 0;white-space:nowrap;cursor:pointer;padding:3px 6px;border-radius:6px;transition:background .15s;width:100%;overflow:hidden}
 .lrow:hover,.lrow.hl{background:rgba(120,166,199,.18)}
 .dot{width:12px;height:12px;border-radius:3px;display:inline-block;flex:0 0 auto}
 .lval{margin-left:auto;font-weight:700;color:#1C0D2E}
 .lcnt{color:#94a3b8;font-size:.9em}
 .kpisrow{display:flex;align-items:stretch;flex:1;gap:0}

 .kval{font-size:.95em;font-weight:700;color:#1C0D2E;white-space:nowrap}
 .panel-hypotheses{flex:1 1 100%;width:100%}
 .hypo-stats{display:flex;gap:10px;margin-top:8px;justify-content:center}

 .hypo-active .hypo-num{color:#64748b}
 .hypo-success .hypo-num{color:#16a34a}
 .hypo-fail .hypo-num{color:#E33D78}
 .hypo-label{font-size:.72em;color:#94a3b8;font-weight:700}

 .hypo-rate-bar{height:8px;border-radius:4px;background:#e2e8f0;overflow:hidden;margin-bottom:6px}

 .hypo-rate-text{font-size:.72em;color:#544273;font-weight:700;text-align:center}
 .ksub{font-size:.65em;color:#94a3b8;font-weight:400;margin-top:2px;line-height:1.2}
 .header{max-width:1200px;margin:20px auto 20px;display:flex;align-items:center;gap:20px;padding:25px 30px;background:rgba(255,255,255,0.15);border-radius:16px;border:2px solid rgba(255,255,255,0.3);box-shadow:0 8px 32px rgba(28,13,46,0.2);position:relative;z-index:200}

    fetch(SUPABASE_URL+`/rest/v1/sales_plan?month=eq.${MONTH}&select=product_id,price,plan_qty,margin_pct`,{headers:HD}),
    fetch(SUPABASE_URL+`/rest/v1/sales_plan?month=eq.${nextMonthISO()}&select=product_id,price,plan_qty,margin_pct`,{headers:HD}),
    fetch(SUPABASE_URL+`/rest/v1/sales_plan?month=eq.${prevMonthISO()}&select=product_id,price,plan_qty,margin_pct`,{headers:HD})
  ]);
  if(!r.ok)throw new Error('HTTP '+r.status);
  const fill=j=>{const o={};j.forEach(x=>o[x.product_id]={price:Number(x.price||0),plan_qty:Number(x.plan_qty||0),margin_pct:Number(x.margin_pct||0)});return o;};
  PLAN=fill(await r.json());
  PLAN_NEXT=r2.ok?fill(await r2.json()):{};
  PLAN_PREV=r3.ok?fill(await r3.json()):{};
}
function planOf(pid,ym){
  if(ym===MONTH)return PLAN[pid]||null;
  if(ym===nextMonthISO())return PLAN_NEXT[pid]||null;
  if(ym===prevMonthISO())return PLAN_PREV[pid]||null;
  return null;
}
const EFF_CACHE={};
function effMonth(y,m){
  const key=y+'-'+m;
  if(EFF_CACHE[key]!=null)return EFF_CACHE[key];
  const last=new Date(y,m,0).getDate();
  let B=0,W=0;
  for(let d=1;d<=last;d++){const wd=new Date(y,m-1,d).getDay();if(wd===0||wd===6)W++;else B++;}
  return EFF_CACHE[key]=B+0.7*W;
}
function effDaysRange(fromISO,toISO){
  if(fromISO>toISO)return 0;
  let B=0,W=0,d=parseW(fromISO);const end=parseW(toISO);
  while(d<=end){const wd=d.getDay();if(wd===0||wd===6)W++;else B++;d.setDate(d.getDate()+1);}
  return B+0.7*W;
}
function dayShare(p,dateISO,metric){
  const ym=dateISO.slice(0,7);
  const pl=planOf(p.product_id,ym);
  if(!pl||!(pl.plan_qty>0))return null;
  const [y,m]=ym.split('-').map(Number);
  const q=pl.plan_qty/effMonth(y,m)*(isWeekend(dateISO)?0.7:1);
  if(metric==='sales')return q;
  if(metric==='revn')return q*pl.price;
  if(metric==='mar')return q*pl.price*pl.margin_pct/100*KAPPA.k;
  return null;
}
function weekTargetParts(p,weekISO,metric){
  const parts={};let total=0;
  for(let i=0;i<7;i++){
    const d=addDaysISO(weekISO,i);
    const s=dayShare(p,d,metric);
    if(s==null)continue;
    const ym=d.slice(0,7);
    if(!parts[ym])parts[ym]={sum:0,days:0};
    parts[ym].sum+=s;parts[ym].days+=1;
    total+=s;
  }
  return {total,parts};
}

async function loadProto(){
  const [y,m]=MONTH.split('-').map(Number);
  const [wFrom,wTo]=weekBoundsOfMonth(y,m);
  const [r1,r2]=await Promise.all([
    fetch(SUPABASE_URL+`/rest/v1/product_protocol?month=eq.${MONTH}&deadline=is.null&select=*&order=created_at.asc`,{headers:HD}),
    fetch(SUPABASE_URL+`/rest/v1/product_protocol_notes?month=eq.${MONTH}&select=*&order=created_at.desc`,{headers:HD})
  ]);
  if(!r1.ok||!r2.ok)throw new Error('HTTP '+(r1.status||r2.status));
  let rows=await r1.json();
  const rX=await fetch(SUPABASE_URL+`/rest/v1/product_protocol?parent_id=is.null&deadline=gte.${wFrom}&deadline=lte.${wTo}&select=*&order=created_at.asc`,{headers:HD});
  if(rX.ok){
    const seen=new Set(rows.map(r=>r.id));
    const added=(await rX.json()).filter(r=>!seen.has(r.id)&&monthOfWeekISO(r.deadline)===MONTH);
    rows=rows.concat(added);
    if(added.length){
      const rC=await fetch(SUPABASE_URL+`/rest/v1/product_protocol?parent_id=in.(${added.map(r=>r.id).join(',')})&select=*&order=created_at.asc`,{headers:HD});
      if(rC.ok){
        const seen2=new Set(rows.map(r=>r.id));
        rows=rows.concat((await rC.json()).filter(r=>!seen2.has(r.id)));
      }
    }
  }
  rows.sort((a,b)=>String(a.created_at).localeCompare(String(b.created_at)));
  PROTO={}; NOTES={};
  rows.forEach(x=>{(PROTO[x.product_id]=PROTO[x.product_id]||[]).push(x);});
  (await r2.json()).forEach(x=>{(NOTES[x.product_id]=NOTES[x.product_id]||[]).push(x);});
}

 let COST_HIST={};
async function loadCostHistory(){
  const r=await fetch(SUPABASE_URL+'/rest/v1/product_prices?select=product_id,cost,created_at&order=created_at.asc&limit=10000',{headers:HD});
  if(!r.ok){COST_HIST={};return;}

function costAt(pid,dISO){
  const arr=COST_HIST[pid];
  if(!arr||!arr.length) return {cost:COST[pid]||0, prov:true};
  let best=null;
  for(const rec of arr){ if(rec.t<=dISO) best=rec; else break; }
  if(best) return {cost:best.c, prov:false};
  return {cost:arr[0].c, prov:true};
}

function parseCSV(t){const rows=[];let row=[],cur='',q=false;for(let i=0;i<t.length;i++){const c=t[i];if(q){if(c=='"'){if(t[i+1]=='"'){cur+='"';i++;}else q=false;}else cur+=c;}else{if(c=='"')q=true;else if(c==';'){row.push(cur);cur='';}else if(c==','){row.push(cur);cur='';}else if(c=='\n'){row.push(cur);rows.push(row);row=[];cur='';}else if(c!='\r')cur+=c;}}if(cur!==''||row.length){row.push(cur);rows.push(row);}return rows;}
function setP(pct,txt,bad){
  document.getElementById('progWrap').classList.remove('hide');
  const f=document.getElementById('progFill');
  f.style.width=pct+'%'; f.classList.toggle('bad',!!bad);
  document.getElementById('progText').textContent=txt;
}
function parseMoney(s){let t=String(s||'').replace(/[^0-9\-,\.]/g,'');if(t.includes(',')&&t.includes('.'))t=t.replace(/,/g,'');else t=t.replace(',','.');const n=Number(t);return isFinite(n)?n:0;}
function parseDateRu(s){const m=String(s||'').match(/(\d{2})\.(\d{2})\.(\d{4})/);return m?m[3]+'-'+m[2]+'-'+m[1]:null;}
function weekStartOf(iso){const d=parseW(iso);d.setDate(d.getDate()-((d.getDay()+6)%7));return localISO(d);}
async function syncPnl(extraWeeks){
  const weeks=[...new Set([...WEEKISO,...(extraWeeks||[])])].sort();
  if(!weeks.length)return;
  const first=weeks[0], last=localISO(weekEnd(parseW(weeks[weeks.length-1])));
  let rows=[];
  let dcur=first;
  while(dcur<=last){
    let off=0;
    while(true){
      let j=null;
      for(let a=0;a<4;a++){
        const r=await fetch(SUPABASE_URL+`/rest/v1/ozon_charges?charge_date=eq.${dcur}&order=row_key&select=offer_id,charge_date,charge_type,amount,qty,price&limit=1000&offset=${off}`,{headers:HD});
        if(r.ok){j=await r.json();break;}
        await sleep(700*(a+1));
      }
      if(j==null)throw new Error('syncPnl: сервер недоступен на дне '+dcur+', пересчёт прерван БЕЗ записи фактов');
      rows=rows.concat(j); if(j.length<1000)break; off+=1000;
    }
    dcur=addDaysISO(dcur,1);
  }
  const adsMap=await loadAdSpend(first,last);
  const day=new Map();
  rows.forEach(c=>{
    const pid=OFFER_PID[c.offer_id]; if(!pid)return;
    const d=c.charge_date; if(!d)return;
    let m=day.get(pid); if(!m){m=new Map();day.set(pid,m);}
    let g=m.get(d); if(!g){g={pnl:0,sales:0,gmv:0,revg:0,ug:0,revP:0};m.set(d,g);}
    const amt=Number(c.amount||0), qty=Number(c.qty||0), price=Number(c.price||0);
    g.pnl+=amt;
    if(c.charge_type==='Выручка'){ g.gmv+=price*qty; g.revg+=price*qty; g.ug+=qty; g.sales+=qty; g.revP+=amt; }
    else if(c.charge_type==='Возврат выручки'){ g.gmv+=price*qty; g.sales-=qty; g.revP+=amt; }
  });
  const body=[];
  weeks.forEach(w=>{
    const ws=parseW(w); const wDays=[];
    for(let i=0;i<7;i++){ const d=new Date(ws); d.setDate(d.getDate()+i); wDays.push(localISO(d)); }
    day.forEach((m,pid)=>{
      let pnl=0,sales=0,gmv=0,revg=0,ug=0,revP=0,cogs=0,ads=0,prov=false,any=false;
      const am=adsMap.get(pid);
      wDays.forEach(d=>{
        const g=m.get(d); if(!g)return;
        any=true;
        pnl+=g.pnl; sales+=g.sales; gmv+=g.gmv; revg+=g.revg; ug+=g.ug; revP+=g.revP;
        ads+=am?(am.get(d)||0):0;
        const ci=costAt(pid,d);
        cogs+=ci.cost*g.sales;
        if(ci.prov)prov=true;
      });
      if(!any)return;
      const tax=TAX_RATE*revP;
      const mar=pnl-cogs-ads-tax, retn=gmv;
      const row=(metric,fact)=>({product_id:pid,week:w,metric,fact,cogs:Math.round(cogs*100)/100,cost_provisional:prov});
      body.push(row('sales',sales));
      body.push(row('revn',Math.round(retn*100)/100));
      body.push(row('mar',Math.round(mar*100)/100));
      body.push(row('revg',Math.round(revg*100)/100));
      body.push(row('ug',ug));
      if(ug>0)body.push(row('price',Math.round(revg/ug*100)/100));
      if(retn!==0)body.push(row('pct',Math.round(mar/retn*10000)/100));
    });
  });
  for(let i=0;i<body.length;i+=500){
    const part=body.slice(i,i+500);
    await fetch(SUPABASE_URL+'/rest/v1/sales_plan_weeks?on_conflict=product_id,week,metric',{method:'POST',headers:{...HD,'Content-Type':'application/json',Prefer:'resolution=merge-duplicates'},body:JSON.stringify(part)});
  }
  // дневная маржа CF (для суточного графика главной) — та же формула, что у недели, по каждому дню с начислениями:
  // mar = pnl − себестоимость × продажи − реклама дня − налог × выручка P; сумма дней недели = недельный факт
  const dayBody=[];
  day.forEach((m,pid)=>{
    const am=adsMap.get(pid);
    m.forEach((g,d)=>{
      if(d<first||d>last)return;
      const ci=costAt(pid,d),ads=am?(am.get(d)||0):0,cogs=ci.cost*g.sales;
      const mar=g.pnl-cogs-ads-TAX_RATE*g.revP;
      dayBody.push({product_id:pid,day:d,mar:Math.round(mar*100)/100,revn:Math.round(g.gmv*100)/100,sales:g.sales,cogs:Math.round(cogs*100)/100,cost_provisional:!!ci.prov,updated_at:new Date().toISOString()});
    });
  });
  for(let i=0;i<dayBody.length;i+=500){
    const r=await fetch(SUPABASE_URL+'/rest/v1/cf_daily?on_conflict=product_id,day',{method:'POST',headers:{...HD,'Content-Type':'application/json',Prefer:'resolution=merge-duplicates'},body:JSON.stringify(dayBody.slice(i,i+500))});
    if(!r.ok){console.warn('cf_daily: HTTP',r.status,'— дневная маржа не сохранена (нет таблицы?)');break;}
  }
}
// фиксация факта SMART-гипотез — в ночной загрузке (scripts/ozon_daily_load.mjs, шаг 7), с 22.10.2026
async function importCharges(file){
  if(!file)return;
  const btn=document.getElementById('btnUpload'); btn.disabled=true; btn.textContent='⏳ Загрузка…';
  document.getElementById('progFill').classList.remove('bad');
  try{
    setP(5,'Чтение файла…');
    const text=await file.text();
    setP(15,'Разбор строк…');
    const rows=parseCSV(text);
    const out=[]; const seen=new Set(); let skipped=0; let noEvent=0;
    for(const r of rows){
      const id=(r[0]||'').trim();
      if(!id||/период:/i.test(id)||/ID начисления/i.test(id))continue;
      const d=parseDateRu(r[1]); const offer=(r[4]||'').trim(); const type=(r[3]||'').trim(); const grp=(r[2]||'').trim();
      if(!d||!offer||!type){skipped++;continue;}
      const amt=parseMoney(r[15]);
      const qty=Number(String(r[7]||'0').replace(/[^\d-]/g,''))||0;
      const price=parseMoney(r[8]);
      const ev=parseDateRu(r[9]||'');
      if(!ev)noEvent++;
      const row_key=[id,grp,type,offer,String(r[5]||''),String(r[7]||''),String(r[9]||''),amt].join('|');
      if(seen.has(row_key))continue; seen.add(row_key);
      out.push({row_key,source_id:id,charge_date:d,event_date:ev,offer_id:offer,group_name:grp,charge_type:type,amount:amt,qty:qty,price:price});
    }
    if(!out.length){ setP(100,'В файле нет подходящих строк (все пропущены).',true); setTimeout(()=>document.getElementById('progWrap').classList.add('hide'),5000); return; }
    for(let i=0;i<out.length;i+=500){
      const part=out.slice(i,i+500);
      setP(30+Math.round((i/out.length)*60),`Запись в базу: ${Math.min(i+500,out.length)} из ${out.length}…`);
      const r=await fetch(SUPABASE_URL+'/rest/v1/ozon_charges?on_conflict=row_key',{method:'POST',headers:{...HD,'Content-Type':'application/json',Prefer:'resolution=merge-duplicates'},body:JSON.stringify(part)});
      if(!r.ok)throw new Error('HTTP '+r.status);
    }
    setP(90,'Пересчёт маржи по неделям…');
    const provW=await provisionalWeeks();
    await syncPnl(provW);
    await loadWeeks();
    TEMPS_CACHE={key:'',data:null};
    await loadProto();
    render();
    setP(100,`✔ Готово! Импортировано начислений: ${out.length} (пропущено: ${skipped}). Строк без даты J: ${noEvent}. Маржа пересчитана.`);
    setTimeout(()=>document.getElementById('progWrap').classList.add('hide'),5000);
  }catch(e){
    setP(100,'Ошибка импорта: '+e.message,true);
  }finally{
    btn.disabled=false;btn.textContent='⬆ CSV';document.getElementById('chargesInput').value='';
  }
}

const price=pl.price||0;
const yestRub=yest*price;
const avgRub=avg*price;
const rcExpRub=rcExp*price;

function seriesFor(p,key){

}

function verdict(it){

    if(it.fact_dev==null)return null;
    const B=Number(it.baseline_dev||0),T=Number(it.target_dev||0),F=Number(it.fact_dev||0);
    if(B===T)return F>=B?'success':'fail';
    const pr=(F-B)/(T-B),tol=Math.abs(T-B)*0.1;
    if(pr>=1||Math.abs(F-T)<=tol)return 'success';
    return pr>0?'partial':'fail';
  }
  if(it.fact_ctx==null)return null;
  const fact=JSON.parse(it.fact_ctx);
  const m=it.metric||'orders';
  const B=(m==='orders')?base.orders:base.pct;
  const F=(m==='orders')?fact.orders:fact.pct;
  const T=(m==='orders')?Number(it.target_orders):Number(it.target_pct);
  if(B==null||F==null||T==null||isNaN(T))return null;
  if(Math.abs(T-B)<0.01)return F>=B?'success':'fail';
  const pr=(F-B)/(T-B),tol=Math.abs(T-B)*0.1;
  if(pr>=1||Math.abs(F-T)<=tol)return 'success';
  if(pr>0)return 'partial';
  return 'fail';
}

    j.forEach(x=>map.set(x.sale_date,(map.get(x.sale_date)||0)+Number(x.qty||0)));

async function fetchChargesMap(pid,from,to){
  const offer=(BYID[pid]||{}).offer_id;const map=new Map();let off=0;
  while(true){
    let j=null;
    for(let a=0;a<3;a++){
      const r=await fetch(SUPABASE_URL+`/rest/v1/ozon_charges?offer_id=eq.${encodeURIComponent(offer)}&event_date=gte.${from}&event_date=lte.${to}&select=event_date,charge_type,amount,qty,price&order=row_key&limit=1000&offset=${off}`,{headers:HD});
      if(r.ok){j=await r.json();break;}
      await sleep(700*(a+1));
    }
    if(j==null){console.warn('fetchChargesMap: сервер недоступен после ретраев',offer,from,to);break;}
    j.forEach(c=>{const d=c.event_date;if(!d)return;let g=map.get(d);if(!g){g={pnl:0,gmv:0,sales:0,revP:0};map.set(d,g);}const amt=Number(c.amount||0),qty=Number(c.qty||0),price=Number(c.price||0);g.pnl+=amt;if(c.charge_type==='Выручка'){g.gmv+=price*qty;g.sales+=qty;g.revP+=amt;}else if(c.charge_type==='Возврат выручки'){g.gmv+=price*qty;g.sales-=qty;g.revP+=amt;}});
    if(j.length<1000)break;off+=1000;
  }
  return map;
}
async function ordersForDay(pid,iso){const m=await fetchSalesMap(pid,iso,iso);return m.get(iso)||0;}
async function ordersAvgWeekdays(pid,from,to){
  const m=await fetchSalesMap(pid,from,to);
  let sum=0,cnt=0,d=from;
  while(d<=to){if(!isWeekend(d)){sum+=(m.get(d)||0);cnt++;}d=addDaysISO(d,1);}
  if(!cnt)return null;
  return Math.round(sum/cnt*100)/100;
}
 function lastWeekdaysBefore(iso,n){const out=[];let d=addDaysISO(iso,-1);while(out.length<n){if(!isWeekend(d))out.unshift(d);d=addDaysISO(d,-1);}return out;}
async function ordersBaseWindow(pid,startISO){
  const days=lastWeekdaysBefore(startISO,3);
  const m=await fetchSalesMap(pid,days[0],days[days.length-1]);
  let sum=0;days.forEach(d=>{sum+=(m.get(d)||0);});
  return {avg:Math.round(sum/days.length*100)/100,from:days[0],to:days[days.length-1],days:days.length};
}
async function marginAggPeriod(pid,fromISO,toISO){
  const map=await fetchChargesMap(pid,fromISO,toISO);
  const adsMap=await loadAdSpend(fromISO,toISO);
  const adsByDay=adsMap.get(pid)||new Map();
  let pnl=0,gmv=0,sales=0,revP=0,cogs=0,cnt=0,ads=0,d=fromISO;
  while(d<=toISO){
    const g=map.get(d);
    if(g&&g.gmv>0){pnl+=g.pnl;gmv+=g.gmv;sales+=g.sales;revP+=g.revP||0;cogs+=costAt(pid,d).cost*g.sales;cnt++;}
    ads+=adsByDay.get(d)||0;
    d=addDaysISO(d,1);
  }
  if(!cnt||gmv<=0)return null;
  const tax=TAX_RATE*revP;  // себестоимость — на дату (costAt), как syncPnl
  return {pct:Math.round(((pnl-cogs-ads-tax)/gmv*100)*100)/100,from:fromISO,to:toISO,days:cnt};
}

async function loadPulse(pid){
  const offer=(BYID[pid]||{}).offer_id;
  const box=document.getElementById('pulsetbl_'+pid);
  try{ if(box)box.innerHTML=await pulseHtml(pid,offer); }
  catch(e){
    if(box)box.innerHTML=`<div class="psub" style="color:#E33D78">Ошибка загрузки: ${esc(e.message)}. Сверните и раскройте блок, чтобы повторить.</div>`;
    const el=document.getElementById('pulse_'+pid); if(el)delete el.dataset.loaded;
  }
}
// постраничное чтение; сортировка — по уникальному ключу; ошибка сервера — исключение (не молча неполные данные)
async function pulseFetch(path){
  let out=[],off=0;
  while(true){
    const r=await fetch(SUPABASE_URL+`/rest/v1/${path}&limit=1000&offset=${off}`,{headers:HD});
    if(!r.ok)throw new Error(path.split('?')[0]+' HTTP '+r.status);
    const j=await r.json(); out=out.concat(j); if(j.length<1000)break; off+=1000;
  }
  return out;
}
// начисления товара, сложенные базой по дню заказа и типу (представление ozon_charges_by_event, sql/2026-10-30_…): у ходовых
// товаров сотни тысяч строк. Окно ~100 дней база не успевает сложить за 8 с (statement timeout) — запросы по неделям, параллельно.
// Нет представления (404) — построчно (медленно), gmv = цена × шт
async function pulseCharges(o,from,to){
  const parts=[];
  for(let d=from;d<=to;d=addDaysISO(d,7)){ const e=addDaysISO(d,6);
    parts.push(pulseFetch(`ozon_charges_by_event?offer_id=eq.${o}&event_date=gte.${d}&event_date=lte.${e<to?e:to}&select=event_date,charge_type,amount,qty,gmv&order=event_date,charge_type`)); }
  try{ return (await Promise.all(parts)).flat(); }
  catch(e){
    if(!/HTTP 404/.test(e.message))throw e;
    return (await pulseFetch(`ozon_charges?offer_id=eq.${o}&event_date=gte.${from}&event_date=lte.${to}&select=event_date,charge_type,amount,qty,price&order=row_key`)).map(c=>({...c,gmv:Number(c.price||0)*Number(c.qty||0)}));
  }
}
async function pulseHtml(pid,offer){
  if(!WEEKISO.length)return '<div class="psub">нет недель</div>';
  // период — недели месяца, дополненные до целого месяца (если 1-е или последнее число вне ISO-недель)
  const [py,pm]=MONTH.split('-').map(Number);
  const mStart=new Date(py,pm-1,1), mEnd=new Date(py,pm,0);
  const wStart=parseW(WEEKISO[0]), wEnd=weekEnd(parseW(WEEKISO[WEEKISO.length-1]));
  const start=wStart<mStart?wStart:mStart, end=wEnd>mEnd?wEnd:mEnd;
  const first=localISO(start), last=localISO(end);
  const todayISO=localISO(new Date());
  // данные — с запасом: лимиты ДРР дней таблицы и маржинальность до рекламы 4 недели назад
  const from=addDaysISO(first<todayISO?first:todayISO,-64);
  const o=encodeURIComponent(offer);
  const [salesRows,stockRows,chargeRows,lastRow,adsMap,temps]=await Promise.all([
    pulseFetch(`product_sales?offer_id=eq.${o}&sale_date=gte.${from}&sale_date=lte.${last}&select=sale_date,qty,revenue&order=sale_date.asc,warehouse_name.asc`),
    pulseFetch(`stock_history?offer_id=eq.${o}&report_date=gte.${first}&report_date=lte.${last}&select=report_date,stock&order=report_date.asc,warehouse_name.asc`),
    pulseCharges(o,from,last),
    fetch(SUPABASE_URL+'/rest/v1/product_sales?select=sale_date&order=sale_date.desc&limit=1',{headers:HD}).then(r=>{if(!r.ok)throw new Error('product_sales HTTP '+r.status);return r.json();}),
    loadAdSpend(from,last),
    computeOrderTemps()
  ]);
  // последний загруженный день заказов (по всем товарам): до него день без строк = 0 заказов, не «нет данных»
  const lastSale=lastRow.length?lastRow[0].sale_date:'';
  const byDaySales=new Map(), byDayRev=new Map();
  salesRows.forEach(r=>{ byDaySales.set(r.sale_date,(byDaySales.get(r.sale_date)||0)+Number(r.qty||0)); byDayRev.set(r.sale_date,(byDayRev.get(r.sale_date)||0)+Number(r.revenue||0)); });
  const rawStock=new Map();
  stockRows.forEach(r=>{ rawStock.set(r.report_date,(rawStock.get(r.report_date)||0)+Number(r.stock||0)); });
  // начисления по дате заказа (event_date): все начисления по заказам дня, когда бы Ozon их ни провёл
  const byDayCh=new Map();
  chargeRows.forEach(c=>{
    const d=c.event_date; if(!d)return;
    let g=byDayCh.get(d); if(!g){g={gmv:0,sales:0,pnl:0,revP:0};byDayCh.set(d,g);}
    const amt=Number(c.amount||0), qty=Number(c.qty||0), gv=Number(c.gmv||0);
    g.pnl+=amt;
    if(c.charge_type==='Выручка'){ g.gmv+=gv; g.sales+=qty; g.revP+=amt; }
    else if(c.charge_type==='Возврат выручки'){ g.gmv+=gv; g.sales-=qty; g.revP+=amt; }
  });
  const adsByDay=adsMap.get(pid)||new Map();
  // сумма за период по дате заказа: GMV, маржа до рекламы (pnl − себестоимость на дату − налог), реклама, выручка заказов PNL
  const agg=(f,t)=>{
    let gmv=0,pre=0,ads=0,rev=0;
    for(let d=f;d<=t;d=addDaysISO(d,1)){
      const g=byDayCh.get(d);
      if(g){ gmv+=g.gmv; pre+=g.pnl-costAt(pid,d).cost*g.sales-TAX_RATE*g.revP; }
      ads+=adsByDay.get(d)||0; rev+=byDayRev.get(d)||0;
    }
    return {gmv,pre,ads,rev};
  };
  // лимиты ДРР товара (в долях выручки заказов, как ДРР на странице): безубыточный = маржинальность до рекламы × выкуп,
  // плановый = (маржинальность до рекламы − план маржинальности) × выкуп; выкуп = GMV ÷ выручка заказов.
  // Обе величины — медиана 4 недель окна: одна неделя с аномальными начислениями не обнуляет лимит (решение 30.10.2026)
  const med=a=>{ if(!a.length)return null; const b=[...a].sort((x,y)=>x-y), m=b.length>>1; return b.length%2?b[m]:(b[m-1]+b[m])/2; };
  // лимит на день d — по 28 «созревшим» дням заказов, закончившимся за 8 дней до d (выкупы и возвраты по ним уже пришли);
  // каждый день таблицы красится по своему лимиту, будущие — по сегодняшнему (решение 30.10.2026)
  const planPct=PLAN[pid]&&PLAN[pid].margin_pct!=null&&PLAN[pid].plan_qty>0?Number(PLAN[pid].margin_pct):null;
  const LIM_MEMO=new Map();
  const limAt=d=>{
    if(LIM_MEMO.has(d))return LIM_MEMO.get(d);
    const to=addDaysISO(d,-8), fr=addDaysISO(to,-27);
    const weeks=[0,1,2,3].map(i=>{ const f=addDaysISO(fr,i*7), t=addDaysISO(f,6), a=agg(f,t);
      return {f,t,pre:a.gmv>0?a.pre/a.gmv*100:null,buy:a.gmv>0&&a.rev>0?a.gmv/a.rev:null}; });
    const preW=weeks.map(w=>w.pre).filter(v=>v!=null), buyW=weeks.map(w=>w.buy).filter(v=>v!=null);
    const L={ok:preW.length>0&&buyW.length>0,from:fr,to,weeks,planPct};
    if(L.ok){
      L.pre=med(preW); L.buy=med(buyW);
      L.be=Math.max(0,L.pre*L.buy);
      L.target=planPct==null?null:Math.max(0,(L.pre-planPct)*L.buy);
    }
    LIM_MEMO.set(d,L); return L;
  };
  const lim=limAt(todayISO), limFrom=lim.from, limTo=lim.to, limWeeks=lim.weeks;
  const days=[];
  for(let d=new Date(start); d<=end; d.setDate(d.getDate()+1)){ days.push(localISO(new Date(d))); }
  const salesVals=days.map(iso=>{ const v=byDaySales.get(iso); return v!=null?v:(iso<=lastSale?0:null); });
  const stockVals=days.map(iso=>{ const v=rawStock.get(iso); return v==null?null:v; });
  const priceVals=days.map(iso=>{ const q=byDaySales.get(iso)||0; return q>0?(byDayRev.get(iso)||0)/q:null; });
  // маржинальность за 7 дней по дату (по дате заказа): до рекламы и после; реклама — по дате расхода
  const roll=days.map(iso=>{
    if(iso>=todayISO)return null;
    const a=agg(addDaysISO(iso,-6),iso);
    return a.gmv>0?{pre:a.pre/a.gmv*100,net:(a.pre-a.ads)/a.gmv*100}:null;
  });
  // ДРР — как на главной: реклама дня ÷ выручка PNL заказов того же дня (product_sales.revenue)
  // лимит дня (решение владельца 30.10.2026, «по факту»): день старше 8 дней (выкупы пришли) — по фактической маржинальности до рекламы
  // и выкупу 7 дней по этот день, цвет ДРР согласуется с маржинальностью за 7 дн.; последние 7 дней и будущие — последний известный (lim)
  const matureTo=addDaysISO(todayISO,-8);
  const factLim=iso=>{ const f=addDaysISO(iso,-6), a=agg(f,iso), L={ok:a.gmv>0&&a.rev>0,from:f,to:iso,fact:true};
    if(L.ok){ L.pre=a.pre/a.gmv*100; L.buy=a.gmv/a.rev; L.be=Math.max(0,L.pre*L.buy); L.target=planPct==null?null:Math.max(0,(L.pre-planPct)*L.buy); }
    return L; };
  const dayLim=days.map(iso=>iso<=matureTo?factLim(iso):lim);
  const drrVals=days.map(iso=>{
    const ads=adsByDay.get(iso)||0;
    if(ads===0) return null;
    const rev=byDayRev.get(iso)||0;
    if(rev<=0) return (iso<=lastSale)?Infinity:null;
    return ads/rev*100;
  });
  const salesNums=salesVals.filter(v=>v!=null);
  const sMn=salesNums.length?Math.min(...salesNums):0, sMx=salesNums.length?Math.max(...salesNums):0;
  const salesBg=v=>{ if(v==null||!salesNums.length)return ''; const t=(sMx===sMn)?0.5:(v-sMn)/(sMx-sMn); return `background:rgba(22,163,74,${(0.06+0.44*t).toFixed(2)});`; };
  const stockNums=stockVals.filter(v=>v!=null);
  const kMn=stockNums.length?Math.min(...stockNums):0, kMx=stockNums.length?Math.max(...stockNums):0;
  const stockBg=v=>{ if(v==null||!stockNums.length)return ''; const t=(kMx===kMn)?0.5:(v-kMn)/(kMx-kMn); return `background:rgba(227,61,120,${(0.44-0.38*t).toFixed(2)});`; };
  // маржинальность — относительно плана: зелёный — не ниже плана, жёлтый — от 0 до плана, красный — убыток
  const marginBg=v=>{ if(v==null)return ''; if(v<0)return 'background:rgba(227,61,120,0.30);'; if(planPct!=null&&v<planPct)return 'background:rgba(253,224,71,0.45);'; return 'background:rgba(22,163,74,0.30);'; };
  const planPrice=PLAN[pid]&&PLAN[pid].plan_qty>0?Number(PLAN[pid].price):null;
  const priceBg=v=>(v==null||planPrice==null)?'':(v<planPrice*0.98?'background:rgba(227,61,120,.14);':'');
  // ДРР: зелёный — до планового лимита, жёлтый — до безубыточного, красный — выше (убыток)
  const drrZone=(v,L)=>{ if(v==null)return null; if(!isFinite(v))return 'red'; if(!L.ok)return null; if(v>L.be)return 'red'; if(L.target!=null&&v>L.target)return 'yellow'; return 'green'; };
  const ZBG={red:'background:rgba(227,61,120,0.38);',yellow:'background:rgba(253,224,71,0.45);',green:'background:rgba(22,163,74,0.30);'};
  const drrBg=(v,L)=>{ if(v!=null&&!isFinite(v))return 'background:rgba(227,61,120,0.45);'; const z=drrZone(v,L); return z?ZBG[z]:''; };
  // «Что делать» — по последним 7 прошедшим дням: зоны ДРР, заказы к плану, цена к плану, маржинальность до рекламы сейчас и 4 недели назад
  const verdict=(()=>{
    const idx=days.map((iso,i)=>i).filter(i=>days[i]<todayISO&&days[i]>=addDaysISO(todayISO,-7));
    const z={red:0,yellow:0,green:0,none:0};
    idx.forEach(i=>{ const k=drrZone(drrVals[i],dayLim[i]); z[k||'none']++; });
    const rec=idx.slice(-3).map(i=>drrZone(drrVals[i],dayLim[i])).filter(Boolean);
    const recentBad=rec.filter(k=>k!=='green').length, recentOk=rec.length===3&&recentBad===0;
    let q=0,r=0,pq=0; const p=BYID[pid];
    for(let d=addDaysISO(todayISO,-7);d<todayISO;d=addDaysISO(d,1)){ q+=byDaySales.get(d)||0; r+=byDayRev.get(d)||0; const s=p?dayShare(p,d,'sales'):null; if(s!=null)pq+=s; }
    const price7=q>0?r/q:null, priceLow=price7!=null&&planPrice!=null&&price7<planPrice*0.98;
    const ordPct=pq>0?q/pq*100:null;
    const prev=limAt(addDaysISO(todayISO,-28)), drop=lim.ok&&prev.ok?prev.pre-lim.pre:null;
    const facts=[];
    if(z.red+z.yellow+z.green)facts.push(`реклама за 7 дн: 🔴 ${z.red} · 🟡 ${z.yellow} · 🟢 ${z.green} дн.`);
    if(ordPct!=null)facts.push(`заказы ${fmt(q)} шт — ${fmt(ordPct)}% плана`);
    if(price7!=null)facts.push(`цена ${fmt(price7)} ₽${planPrice!=null?` (план ${fmt(planPrice)} ₽)`:''}`);
    const per=L=>`заказы ${ddmm(L.from)}–${ddmm(L.to)}`;
    if(lim.ok)facts.push(`маржинальность до рекламы ${f1(lim.pre)}% (${per(lim)})${prev.ok?`, 4 нед. назад ${f1(prev.pre)}% (${per(prev)})`:''}${planPct!=null?`, план маржинальности ${f1(planPct)}%`:''}`);
    const lt=lim.ok?(lim.target!=null?lim.target:lim.be):null;
    let act,lvl;
    if(!lim.ok){ act='Лимиты рекламы не рассчитаны — мало выкупов за 4 недели.'; lvl='none'; }
    else if(lim.pre<0){ act='Товар убыточен ещё до рекламы — реклама только увеличивает убыток. Смотрите цену и расходы (комиссия, логистика, себестоимость).'; lvl='red'; }
    else if(planPct!=null&&lim.pre<planPct){ act=`План маржинальности не выйдет даже без рекламы: маржинальность до рекламы ${f1(lim.pre)}% (${per(lim)}) ниже плана ${f1(planPct)}%. Смотрите цену${priceLow?' — она ниже плана':''} и расходы или пересмотрите план.`; lvl='red'; }
    else if(z.red+z.yellow>=2&&recentOk){ act=`Реклама уже в лимите последние 3 дня (до этого выше лимита ${z.red+z.yellow-recentBad} дн.) — маржинальность за 7 дн. отстаёт: в окне ещё дни с дорогой рекламой и невыкупленные заказы. Держите ДРР не выше ${f1(lt)}% и проверьте через неделю.`; lvl='green'; }
    else if(z.red>=3){ act=`Сократите рекламу: ДРР выше безубыточного (${f1(lim.be)}%) ${z.red} дн. из 7 — реклама съедает всю маржу.`; lvl='red'; }
    else if(z.red+z.yellow>=4){
      act=(drop!=null&&drop>=2)
        ?`Реклама выше планового лимита (${f1(lt)}%), потому что маржинальность до рекламы снизилась с ${f1(prev.pre)}% (${per(prev)}) до ${f1(lim.pre)}% (${per(lim)})${priceLow?' — цена ниже плана, вероятная причина':''}. Сначала смотрите ${priceLow?'цену':'цену и расходы'}, затем — рекламу.`
        :`Реклама выше планового лимита (${f1(lt)}%): снизьте её${priceLow?' или верните цену к плану':' или поднимите цену'}.`;
      lvl='yellow'; }
    else if(ordPct!=null&&ordPct<90){ act=`Реклама в лимите, заказов ${fmt(ordPct)}% плана — есть запас: рекламу можно добавить до ${f1(lt)}%.`; lvl='green'; }
    else { act='В норме: реклама в лимите'+(ordPct!=null?`, заказы ${fmt(ordPct)}% плана`:'')+'.'; lvl='green'; }
    const bc={red:'#E33D78',yellow:'#eab308',green:'#16a34a',none:'#94a3b8'}[lvl];
    return `<div style="border-left:4px solid ${bc};background:#f8f9fb;padding:6px 10px;margin:4px 0 8px;font-size:.86em;color:#1C0D2E"><b>Что делать:</b> ${esc(act)}<div style="color:#64748b;margin-top:2px">${esc(facts.join(' · '))}</div></div>`;
  })();
  const nowMs=new Date().getTime();
  const T=s=>s.replace(/"/g,'&quot;');
  let h=verdict+'<div class="pulsewrap"><table class="pulsetable"><thead><tr><th>Параметр</th>';
  days.forEach(iso=>{
    const prov=iso<todayISO&&(nowMs-parseW(iso).getTime())<7*86400000;
    h+=prov?`<th title="предварительно: выкупы и возвраты по заказам этого дня ещё приходят — маржинальность уточнится сама">${ddmm(iso)}*</th>`:`<th>${ddmm(iso)}</th>`;
  });
  h+='</tr></thead><tbody>';
  const trow=(temps[matrixOf(offer)]||[]).find(x=>x.offer===offer);
  h+=`<tr><td class="pulsemetric" title="${T('Сколько штук заказали за день (до выкупа и отмен).\n\nС сегодняшнего дня — план дня / догоняющий темп: сколько нужно заказов в день, чтобы выйти на план месяца (выходной × 0,7).')}">Заказы, шт</td>`;
  salesVals.forEach((v,idx)=>{
    const iso=days[idx];
    if(v!=null){ h+=`<td class="num" style="${salesBg(v)}">${fmt(v)}</td>`; return; }
    if(iso>=todayISO){
      const p=BYID[pid];
      const planDay=p?dayShare(p,iso,'sales'):null;
      const inMonth=iso.slice(0,7)===MONTH;
      const catchDay=(inMonth&&trow)?trow.rc*(isWeekend(iso)?0.7:1):null;
      if(planDay==null&&catchDay==null){ h+=`<td class="num" style="${salesBg(v)}">—</td>`; return; }
      const cell=planDay!=null?(catchDay!=null?`${fmt(planDay)}/${fmt(catchDay)}`:`${fmt(planDay)}`):`${fmt(catchDay)}`;
      h+=`<td class="num factcell" title="Плановый темп / догоняющий темп дня, шт (выходные ×0,7)">${cell}</td>`;
      return;
    }
    h+=`<td class="num" style="${salesBg(v)}">—</td>`;
  });
  h+='</tr>';
  h+=`<tr><td class="pulsemetric" title="${T('Средняя цена заказа за день: выручка заказов ÷ штуки (рычаг 1 — цена).\n\n'+(planPrice!=null?`Цена в плане — ${fmt(planPrice)} ₽; розовым — ниже плана больше чем на 2%.`:'Плана на месяц нет.'))}">Цена заказа, ₽</td>`;
  priceVals.forEach(v=>{ h+=`<td class="num" style="${priceBg(v)}">${v==null?'—':fmt(v)}</td>`; });
  h+='</tr>';
  const limTip=lim.ok
    ?`Лимиты товара — по заказам ${ddmm(limFrom)}–${ddmm(limTo)} (выкупы по ним уже пришли), медиана 4 недель — одна неудачная неделя не искажает лимит:\n`
      +limWeeks.map(w=>`  ${ddmm(w.f)}–${ddmm(w.t)}: до рекламы ${w.pre==null?'—':f1(w.pre)+'%'}, выкуп ${w.buy==null?'—':f1(w.buy*100)+'%'}`).join('\n')
      +`\n• маржинальность до рекламы (медиана) — ${f1(lim.pre)}% от суммы выкупов (GMV);\n• выкупается (медиана) ${f1(lim.buy*100)}% выручки заказов;\n• безубыточный ДРР = ${f1(lim.pre)}% × ${f1(lim.buy*100)}% = ${f1(lim.be)}%`
      +(lim.target!=null?`;\n• плановый ДРР = (${f1(lim.pre)}% − план маржинальности ${f1(lim.planPct)}%) × ${f1(lim.buy*100)}% = ${f1(lim.target)}%.`:'.\n• планового лимита нет — нет плана маржинальности на месяц.')

function arcPath(cx,cy,rO,rI,a0,a1){
  const p=(r,a)=>[cx+r*Math.cos(a),cy+r*Math.sin(a)];
  const [x0,y0]=p(rO,a0),[x1,y1]=p(rO,a1),[x2,y2]=p(rI,a1),[x3,y3]=p(rI,a0);
  const large=(a1-a0)>Math.PI?1:0;
  return `M${x0.toFixed(2)} ${y0.toFixed(2)} A${rO} ${rO} 0 ${large} 1 ${x1.toFixed(2)} ${y1.toFixed(2)} L${x2.toFixed(2)} ${y2.toFixed(2)} A${rI} ${rI} 0 ${large} 0 ${x3.toFixed(2)} ${y3.toFixed(2)} Z`;
}

  legend.innerHTML=buckets.map((b,i)=>{ const v=get(b);const share=total>0?(v/total*100).toLocaleString('ru-RU',{maximumFractionDigits:1}):'0'; return `<div class="lrow" data-i="${i}"><span class="dot" style="background:${b.color}"></span>${b.label}<span class="lcnt">${fmtSide(b)}</span><span class="lval">${share}% • ${fmtMain(b)}</span></div>`; }).join('');
  legend.querySelectorAll('.lrow').forEach(r=>{ const i=+r.dataset.i; r.addEventListener('mouseenter',()=>hl(i,true)); r.addEventListener('mouseleave',()=>hl(i,false)); });
}
function matrixStats(list){
  const buckets=[{label:'до 5%',color:'#E33D78',rev:0,cnt:0},{label:'5–10%',color:'#d97706',rev:0,cnt:0},{label:'свыше 10%',color:'#16a34a',rev:0,cnt:0}];
  let tRub=0,tMar=0,tMarRaw=0,tFRev=0,tFMar=0,tOrd=0,tOrdRev=0;
  let factRev=0,factMar=0,factCnt=0;
  list.forEach(p=>{
    const pl=PLAN[p.product_id]||{price:Number(p.price||0),plan_qty:0,margin_pct:0};
    const rev=pl.plan_qty*pl.price, mar=pl.plan_qty*pl.price*pl.margin_pct/100;
    tRub+=rev; tMar+=mar*KAPPA.k; tMarRaw+=mar;
    const pvRev=projVal(p,'revn'), pvMar=projVal(p,'mar');
    if(pvRev.ffV!=null)tFRev+=pvRev.ffV;
    if(pvMar.ffV!=null)tFMar+=pvMar.ffV;
    const fRev=calcFactToDate(p,'revn'), fMar=calcFactToDate(p,'mar');
    if(fRev!=null){ factRev+=fRev; factCnt++; }
    if(fMar!=null) factMar+=fMar;
    const b=pl.margin_pct<=5?buckets[0]:(pl.margin_pct<=10?buckets[1]:buckets[2]); b.rev+=rev; b.cnt+=1;
  });
  return {buckets,tRub,tMar,tMarRaw,tFRev,tFMar,tOrd,tOrdRev,factRev,factMar,factCnt};
}
function hypStats(list){
  let active=0,success=0,fail=0;
  list.forEach(p=>{
    const items=(PROTO[p.product_id]||[]).filter(it=>{
      if(it.parent_id)return false;
      return it.deadline?monthOfWeekISO(it.deadline)===MONTH:it.month===MONTH;
    });
    items.forEach(it=>{
      if(it.fact_dev==null) active++;
      else{
        const v=verdict(it);
        if(v==='success'||v==='partial') success++;
        if(v==='fail') fail++;
      }
    });
  });
  return {active,success,fail};
}

    const zp=(pl.plan_qty||0)===0;
    const hasActive=(PROTO[pid]||[]).some(it=>!it.parent_id&&it.deadline&&it.deadline>=localISO(new Date())&&it.fact_dev==null);
    const dateLocked=hasActive;
    const ana=anaMarks([pid]);
    const trc=[zp?'zeroplan':'',ana.on?'anareq':'',inFam?'famchild':''].filter(Boolean).join(' ');
    let h=`<tr data-pid="${pid}"${trc?` class="${trc}"`:''}>
      <td class="num okey" title="${esc(p.name)}${ana.on?' — '+ana.tip:''} — открыть протокол" onclick="toggleProto(${pid})">${ana.icons}${esc(p.offer_id)}</td>`;
    if(dateLocked){
      h+=`<td><span class="datelocked" title="дата зафиксирована гипотезой">${wd?ddmm(wd):'—'}</span></td>`;
    }else{
      h+=`<td><span class="dateshort" title="Дата работы" onclick="openDate(${pid})">${wd?ddmm(wd):'—'}</span><input type="date" class="datehidden" id="dt_${pid}" value="${wd}" onchange="setWorkDate(${pid},this.value)"></td>`;
    }
    METRICS.forEach(mt=>{
      const planV=monthlyPlan(p,mt.key);
      let ffV=null, dev=null;
      if(mt.key==='price'){ const ap=avgPriceFact(p); ffV=ap; dev=ap==null?null:ap-planV; }
      else if(mt.key==='pct'){ const ap=avgPctFact(p); ffV=ap; dev=ap==null?null:ap-planV; }
      else { const pv=projVal(p,mt.key); ffV=pv.ffV; dev=pv.dev; }
      const dcls=dev==null?'n':(dev>0?'g':dev<0?'r':'n');
      // план меняется только на картах Шухарта (beautyart-home/shewhart.html, решение владельца 29.10.2026) — здесь только просмотр
      h+=`<td class="num sep" ${mt.edit?`title="План задаётся на картах Шухарта"`:''}>${planV==null?'—':fmtFor(mt.key,planV)}</td>`;
      h+=`<td class="num calc">${ffV==null?'—':fmtFor(mt.key,ffV)}</td>`;
      h+=`<td class="num ${dcls}">${dev==null?'—':(dev>0?'+':'')+fmtFor(mt.key,dev)}</td>`;
      if(EXP[mt.key]){
        if(mt.key==='price'){
          WEEKISO.forEach((w,i)=>{ const pf=priceFactForWeek(pid,w); h+=`<td class="num wcell factcell" title="Факт цены (PNL)">${pf==null?'—':fmt2(pf)}</td>`; });
        }else if(mt.key==='pct'){
          WEEKISO.forEach((w,i)=>{ const pf=pctFactForWeek(pid,w); h+=`<td class="num wcell factcell" title="Факт маржин. (PNL)">${pf==null?'—':fmt2(pf)}</td>`; });
        }else if(mt.plan===false){
          WEEKISO.forEach((w,i)=>{ const r=getRec(pid,WDKEY[mt.key],w); h+=`<td class="num wcell factcell" title="Факт (заказы)">${r.fact==null?'—':wfmt(mt.key,r.fact)}</td>`; });
        }else{
          const series=seriesFor(p,mt.key);
          WEEKISO.forEach((w,i)=>{
            const rec=getRec(pid,WDKEY[mt.key],w);
            const s=series[i];
            if(s.locked){ h+=`<td class="num wcell calc" title="Расчёт (факт+динамика)">${wfmt(mt.key,s.forecast)}</td>`; }
            else{
              const rst=s.manual?`<span class="resetbtn" title="Вернуть расчётное" onclick="resetWeek(event,${pid},'${w}','${WDKEY[mt.key]}')">↺</span>`:'';
              h+=`<td class="num wcell wedit ${s.manual?'':'autocell'}" title="Прогноз" onclick="editWeek(${pid},'${w}','${WDKEY[mt.key]}')">${wfmt(mt.key,s.forecast)}<span class="editbtn">✎</span>${rst}</td>`;
            }
            h+=`<td class="num wcell factcell" title="Факт">${rec.fact==null?'—':wfmt(mt.key,rec.fact)}</td>`;
          });
        }
      }
    });
    h+=`</tr>`;
    if(openProto.has(pid)){
      h+=`<tr class="protorow"><td colspan="${totalCols}"><div class="protowrap">${protoBlock(pid,p.offer_id)}</div></td></tr>`;
    }
    return h;
  };
  // перчатки: группа = артикул до кода цвета (как в отчёте РОПа); строка группы — суммы, только чтение, раскрывается до размеров
  const famRow=f=>{
    const ms=f.members,S=fn=>ms.reduce((s,p)=>{const v=fn(p);return s+(v==null?0:v);},0),any=fn=>ms.some(p=>fn(p)!=null);
    const open=FAMOPEN.has(f.key),ana=anaMarks(ms.map(p=>p.product_id));
    const dates=ms.map(p=>PPM[p.product_id]&&PPM[p.product_id].work_date).filter(Boolean).sort();
    const pv=k=>({plan:S(p=>monthlyPlan(p,k)),ff:any(p=>projVal(p,k).ffV)?S(p=>projVal(p,k).ffV):null,dev:any(p=>projVal(p,k).dev)?S(p=>projVal(p,k).dev):null});
    const add={sales:pv('sales'),revn:pv('revn'),mar:pv('mar')};
    const wsum=(key,w)=>{let t=0,a=false;ms.forEach(p=>{const r=getRec(p.product_id,key,w);if(r.fact!=null){t+=r.fact;a=true;}});return a?t:null;};
    const ratio=(nk,dk,mul)=>{let N=0,Dn=0,a=false;ms.forEach(p=>WEEKISO.forEach(w=>{const n=getRec(p.product_id,nk,w),d=getRec(p.product_id,dk,w);if(n.fact!=null&&d.fact!=null&&d.fact!==0){N+=n.fact;Dn+=d.fact;a=true;}}));return a&&Dn!==0?N/Dn*mul:null;};
    const wratio=(nk,dk,mul,w)=>{let N=0,Dn=0,a=false;ms.forEach(p=>{const n=getRec(p.product_id,nk,w),d=getRec(p.product_id,dk,w);if(n.fact!=null&&d.fact!=null&&d.fact!==0){N+=n.fact;Dn+=d.fact;a=true;}});return a&&Dn!==0?N/Dn*mul:null;};
    let h=`<tr class="famrow${ana.on?' anareq':''}" data-fam="${f.key}"><td class="num okey" title="Группа перчаток: ${ms.length} поз. — раскрыть размеры${ana.on?' — '+ana.tip:''}" onclick="toggleFam('${f.key}')">${open?'▾':'▸'} ${ana.icons}${esc(f.key)}-* <span class="famcnt">(${ms.length})</span></td>`;
    h+=`<td><span class="datelocked" title="ближайшая дата работы среди размеров">${dates[0]?ddmm(dates[0]):'—'}</span></td>`;
    METRICS.forEach(mt=>{
      let planV,ffV,dev;
      if(add[mt.key]){planV=add[mt.key].plan;ffV=add[mt.key].ff;dev=add[mt.key].dev;}
      else if(mt.key==='price'){planV=add.sales.plan>0?add.revn.plan/add.sales.plan:null;ffV=ratio('revg','ug',1);dev=ffV==null||planV==null?null:ffV-planV;}
      else{planV=add.revn.plan!==0?add.mar.plan/KAPPA.k/add.revn.plan*100:null;ffV=ratio('mar','revn',100);dev=ffV==null||planV==null?null:ffV-planV;}
      const dcls=dev==null?'n':(dev>0?'g':dev<0?'r':'n');
      h+=`<td class="num sep">${planV==null?'—':fmtFor(mt.key,planV)}</td><td class="num calc">${ffV==null?'—':fmtFor(mt.key,ffV)}</td><td class="num ${dcls}">${dev==null?'—':(dev>0?'+':'')+fmtFor(mt.key,dev)}</td>`;
      if(EXP[mt.key]){
        if(mt.key==='price')WEEKISO.forEach(w=>{const v=wratio('revg','ug',1,w);h+=`<td class="num wcell factcell">${v==null?'—':fmt2(v)}</td>`;});
        else if(mt.key==='pct')WEEKISO.forEach(w=>{const v=wratio('mar','revn',100,w);h+=`<td class="num wcell factcell">${v==null?'—':fmt2(v)}</td>`;});
        else if(mt.plan===false)WEEKISO.forEach(w=>{const v=wsum(WDKEY[mt.key],w);h+=`<td class="num wcell factcell">${v==null?'—':wfmt(mt.key,v)}</td>`;});
        else{const ser=ms.map(p=>seriesFor(p,mt.key));WEEKISO.forEach((w,i)=>{const fc=ser.reduce((s,x)=>s+(x[i].forecast||0),0),fa=wsum(WDKEY[mt.key],w);h+=`<td class="num wcell calc">${wfmt(mt.key,fc)}</td><td class="num wcell factcell">${fa==null?'—':wfmt(mt.key,fa)}</td>`;});}
      }
    });
    h+='</tr>';
    if(open)h+=ms.slice().sort((a,b)=>devOf(a)-devOf(b)).map(p=>prodRow(p,true)).join('');
    return h;
  };
  // список менеджера → позиции: товары и группы перчаток (от 2 товаров); дата группы — ближайшая среди размеров
  const toItems=list=>{
    const fam=new Map(),out=[];
    list.forEach(p=>{const k=gloveFamily(p.offer_id);if(!k){out.push({p});return;}if(!fam.has(k))fam.set(k,[]);fam.get(k).push(p);});
    fam.forEach((ms,k)=>{if(ms.length<2){out.push({p:ms[0]});return;}out.push({f:{key:k,members:ms}});});
    return out;
  };
  const itemDate=it=>it.p?((PPM[it.p.product_id]&&PPM[it.p.product_id].work_date)||null):(it.f.members.map(p=>PPM[p.product_id]&&PPM[p.product_id].work_date).filter(Boolean).sort()[0]||null);
  const itemDev=it=>it.p?devOf(it.p):it.f.members.reduce((s,p)=>s+devOf(p),0);
  const itemRow=it=>it.p?prodRow(it.p):famRow(it.f);
  let html='';
  const groups=[['m1','Илья',m1],['m2','Ольга',m2]];
  groups.forEach(([gid,gname,list])=>{
    html+=`<tr class="mgroup"><td colspan="${totalCols}"><button onclick="toggleGM('${gid}')">${GM[gid]?'▾':'▸'}</button>${gname} • ${list.length} поз.</td></tr>`;
    if(!GM[gid])return;
    const items=toItems(list);
    const hasDate=items.some(it=>itemDate(it));
    if(hasDate){
      const byDate=new Map();
      items.forEach(it=>{ const d=itemDate(it); if(!byDate.has(d))byDate.set(d,[]); byDate.get(d).push(it); });
      const dates=[...byDate.keys()].filter(x=>x).sort();
      dates.forEach(d=>{
        html+=`<tr class="dgroup"><td colspan="${totalCols}">${dateHead(d)}</td></tr>`;
        html+=byDate.get(d).sort((a,b)=>itemDev(a)-itemDev(b)).map(itemRow).join('');
      });
      if(byDate.has(null)){
        html+=`<tr class="dgroup"><td colspan="${totalCols}">Без даты</td></tr>`;
        html+=byDate.get(null).sort((a,b)=>itemDev(a)-itemDev(b)).map(itemRow).join('');
      }
    }else{
      html+=items.sort((a,b)=>itemDev(a)-itemDev(b)).map(itemRow).join('');
    }
  });
  document.getElementById('tb').innerHTML=html||`<tr><td colspan="${totalCols}" style="color:#94a3b8">нет данных</td></tr>`;
  openProto.forEach(pid=>{loadSmartBase(pid);});
  applyRowMarks();
}
// пополнение остатков: сумма по складам на последнюю дату снимка против снимка двумя днями ранее
let RESTOCK=null;
async function loadRestock(){
  if(RESTOCK)return RESTOCK;
  const pages=async q=>{let out=[],off=0;while(true){const r=await fetch(SUPABASE_URL+'/rest/v1/'+q+`&order=id&limit=1000&offset=${off}`,{headers:HD});if(!r.ok)throw new Error('stock_history HTTP '+r.status);const j=await r.json();out=out.concat(j);if(j.length<1000)break;off+=1000;}return out;};
  const r1=await fetch(SUPABASE_URL+'/rest/v1/stock_history?select=report_date&order=report_date.desc&limit=1',{headers:HD});
  const last=r1.ok?((await r1.json())[0]||{}).report_date:null;
  if(!last){RESTOCK={map:new Map()};return RESTOCK;}
  const r2=await fetch(SUPABASE_URL+`/rest/v1/stock_history?report_date=lte.${addDaysISO(last,-2)}&select=report_date&order=report_date.desc&limit=1`,{headers:HD});
  const prev=r2.ok?((await r2.json())[0]||{}).report_date:null;
  const sum=rows=>{const m=new Map();rows.forEach(x=>m.set(x.offer_id,(m.get(x.offer_id)||0)+Number(x.stock||0)));return m;};
  const [a,b]=await Promise.all([pages(`stock_history?report_date=eq.${last}&select=offer_id,stock`),prev?pages(`stock_history?report_date=eq.${prev}&select=offer_id,stock`):Promise.resolve([])]);
  const now=sum(a),before=sum(b),map=new Map();
  now.forEach((v,o)=>map.set(o,{now:v,before:before.get(o)||0}));
  RESTOCK={last,prev,map};
  return RESTOCK;
}
// подсветка строк: красный — выручка вчера ниже средней, зелёный — выше; без плана — полупрозрачная;
// жирный — остатки за 2 дня пополнились более чем на 10% от плана месяца
async function applyRowMarks(){
  let temps=null,st=null;
  try{temps=await computeOrderTemps();}catch(e){console.warn('row marks (темпы):',e&&e.message);}
  try{st=await loadRestock();}catch(e){console.warn('row marks (остатки):',e&&e.message);}
  const byOffer=new Map();
  if(temps)(temps.t||[]).forEach(x=>byOffer.set(x.offer,x));
  const fr=temps&&temps.factRev?temps.factRev:new Map();
  document.querySelectorAll('#tb tr[data-pid]').forEach(tr=>{
    const pid=Number(tr.dataset.pid),p=BYID[pid];if(!p)return;
    const pl=PLAN[pid]||{plan_qty:0};
    const notes=[];
    tr.classList.remove('rowdown','rowup','rowrestock');
    const t=byOffer.get(p.offer_id);
    if(t&&!tr.classList.contains('zeroplan')){
      const f=fr.get(p.offer_id)||{yest:0,avg:0};
      if(f.yest<f.avg){tr.classList.add('rowdown');}
      else if(f.yest>f.avg){tr.classList.add('rowup');}
      notes.push(`выручка вчера ${fmt(Math.round(f.yest))} ₽ / средняя ${fmt(Math.round(f.avg))} ₽ (факт)${f.yest===f.avg?' — без изменений':''}`);
    }
    const s=st&&st.map.get(p.offer_id);
    if(s&&st.prev){
      const d=s.now-s.before;
      if(pl.plan_qty>0&&d>0.1*pl.plan_qty)tr.classList.add('rowrestock');
      notes.push(`остатки ${ddmm(st.prev)}→${ddmm(st.last)}: ${fmt(s.before)}→${fmt(s.now)} шт (${d>=0?'+':''}${fmt(d)}${pl.plan_qty>0?`, ${d>=0?'+':''}${f1(d/pl.plan_qty*100)}% плана`:''})`);
    }
    const td=tr.querySelector('td.okey');
    if(td){const base=(td.dataset.t0=td.dataset.t0||td.title);td.title=notes.length?base+'\n'+notes.join('\n'):base;}
  });
}
if(BA_AUTH.has(SUPABASE_URL))go();
