function pieStats(list,mode){
  const buckets=[{label:'до 5%',color:'#E33D78',rev:0,cnt:0},{label:'5–10%',color:'#d97706',rev:0,cnt:0},{label:'свыше 10%',color:'#16a34a',rev:0,cnt:0}];
  let total=0,cnt=0;
  list.forEach(p=>{
    let rev=null,pct=null;
    if(mode==='plan'){const pl=PLAN[p.product_id]||{price:Number(p.price||0),plan_qty:0,margin_pct:0};rev=pl.plan_qty*pl.price;pct=pl.margin_pct;}
    else{const rv=projVal(p,'revn').ffV,mr=projVal(p,'mar').ffV;rev=(rv!=null&&rv>0)?rv:null;pct=(rev!=null&&mr!=null)?mr/rev*100:null;}
    if(rev==null||rev<=0)return;
    if(pct==null)pct=0;
    total+=rev;cnt+=1;
    const b=pct<=5?buckets[0]:(pct<=10?buckets[1]:buckets[2]);b.rev+=rev;b.cnt+=1;
  });
  return {buckets,total,cnt};
}

function isoWeeksOfMonth(y,m){
  const out=[]; let d=new Date(y,m,1);
  d.setDate(d.getDate()-((d.getDay()+6)%7));
  for(let i=0;i<6;i++){ const thu=new Date(d); thu.setDate(thu.getDate()+3);

function costAt(pid,dISO){
  const arr=COST_HIST[pid];
  if(!arr||!arr.length) return {cost:COST[pid]||0, prov:true};
  let best=null;
  for(const rec of arr){ if(rec.t<=dISO) best=rec; else break; }
  if(best) return {cost:best.c, prov:false};
  return {cost:arr[0].c, prov:true};
}

function parseCSV(t){const rows=[];let row=[],cur='',q=false;for(let i=0;i<t.length;i++){const c=t[i];if(q){if(c=='"'){if(t[i+1]=='"'){cur+='"';i++;}else q=false;}else cur+=c;}else{if(c=='"')q=true;else if(c==';'){row.push(cur);cur='';}else if(c==','){row.push(cur);cur='';}else if(c=='\n'){row.push(cur);rows.push(row);row=[];cur='';}else if(c!='\r')cur+=c;}}if(cur!==''||row.length){row.push(cur);rows.push(row);}return rows;}

function parseMoney(s){let t=String(s||'').replace(/[^0-9\-,\.]/g,'');if(t.includes(',')&&t.includes('.'))t=t.replace(/,/g,'');else t=t.replace(',','.');const n=Number(t);return isFinite(n)?n:0;}
function parseDateRu(s){const m=String(s||'').match(/(\d{2})\.(\d{2})\.(\d{4})/);return m?m[3]+'-'+m[2]+'-'+m[1]:null;}
function weekStartOf(iso){const d=parseW(iso);d.setDate(d.getDate()-((d.getDay()+6)%7));return localISO(d);}
async function syncPnl(extraWeeks){
  const weeks=[...new Set([...WEEKISO,...(extraWeeks||[])])].sort();
  if(!weeks.length)return;
  const first=weeks[0], last=localISO(weekEnd(parseW(weeks[weeks.length-1])));
  let rows=[],off=0;
  while(true){
    let j=null;
    for(let a=0;a<3;a++){
      const r=await fetch(SUPABASE_URL+`/rest/v1/ozon_charges?charge_date=gte.${first}&charge_date=lte.${last}&select=offer_id,charge_date,charge_type,amount,qty,price&limit=1000&offset=${off}`,{headers:HD});
      if(r.ok){j=await r.json();break;}
      await sleep(700*(a+1));
    }
    if(j==null)break;
    rows=rows.concat(j); if(j.length<1000)break; off+=1000;
  }
  const adsMap=await loadAdSpend(first,last);
  const day=new Map();
  rows.forEach(c=>{
    const pid=OFFER_PID[c.offer_id]; if(!pid)return;
    const d=c.charge_date; if(!d)return;
    let m=day.get(pid); if(!m){m=new Map();day.set(pid,m);}
    let g=m.get(d); if(!g){g={pnl:0,sales:0,gmv:0,revg:0,ug:0};m.set(d,g);}
    const amt=Number(c.amount||0), qty=Number(c.qty||0), price=Number(c.price||0);
    g.pnl+=amt;
    if(c.charge_type==='Выручка'){ g.gmv+=price*qty; g.revg+=price*qty; g.ug+=qty; g.sales+=qty; }
    else if(c.charge_type==='Возврат выручки'){ g.gmv+=price*qty; g.sales-=qty; }
  });
  const body=[];
  weeks.forEach(w=>{
    const ws=parseW(w); const wDays=[];
    for(let i=0;i<7;i++){ const d=new Date(ws); d.setDate(d.getDate()+i); wDays.push(localISO(d)); }
    day.forEach((m,pid)=>{
      let pnl=0,sales=0,gmv=0,revg=0,ug=0,cogs=0,ads=0,prov=false,any=false;
      const am=adsMap.get(pid);
      wDays.forEach(d=>{
        const g=m.get(d); if(!g)return;
        any=true;
        pnl+=g.pnl; sales+=g.sales; gmv+=g.gmv; revg+=g.revg; ug+=g.ug;
        ads+=am?(am.get(d)||0):0;
        const ci=costAt(pid,d);
        cogs+=ci.cost*g.sales;
        if(ci.prov)prov=true;
      });
      if(!any)return;
      const mar=pnl-cogs-ads, retn=gmv;
      const row=(metric,fact)=>({product_id:pid,week:w,metric,fact,cogs:Math.round(cogs*100)/100,cost_provisional:prov});
      body.push(row('sales',sales));
      body.push(row('revn',Math.round(retn*100)/100));
      body.push(row('mar',Math.round(mar*100)/100));
      body.push(row('revg',Math.round(revg*100)/100));
      body.push(row('ug',ug));
      if(ug>0)body.push(row('price',Math.round(revg/ug*100)/100));
      if(retn!==0)body.push(row('pct',Math.round(mar/retn*10000)/100));
    });
  });
  for(let i=0;i<body.length;i+=500){
    const part=body.slice(i,i+500);
    await fetch(SUPABASE_URL+'/rest/v1/sales_plan_weeks?on_conflict=product_id,week,metric',{method:'POST',headers:{...HD,'Content-Type':'application/json',Prefer:'resolution=merge-duplicates'},body:JSON.stringify(part)});
  }
}
async function fixHypotheses(){
  const today=localISO(new Date());
  for(const pid in PROTO){
    for(const it of PROTO[pid]){
      if(it.parent_id||!it.deadline)continue;
      if(it.fact_ctx!=null||it.fact_dev!=null)continue;
      const base=it.baseline_ctx?JSON.parse(it.baseline_ctx):null;
      if(!base||!('orders' in base))continue;
      const metric=it.metric||'orders';
      const created=localISO(new Date(it.created_at));
      if(metric==='orders'){
        if(today<=it.deadline)continue;
        const f=await ordersAvgWeekdays(pid,addDaysISO(created,1),it.deadline);
        if(f==null)continue;
        await fetch(SUPABASE_URL+`/rest/v1/product_protocol?id=eq.${it.id}`,{method:'PATCH',headers:{...HD,'Content-Type':'application/json',Prefer:'return=minimal'},body:JSON.stringify({fact_ctx:JSON.stringify({orders:f,orders_from:addDaysISO(created,1),orders_to:it.deadline,pct:null,pct_date:null,fix_date:today}),fact_dev:1,fact_date:today})});
      }else{
        if(today<addDaysISO(it.deadline,1))continue;
        const f=await marginAggPeriod(pid,addDaysISO(it.deadline,-2),it.deadline);
        if(f==null)continue;
        await fetch(SUPABASE_URL+`/rest/v1/product_protocol?id=eq.${it.id}`,{method:'PATCH',headers:{...HD,'Content-Type':'application/json',Prefer:'return=minimal'},body:JSON.stringify({fact_ctx:JSON.stringify({orders:null,orders_from:null,orders_to:null,pct:f.pct,pct_from:f.from,pct_to:f.to,pct_days:f.days,fix_date:today}),fact_dev:1,fact_date:today})});
      }
    }
  }
}
async function importCharges(file){
  if(!file)return;
  const btn=document.getElementById('btnUpload'); btn.disabled=true; btn.textContent='⏳ Загрузка…';
  document.getElementById('progFill').classList.remove('bad');
  try{
    setP(5,'Чтение файла…');
    const text=await file.text();
    setP(15,'Разбор строк…');
    const rows=parseCSV(text);
    const out=[]; const seen=new Set(); let skipped=0; let noEvent=0;
    for(const r of rows){
      const id=(r[0]||'').trim();
      if(!id||/период:/i.test(id)||/ID начисления/i.test(id))continue;
      const d=parseDateRu(r[1]); const offer=(r[4]||'').trim(); const type=(r[3]||'').trim(); const grp=(r[2]||'').trim();
      if(!d||!offer||!type){skipped++;continue;}
      const amt=parseMoney(r[15]);
      const qty=Number(String(r[7]||'0').replace(/[^\d-]/g,''))||0;
      const price=parseMoney(r[8]);
      const ev=parseDateRu(r[9]||'');
      if(!ev)noEvent++;
      const row_key=[id,grp,type,offer,String(r[5]||''),String(r[7]||''),String(r[9]||''),amt].join('|');
      if(seen.has(row_key))continue; seen.add(row_key);
      out.push({row_key,source_id:id,charge_date:d,event_date:ev,offer_id:offer,group_name:grp,charge_type:type,amount:amt,qty:qty,price:price});
    }
    if(!out.length){ setP(100,'В файле нет подходящих строк (все пропущены).',true); setTimeout(()=>document.getElementById('progWrap').classList.add('hide'),5000); return; }
    for(let i=0;i<out.length;i+=500){
      const part=out.slice(i,i+500);
      setP(30+Math.round((i/out.length)*60),`Запись в базу: ${Math.min(i+500,out.length)} из ${out.length}…`);
      const r=await fetch(SUPABASE_URL+'/rest/v1/ozon_charges?on_conflict=row_key',{method:'POST',headers:{...HD,'Content-Type':'application/json',Prefer:'resolution=merge-duplicates'},body:JSON.stringify(part)});
      if(!r.ok)throw new Error('HTTP '+r.status);
    }
    setP(90,'Пересчёт маржи по неделям…');
    const provW=await provisionalWeeks();
    await syncPnl(provW);
    await loadWeeks();
    TEMPS_CACHE={key:'',data:null};
    await fixHypotheses();
    await loadProto();  // обновить PROTO после фиксации
    render();
    setP(100,`✔ Готово! Импортировано начислений: ${out.length} (пропущено: ${skipped}). Строк без даты J: ${noEvent}. Маржа пересчитана.`);
    setTimeout(()=>document.getElementById('progWrap').classList.add('hide'),5000);
  }catch(e){
    setP(100,'Ошибка импорта: '+e.message,true);
  }finally{
    btn.disabled=false;btn.textContent='⬆ CSV';document.getElementById('chargesInput').value='';
  }

 let TEMPS_CACHE={key:'',data:null};
function tempsKey(){return MONTH+'|'+localISO(new Date());}
async function computeOrderTemps(){
  if(TEMPS_CACHE.key===tempsKey()&&TEMPS_CACHE.data)return TEMPS_CACHE.data;
  const today=new Date();today.setHours(0,0,0,0);
  const tISO=localISO(today);
  const yISO=addDaysISO(tISO,-1);
  if(!WEEKISO.length)return {m1:[],m2:[]};
  const periodStart=WEEKISO[0];
  const periodEnd=localISO(weekEnd(parseW(WEEKISO[WEEKISO.length-1])));
  const baseDays=[];let d=addDaysISO(tISO,-2);
  while(baseDays.length<3){if(!isWeekend(d))baseDays.unshift(d);d=addDaysISO(d,-1);}
  const fetchFrom=baseDays[0]<periodStart?baseDays[0]:periodStart;
  const byOffer=new Map();let off=0;
  while(true){
    const r=await fetch(SUPABASE_URL+`/rest/v1/product_sales?sale_date=gte.${fetchFrom}&sale_date=lte.${yISO}&select=offer_id,sale_date,qty&limit=1000&offset=${off}`,{headers:HD});
    if(!r.ok)break;
    const j=await r.json();
    j.forEach(x=>{let m=byOffer.get(x.offer_id);if(!m){m=new Map();byOffer.set(x.offer_id,m);}m.set(x.sale_date,(m.get(x.sale_date)||0)+Number(x.qty||0));});
    if(j.length<1000)break;off+=1000;
  }
  let B=0,W=0;d=tISO;
  while(d<=periodEnd){if(isWeekend(d))W++;else B++;d=addDaysISO(d,1);}
  const effRemain=B+0.7*W;
  let BT=0,WT=0;d=periodStart;
  while(d<=periodEnd){if(isWeekend(d))WT++;else BT++;d=addDaysISO(d,1);}
  const effTotal=BT+0.7*WT;
  const res={m1:[],m2:[]};
  ROWS.forEach(p=>{
    const pl=PLAN[p.product_id];
    if(!pl||!(pl.plan_qty>0))return;
    const gid=matrixOf(p.offer_id);
    const m=byOffer.get(p.offer_id);
    let sum=0;baseDays.forEach(x=>{sum+=m?(m.get(x)||0):0;});
    const avg=sum/3;
    const yest=m?(m.get(yISO)||0):0;
    let exec=0;
    if(m)m.forEach((v,k)=>{if(k>=periodStart&&k<=yISO)exec+=v;});
    const need=pl.plan_qty/0.95;
    const remain=need-exec;
    const rc=effRemain>0?remain/effRemain:0;
    const rp=effTotal>0?need/effTotal:0;
    res[gid].push({offer:p.offer_id,yest:yest,avg:avg,devAvg:yest-avg,rc:rc,devCatch:avg-rc,rp:rp,devPlan:avg-rp});
  });
  res.m1.sort((a,b)=>a.devPlan-b.devPlan);
  res.m2.sort((a,b)=>a.devPlan-b.devPlan);
  TEMPS_CACHE={key:tempsKey(),data:res};
  return res;
}

  const first=new Date(y,m-1,1);

function verdict(it){

    if(it.fact_dev==null)return null;
    const B=Number(it.baseline_dev||0),T=Number(it.target_dev||0),F=Number(it.fact_dev||0);
    if(B===T)return F>=B?'success':'fail';

  marginVals.forEach(v=>{ h+=`<td class="num" style="${marginBg(v)}">${v==null?'—':f1(v)}</td>`; });

  const drrFin=drrVals.filter(v=>v!=null&&isFinite(v));
  const dMn=drrFin.length?Math.min(...drrFin):0, dMx=drrFin.length?Math.max(...drrFin):1;
  const drrBg=v=>{ if(v==null)return ''; if(!isFinite(v))return 'background:rgba(227,61,120,.18);'; if(!drrFin.length)return ''; const t=(dMx===dMn)?0.5:(dMx-v)/(dMx-dMn); return `background:rgba(22,163,74,${(0.06+0.44*t).toFixed(2)});`; };

  if(box)box.innerHTML=h;

function arcPath(cx,cy,rO,rI,a0,a1){
  const p=(r,a)=>[cx+r*Math.cos(a),cy+r*Math.sin(a)];
  const [x0,y0]=p(rO,a0),[x1,y1]=p(rO,a1),[x2,y2]=p(rI,a1),[x3,y3]=p(rI,a0);
  const large=(a1-a0)>Math.PI?1:0;
  return `M${x0.toFixed(2)} ${y0.toFixed(2)} A${rO} ${rO} 0 ${large} 1 ${x1.toFixed(2)} ${y1.toFixed(2)} L${x2.toFixed(2)} ${y2.toFixed(2)} A${rI} ${rI} 0 ${large} 0 ${x3.toFixed(2)} ${y3.toFixed(2)} Z`;
}
function drawPie(ids,buckets,total,get,fmtTotal,cap,fmtMain,fmtSide){

  const legend=document.getElementById(ids.legend), tip=document.getElementById('tip');

  else{
    let a=-Math.PI/2;

      const ang=Math.min(v/total*Math.PI*2,Math.PI*2-0.0001);

  const showTip=(i,e)=>{ const b=buckets[i];const v=get(b);const share=total>0?(v/total*100).toLocaleString('ru-RU',{maximumFractionDigits:1}):0; tip.innerHTML=`<b>${b.label}</b>: ${share}% • ${fmtMain(b)} • ${fmtSide(b)}`; tip.style.opacity=1; moveTip(e); };

  legend.innerHTML=buckets.map((b,i)=>{ const v=get(b);const share=total>0?(v/total*100).toLocaleString('ru-RU',{maximumFractionDigits:1}):'0'; return `<div class="lrow" data-i="${i}"><span class="dot" style="background:${b.color}"></span>${b.label}<span class="lcnt">${fmtSide(b)}</span><span class="lval">${share}% • ${fmtMain(b)}</span></div>`; }).join('');
  legend.querySelectorAll('.lrow').forEach(r=>{ const i=+r.dataset.i; r.addEventListener('mouseenter',()=>hl(i,true)); r.addEventListener('mouseleave',()=>hl(i,false)); });
}
function matrixStats(list){
  const buckets=[{label:'до 5%',color:'#E33D78',rev:0,cnt:0},{label:'5–10%',color:'#d97706',rev:0,cnt:0},{label:'свыше 10%',color:'#16a34a',rev:0,cnt:0}];
  let tRub=0,tMar=0,tFRev=0,tFMar=0,tOrd=0,tOrdRev=0;
  list.forEach(p=>{
    const pl=PLAN[p.product_id]||{price:Number(p.price||0),plan_qty:0,margin_pct:0};
    const rev=pl.plan_qty*pl.price, mar=pl.plan_qty*pl.price*pl.margin_pct/100;
    tRub+=rev; tMar+=mar;
    const pvRev=projVal(p,'revn'), pvMar=projVal(p,'mar');
    if(pvRev.ffV!=null)tFRev+=pvRev.ffV;
    if(pvMar.ffV!=null)tFMar+=pvMar.ffV;
    const b=pl.margin_pct<=5?buckets[0]:(pl.margin_pct<=10?buckets[1]:buckets[2]); b.rev+=rev; b.cnt+=1;
  });
  return {buckets,tRub,tMar,tFRev,tFMar,tOrd,tOrdRev};
}
function hypStats(list){
  let active=0,success=0,fail=0;
  list.forEach(p=>{
    const items=(PROTO[p.product_id]||[]).filter(it=>it.month===MONTH&&!it.parent_id);
    items.forEach(it=>{
      if(it.fact_dev==null) active++;
      else{
        const v=verdict(it);
        if(v==='success'||v==='partial') success++;
        if(v==='fail') fail++;
      }
    });
  });
  return {active,success,fail};
}

      <div class="panelhead"><span class="paneltitle">Заказы вчера к плану</span></div>
      <div class="thermobody">
        <div class="thermo"><div class="thermofill" id="progfill_${gid}" style="height:0%"><span class="thermoemoji" id="progemoji_${gid}">💩</span></div></div>
        <div class="thermoinfo">
          <div class="progval n" id="progval_${gid}">…</div>
          <div class="progsub" id="progsub_${gid}">расчёт…</div>
        </div>
      </div>
    </div>
    <div class="panel panel-kpi">
      <div class="panelhead"><span class="paneltitle">Ключевые показатели</span></div>
      <div class="kpisrow">
        <div class="kpicol">
          <div class="kpititle">План (PNL)</div>
          <div class="kpirow"><div class="klabel">Выручка, ₽</div><div class="kval">${fmt(s.tRub)}</div></div>
          <div class="kpirow"><div class="klabel">Маржа, ₽</div><div class="kval">${fmt(s.tMar)}</div></div>
          <div class="kpirow"><div class="klabel">Маржин. ср.взвеш., %</div><div class="kval">${wMar.toLocaleString('ru-RU',{maximumFractionDigits:1})}</div></div>
        </div>
        <div class="kpicol sep">
          <div class="kpititle">Прогноз (PNL)</div>
          <div class="kpirow"><div class="klabel">Выручка, ₽</div><div class="kval">${fmt(s.tFRev)}</div></div>
          <div class="kpirow"><div class="klabel">Маржа, ₽</div><div class="kval">${fmt(s.tFMar)}</div></div>
          <div class="kpirow"><div class="klabel">Маржин. ср.взвеш., %</div><div class="kval">${wFMar.toLocaleString('ru-RU',{maximumFractionDigits:1})}</div></div>
        </div>
        <div class="kpicol sep">
          <div class="kpititle">Гипотезы</div>
          <div class="kpirow"><div class="klabel">Всего</div><div class="kval">${h.active}</div></div>
          <div class="kpirow"><div class="klabel">Успешных</div><div class="kval">${h.success}</div></div>
          <div class="kpirow"><div class="klabel">Неудачных</div><div class="kval">${h.fail}</div></div>
        </div>
      </div>
    </div>`;
  return `<div class="mxcard"><div class="mxtitle">${title} • ${list.length} поз.<span class="pmwrap"><button class="pmbtn ${ordOn?'':'on'}" onclick="setOrdMode('${gid}','summary')">Сводка</button><button class="pmbtn ${ordOn?'on':''}" onclick="setOrdMode('${gid}','orders')">Заказы</button></span></div><div class="mxbody">${body}</div></div>`;
}
function render(){
  const q=document.getElementById('q').value.toLowerCase();
  const f=ROWS.filter(r=>(r.name||'').toLowerCase().includes(q)||(r.offer_id||'').toLowerCase().includes(q));
  const m1=f.filter(r=>matrixOf(r.offer_id)==='m1');
  const m2=f.filter(r=>matrixOf(r.offer_id)==='m2');
  document.getElementById('summary').innerHTML=mxCard('1','Илья',m1,'m1')+mxCard('2','Ольга',m2,'m2');
  if(ORDMODE.m1==='orders')renderOrderTemps('m1'); else renderProgBar('m1');
  if(ORDMODE.m2==='orders')renderOrderTemps('m2'); else renderProgBar('m2');
  const m1p=m1.filter(r=>((PLAN[r.product_id]||{}).plan_qty||0)>0);
  const m2p=m2.filter(r=>((PLAN[r.product_id]||{}).plan_qty||0)>0);
  const p1=PIEMODE.m1==='plan'?pieStats(m1p,'plan'):pieStats(m1,'forecast');
  const p2=PIEMODE.m2==='plan'?pieStats(m2p,'plan'):pieStats(m2,'forecast');
  const capR1=PIEMODE.m1==='plan'?'выручка плана':'выручка прогноза';
  const capP1=PIEMODE.m1==='plan'?'позиции с планом':'позиции с прогнозом';
  const capR2=PIEMODE.m2==='plan'?'выручка плана':'выручка прогноза';
  const capP2=PIEMODE.m2==='plan'?'позиции с планом':'позиции с прогнозом';
  drawPie({svg:'pieRev1',legend:'legendRev1',val:'pcValRev1',cap:'pcCapRev1'},p1.buckets,p1.total,b=>b.rev,v=>fmtM(v)+' ₽',capR1,b=>fmtM(b.rev)+' ₽',b=>b.cnt+' поз.');
  drawPie({svg:'piePos1',legend:'legendPos1',val:'pcValPos1',cap:'pcCapPos1'},p1.buckets,p1.cnt,b=>b.cnt,v=>fmt(v)+' поз.',capP1,b=>fmt(b.cnt)+' поз.',b=>fmtM(b.rev)+' ₽');
  drawPie({svg:'pieRev2',legend:'legendRev2',val:'pcValRev2',cap:'pcCapRev2'},p2.buckets,p2.total,b=>b.rev,v=>fmtM(v)+' ₽',capR2,b=>fmtM(b.rev)+' ₽',b=>b.cnt+' поз.');
  drawPie({svg:'piePos2',legend:'legendPos2',val:'pcValPos2',cap:'pcCapPos2'},p2.buckets,p2.cnt,b=>b.cnt,v=>fmt(v)+' поз.',capP2,b=>fmt(b.cnt)+' поз.',b=>fmtM(b.rev)+' ₽');
  let totalCols=2;
  METRICS.forEach(mt=>{ const single=(mt.key==='price'||mt.key==='pct'||mt.plan===false); totalCols+=3+(EXP[mt.key]?(single?WEEKS.length:WEEKS.length*2):0); });
  let r1='<tr><th rowspan="3">Артикул</th><th rowspan="3">Дата</th>';
  let r2='', r3='';
  METRICS.forEach(mt=>{
    const exp=EXP[mt.key];
    const isPrice=(mt.key==='price'||mt.key==='pct'||mt.plan===false);
    const span=3+(exp?(isPrice?WEEKS.length:WEEKS.length*2):0);
    r1+=`<th colspan="${span}" class="mhead sep"><button class="mtoggle" onclick="toggleMetric('${mt.key}')">${exp?'▾':'▸'}</button>${mt.label}</th>`;
    r2+=`<th rowspan="2" class="sub sep">План</th><th rowspan="2" class="sub wrap2">${COLLBL[mt.key].fc}</th><th rowspan="2" class="sub wrap2">${COLLBL[mt.key].dv}</th>`;
    if(exp){ WEEKS.forEach(w=>{ r2+=`<th colspan="${isPrice?1:2}" class="whead">${wlabel(w)}</th>`; });
             WEEKS.forEach(w=>{ r3+= isPrice?`<th class="wsub">Ф</th>`:`<th class="wsub">Пр</th><th class="wsub">Ф</th>`; }); }
  });
  document.getElementById('th').innerHTML=r1+'</tr><tr>'+r2+'</tr><tr>'+r3+'</tr></tr>';
  const devOf=p=>{const d=projVal(p,'mar').dev;return d==null?0:d;};
  const prodRow=p=>{
    const pid=p.product_id;
    const wd=(PPM[pid]&&PPM[pid].work_date)||'';
    const pl=PLAN[pid]||{price:Number(p.price||0),plan_qty:0,margin_pct:0};
    const zp=(pl.plan_qty||0)===0;
    const hasActive=(PROTO[pid]||[]).some(it=>!it.parent_id&&it.deadline&&it.deadline>=localISO(new Date())&&it.fact_dev==null);
    const dateLocked=hasActive;
    let h=`<tr${zp?' class="zeroplan"':''}>
      <td class="num okey" title="${esc(p.name)} — открыть протокол" onclick="toggleProto(${pid})">${esc(p.offer_id)}</td>`;
    if(dateLocked){
      h+=`<td><span class="datelocked" title="дата зафиксирована гипотезой">${wd?ddmm(wd):'—'}</span></td>`;
    }else{
      h+=`<td><span class="dateshort" title="Дата работы" onclick="openDate(${pid})">${wd?ddmm(wd):'—'}</span><input type="date" class="datehidden" id="dt_${pid}" value="${wd}" onchange="setWorkDate(${pid},this.value)"></td>`;
    }
    METRICS.forEach(mt=>{
      const planV=monthlyPlan(p,mt.key);
      let ffV=null, dev=null;
      if(mt.key==='price'){ const ap=avgPriceFact(p); ffV=ap; dev=ap==null?null:ap-planV; }
      else if(mt.key==='pct'){ const ap=avgPctFact(p); ffV=ap; dev=ap==null?null:ap-planV; }
      else { const pv=projVal(p,mt.key); ffV=pv.ffV; dev=pv.dev; }
      const dcls=dev==null?'n':(dev>0?'g':dev<0?'r':'n');
      const editKey=mt.edit;
      h+=`<td class="num sep ${editKey?'editable':''}" ${editKey?`title="Изменить план" onclick="editField(${pid},'${editKey}')"`:''}>${planV==null?'—':fmtFor(mt.key,planV)}</td>`;
      h+=`<td class="num calc">${ffV==null?'—':fmtFor(mt.key,ffV)}</td>`;
      h+=`<td class="num ${dcls}">${dev==null?'—':(dev>0?'+':'')+fmtFor(mt.key,dev)}</td>`;
      if(EXP[mt.key]){
        if(mt.key==='price'){
          WEEKISO.forEach((w,i)=>{ const pf=priceFactForWeek(pid,w); h+=`<td class="num wcell factcell" title="Факт цены (PNL)">${pf==null?'—':fmt2(pf)}</td>`; });
        }else if(mt.key==='pct'){
          WEEKISO.forEach((w,i)=>{ const pf=pctFactForWeek(pid,w); h+=`<td class="num wcell factcell" title="Факт маржин. (PNL)">${pf==null?'—':fmt2(pf)}</td>`; });
        }else if(mt.plan===false){
          WEEKISO.forEach((w,i)=>{ const r=getRec(pid,WDKEY[mt.key],w); h+=`<td class="num wcell factcell" title="Факт (заказы)">${r.fact==null?'—':wfmt(mt.key,r.fact)}</td>`; });
        }else{
          const series=seriesFor(p,mt.key);
          WEEKISO.forEach((w,i)=>{
            const rec=getRec(pid,WDKEY[mt.key],w);
            const s=series[i];
            if(s.locked){ h+=`<td class="num wcell calc" title="Расчёт (факт+динамика)">${wfmt(mt.key,s.forecast)}</td>`; }
            else{
              const rst=s.manual?`<span class="resetbtn" title="Вернуть расчётное" onclick="resetWeek(event,${pid},'${w}','${WDKEY[mt.key]}')">↺</span>`:'';
              h+=`<td class="num wcell wedit ${s.manual?'':'autocell'}" title="Прогноз" onclick="editWeek(${pid},'${w}','${WDKEY[mt.key]}')">${wfmt(mt.key,s.forecast)}<span class="editbtn">✎</span>${rst}</td>`;
            }
            h+=`<td class="num wcell factcell" title="Факт">${rec.fact==null?'—':wfmt(mt.key,rec.fact)}</td>`;
          });
        }
      }
    });
    h+=`</tr>`;
    if(openProto.has(pid)){
      h+=`<tr class="protorow"><td colspan="${totalCols}"><div class="protowrap">${protoBlock(pid,p.offer_id)}</div></td></tr>`;
    }
    return h;
  };
  let html='';
  const groups=[['m1','Илья',m1],['m2','Ольга',m2]];
  groups.forEach(([gid,gname,list])=>{
    html+=`<tr class="mgroup"><td colspan="${totalCols}"><button onclick="toggleGM('${gid}')">${GM[gid]?'▾':'▸'}</button>${gname} • ${list.length} поз.</td></tr>`;
    if(!GM[gid])return;
    const hasDate=list.some(p=>(PPM[p.product_id]&&PPM[p.product_id].work_date));
    if(hasDate){
      const byDate=new Map();
      list.forEach(p=>{ const d=(PPM[p.product_id]&&PPM[p.product_id].work_date)||null; if(!byDate.has(d))byDate.set(d,[]); byDate.get(d).push(p); });
      const dates=[...byDate.keys()].filter(x=>x).sort();
      dates.forEach(d=>{
        html+=`<tr class="dgroup"><td colspan="${totalCols}">${dateHead(d)}</td></tr>`;
        html+=byDate.get(d).sort((a,b)=>devOf(a)-devOf(b)).map(prodRow).join('');
      });
      if(byDate.has(null)){
        html+=`<tr class="dgroup"><td colspan="${totalCols}">Без даты</td></tr>`;
        html+=byDate.get(null).sort((a,b)=>devOf(a)-devOf(b)).map(prodRow).join('');
      }
    }else{
      html+=[...list].sort((a,b)=>devOf(a)-devOf(b)).map(prodRow).join('');
    }
  });
  document.getElementById('tb').innerHTML=html||`<tr><td colspan="${totalCols}" style="color:#94a3b8">нет данных</td></tr>`;
  openProto.forEach(pid=>{loadSmartBase(pid);});
}
</script>
</body>
</html>
