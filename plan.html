<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Beauty Art — План продаж</title>
<link href="https://fonts.googleapis.com/css2?family=Forum&display=swap" rel="stylesheet">
<style>
 body{font-family:'Forum',-apple-system,sans-serif;background:linear-gradient(135deg,#78A6C7,#E33D78,#7D3673);min-height:100vh;padding:20px;margin:0}
 .login,.wrap{max-width:1500px;margin:40px auto;background:#fff;border-radius:16px;padding:30px;box-shadow:0 10px 30px rgba(28,13,46,.3)}
 h2{font-family:'Forum';color:#1C0D2E}
 input,textarea,select{padding:6px 8px;border:2px solid rgba(84,66,115,.2);border-radius:8px;font-family:'Forum';font-size:.9em}
 button{padding:6px 10px;border:none;border-radius:8px;background:linear-gradient(90deg,#78A6C7,#E33D78);color:#fff;font-family:'Forum';cursor:pointer}
 .tablewrap{overflow-x:auto;-webkit-overflow-scrolling:touch}
 table{width:100%;border-collapse:collapse;font-size:.78em;min-width:900px}
 th,td{padding:5px 7px;border-bottom:1px dashed #cbd5e1;text-align:left;vertical-align:middle}
 th{color:#666;white-space:nowrap}
 th.wrap2{white-space:normal;line-height:1.15}
 .hide{display:none}
 .meta{color:#94a3b8;font-size:.85em;margin:6px 0}
 .err{color:#E33D78;font-size:.9em;margin:8px 0}
 .num{font-weight:700;color:#1C0D2E;white-space:nowrap}
 .calc{color:#544273}
 .g{color:#16a34a}.r{color:#E33D78}.n{color:#94a3b8}
 .factcell{color:#94a3b8}
 .autocell{color:#544273}
 .editable{cursor:pointer;white-space:nowrap}
 .editable::after{content:" ✎";opacity:.3;font-size:.8em}
 .editable:hover{color:#E33D78}
 .editable:hover::after{opacity:1}
 tr.zeroplan td{background:rgba(227,61,120,.12)}
 .dateinp{padding:2px 4px;border:1px solid rgba(84,66,115,.25);border-radius:6px;font-size:.85em;color:#544273;background:#fff;width:120px}
 td.pname{cursor:pointer}
 td.pname:hover{color:#E33D78}
 tr.dgroup td{background:rgba(120,166,199,.14);font-weight:700;color:#33506b;padding-top:10px}
 tr.protorow td{background:#f8f9fb;padding:10px}
 .protohead{font-size:.85em;color:#94a3b8;margin-bottom:6px;font-weight:700}
 .pitem{border:1px solid rgba(84,66,115,.15);border-radius:8px;background:#fff;padding:7px 10px;margin:0 0 6px}
 .pitem .pdate{color:#94a3b8;margin-right:8px}
 .pmetrics i{font-style:normal;background:rgba(120,166,199,.2);border-radius:5px;padding:1px 6px;margin-right:4px;color:#33506b;font-size:.85em}
 .paction{color:#1C0D2E}
 .psub{font-size:.85em;color:#544273;margin-top:4px}
 .psub button{padding:2px 8px;font-size:.85em;margin-right:4px}
 .badge{border-radius:5px;padding:1px 7px;font-size:.85em;font-weight:700}
 .badge.g{background:rgba(22,163,74,.15);color:#16a34a}
 .badge.r{background:rgba(227,61,120,.15);color:#E33D78}
 .badge.n{background:rgba(148,163,184,.2);color:#64748b}
 .pform{border:1px dashed rgba(84,66,115,.3);border-radius:8px;padding:8px 10px;margin-top:6px;background:#fff}
 .pfrow{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:6px}
 .chk{display:flex;gap:4px;align-items:center;font-size:.85em;color:#544273}
 .tgin{display:flex;gap:4px;align-items:center;font-size:.8em;color:#94a3b8}
 .tgin input{width:70px;padding:3px 5px}
 .pform input[type=text]{flex:1;min-width:200px}
 .toolbar{display:flex;gap:10px;align-items:center;margin-bottom:8px;flex-wrap:wrap}
 .toolbar input[type=text]{flex:1;min-width:180px}
 th.mhead{background:linear-gradient(90deg,rgba(120,166,199,.18),transparent);color:#544273;font-size:.95em}
 th.sub{background:rgba(120,166,199,.1)}
 th.whead{background:rgba(227,61,120,.08);color:#7D3673}
 th.wsub{background:rgba(227,61,120,.05);font-size:.75em}
 .mtoggle{padding:0 5px;margin-right:4px;background:none;border:1px solid rgba(84,66,115,.3);border-radius:5px;color:#544273;cursor:pointer;font-size:.8em}
 td.wcell{background:rgba(227,61,120,.03)}
 tr.mgroup td{background:linear-gradient(90deg,rgba(125,54,115,.18),transparent);font-weight:700;color:#7D3673;padding-top:12px;border-bottom:2px solid rgba(125,54,115,.25)}
 tr.mgroup button{background:none;border:1px solid rgba(125,54,115,.4);border-radius:5px;color:#7D3673;cursor:pointer;padding:0 6px;margin-right:6px}
 .mxcard{border:2px solid rgba(84,66,115,.12);border-radius:12px;background:#fff;padding:12px 14px;margin:0 0 14px}
 .mxtitle{font-family:'Forum';font-weight:700;color:#544273;font-size:1em;margin-bottom:8px}
 .mxbody{display:flex;gap:20px;align-items:center;flex-wrap:wrap}
 .piecard{display:flex;flex-direction:column}
 .ptitle{font-size:.82em;color:#544273;font-weight:700;margin-bottom:5px}
 .piebox{display:flex;gap:12px;align-items:center}
 .pieWrap{position:relative;width:140px;height:140px;flex:0 0 auto}
 svg.pie{width:100%;height:100%;display:block;animation:piein .5s ease}
 @keyframes piein{from{opacity:0;transform:scale(.9) rotate(-15deg)}to{opacity:1;transform:none}}
 .seg{cursor:pointer;transition:transform .18s ease,opacity .18s ease;transform-origin:110px 110px}
 .seg:hover,.seg.hl{transform:scale(1.06)}
 svg.dim .seg:not(:hover):not(.hl){opacity:.4}
 .pieCenter{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;pointer-events:none;text-align:center;padding:0 22px}
 .pcVal{font-size:.95em;font-weight:700;color:#1C0D2E;line-height:1.1}
 .pcCap{font-size:.66em;color:#94a3b8;margin-top:2px}
 .tip{position:fixed;z-index:50;background:#1C0D2E;color:#fff;border-radius:8px;padding:6px 10px;font-size:.78em;pointer-events:none;opacity:0;transition:opacity .12s;white-space:nowrap;box-shadow:0 4px 14px rgba(28,13,46,.4)}
 .legend{font-size:.78em;color:#544273}
 .lrow{display:flex;align-items:center;gap:8px;margin:4px 0;white-space:nowrap;cursor:pointer;padding:3px 6px;border-radius:6px;transition:background .15s}
 .lrow:hover,.lrow.hl{background:rgba(120,166,199,.18)}
 .dot{width:12px;height:12px;border-radius:3px;display:inline-block;flex:0 0 auto}
 .lval{margin-left:auto;font-weight:700;color:#1C0D2E}
 .lcnt{color:#94a3b8;font-size:.9em}
 .kpiswrap{display:flex;gap:14px;margin-left:auto;flex-wrap:wrap}
 .kpis{display:flex;flex-direction:column;gap:6px}
 .kgroup{font-size:.75em;color:#94a3b8;font-weight:700;margin-bottom:2px}
 .kpi{background:#f8f9fb;border:1px solid rgba(84,66,115,.12);border-radius:10px;padding:6px 14px;min-width:170px}
 .klabel{font-size:.72em;color:#94a3b8}
 .kval{font-size:1em;font-weight:700;color:#1C0D2E;white-space:nowrap}
 @media (max-width:640px){
   body{padding:8px}
   .login,.wrap{padding:16px;margin:16px auto;border-radius:12px}
   h2{font-size:1.15em}
   .toolbar{flex-direction:column;align-items:stretch}
   button{padding:10px 14px;font-size:1em}
   table{font-size:.72em;min-width:800px}
   th,td{padding:4px 5px}
   .meta{font-size:.78em}
 }
</style></head>
<body>
<div class="login" id="login">
  <h2>Закрытый раздел</h2>
  <input type="password" id="pwd" placeholder="Пароль" onkeypress="if(event.key==='Enter')go()">
  <button onclick="go()">Войти</button>
</div>
<div class="wrap hide" id="app">
  <h2>📊 План продаж</h2>
  <div class="meta" id="meta">загрузка…</div>
  <div class="err" id="err"></div>
  <div class="toolbar">
    <input type="text" id="q" placeholder="Поиск по названию / артикулу" oninput="render()">
    <input type="month" id="month" onchange="onMonth(this.value)">
    <button onclick="load()">⟳ Обновить</button>
  </div>
  <div id="summary"></div>
  <div class="tablewrap">
    <table>
      <thead id="th"></thead>
      <tbody id="tb"></tbody>
    </table>
  </div>
  <div class="tip" id="tip"></div>
</div>
<script>
const PASSWORD_HASH='8c6976e5b5410415bde908bd4dee15dfb167a9c873fc4bb8a81f6f2ab448a918';
const SUPABASE_URL='https://jvoofakrkhzoblhhuyvr.supabase.co';
const ANON='sb_publishable_IA4ReUU9xTL7hb_sbsHaFA_LPATJazE';
const HD={apikey:ANON,Authorization:'Bearer '+ANON};
let ROWS=[],PLAN={},BYID={},WD={},WEEKS=[],WEEKISO=[],PPM={},PROTO={};
let EXP={qty:false,rev:false,mar:false,price:false,pct:false};
let GM={m1:false,m2:false};
let openProto=new Set();
const DWN=['Вс','Пн','Вт','Ср','Чт','Пт','Сб'];
const MLBL={qty:'Продажи',rev:'Выручка',mar:'Маржа',price:'Цена',pct:'Марж.%'};
const METRICS=[
  {key:'qty',label:'Продажи, шт',add:true,edit:'plan_qty'},
  {key:'rev',label:'Выручка, ₽',add:true},
  {key:'mar',label:'Маржа, ₽',add:true},
  {key:'price',label:'Цена, ₽',add:false,edit:'price'},
  {key:'pct',label:'Маржин., %',add:false,edit:'margin_pct'}
];
const now0=new Date();
let MONTH=now0.getFullYear()+'-'+String(now0.getMonth()+1).padStart(2,'0');
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
const pad=n=>String(n).padStart(2,'0');
const esc=s=>(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt=n=>Number(n||0).toLocaleString('ru-RU',{maximumFractionDigits:0});
const fmt2=n=>Number(n||0).toLocaleString('ru-RU',{maximumFractionDigits:2});
const fmtM=n=>n>=1e6?(n/1e6).toLocaleString('ru-RU',{maximumFractionDigits:2})+' млн':fmt(n);
const fmtFor=(k,v)=>(k==='price'||k==='pct')?fmt2(v):fmt(v);
const localISO=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
function matrixOf(offer){ return (/^(CAP|GLV|SEAL)-/.test(offer))?'m1':'m2'; }
function isoWeeksOfMonth(y,m){
  const out=[]; let d=new Date(y,m,1);
  d.setDate(d.getDate()-((d.getDay()+6)%7));
  for(let i=0;i<6;i++){ const thu=new Date(d); thu.setDate(thu.getDate()+3);
    if(thu.getFullYear()===y&&thu.getMonth()===m) out.push(new Date(d));
    d.setDate(d.getDate()+7); }
  return out;
}
const wlabel=w=>{const e=new Date(w);e.setDate(e.getDate()+6);return `${w.getDate()}.${w.getMonth()+1}–${e.getDate()}.${e.getMonth()+1}`;};
const weekEnd=w=>{const e=new Date(w);e.setDate(e.getDate()+6);return e;};
function parseW(s){const [y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d);}
function fmtDateISO(iso){const [y,m,d]=iso.split('-');return `${d}.${m}`;}
function dateHead(iso){const d=parseW(iso);return `${DWN[d.getDay()]}, ${fmtDateISO(iso)}`;}
async function go(){
  const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(document.getElementById('pwd').value));
  const h=[...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('');
  if(h!==PASSWORD_HASH){alert('Неверный пароль');return;}
  document.getElementById('login').classList.add('hide');
  document.getElementById('app').classList.remove('hide');
  document.getElementById('month').value=MONTH;
  load();
}
async function loadPlans(){
  const r=await fetch(SUPABASE_URL+`/rest/v1/sales_plan?month=eq.${MONTH}&select=product_id,price,plan_qty,margin_pct`,{headers:HD});
  if(!r.ok)throw new Error('HTTP '+r.status);
  PLAN={}; (await r.json()).forEach(x=>PLAN[x.product_id]={price:Number(x.price||0),plan_qty:Number(x.plan_qty||0),margin_pct:Number(x.margin_pct||0)});
}
async function loadWeeks(){
  if(!WEEKISO.length){WD={};return;}
  const inList='('+WEEKISO.map(w=>`"${w}"`).join(',')+')';
  const r=await fetch(SUPABASE_URL+`/rest/v1/sales_plan_weeks?week=in.${inList}&select=product_id,week,metric,plan,forecast,fact`,{headers:HD});
  if(!r.ok)throw new Error('HTTP '+r.status);
  WD={};
  (await r.json()).forEach(x=>{ ((WD[x.product_id]=WD[x.product_id]||{})[x.metric]=WD[x.product_id][x.metric]||{})[x.week]={plan:Number(x.plan||0),forecast:x.forecast==null?null:Number(x.forecast),fact:x.fact==null?null:Number(x.fact)}; });
}
async function loadPPM(){
  const r=await fetch(SUPABASE_URL+`/rest/v1/product_plan_meta?month=eq.${MONTH}&select=product_id,weekday,protocol,work_date`,{headers:HD});
  if(!r.ok)throw new Error('HTTP '+r.status);
  PPM={}; (await r.json()).forEach(x=>PPM[x.product_id]={weekday:x.weekday,protocol:x.protocol,work_date:x.work_date});
}
async function loadProto(){
  const r=await fetch(SUPABASE_URL+`/rest/v1/product_protocol?month=eq.${MONTH}&select=*&order=created_at.asc`,{headers:HD});
  if(!r.ok)throw new Error('HTTP '+r.status);
  PROTO={};
  (await r.json()).forEach(x=>{(PROTO[x.product_id]=PROTO[x.product_id]||[]).push(x);});
}
async function load(){
  const err=document.getElementById('err'); err.textContent='';
  for(let a=1;a<=3;a++){
    try{
      const [y,m]=MONTH.split('-').map(Number);
      WEEKS=isoWeeksOfMonth(y,m-1); WEEKISO=WEEKS.map(localISO);
      const rp=await fetch(SUPABASE_URL+'/rest/v1/products?select=product_id,offer_id,name,price,archived&order=name.asc&limit=1000',{headers:HD});
      if(!rp.ok)throw new Error('HTTP '+rp.status);
      ROWS=(await rp.json()).filter(x=>!x.archived);
      BYID={}; ROWS.forEach(p=>BYID[p.product_id]=p);
      await Promise.all([loadPlans(),loadWeeks(),loadPPM(),loadProto()]);
      document.getElementById('meta').textContent=`Позиций: ${ROWS.length} • месяц: ${MONTH} • недель: ${WEEKS.length}`;
      render(); return;
    }catch(e){ if(a<3){await sleep(800*a);continue;} err.textContent='Ошибка загрузки: '+e.message; }
  }
}
async function onMonth(v){ if(!v)return; MONTH=v; const err=document.getElementById('err'); err.textContent='';
  try{ const [y,m]=MONTH.split('-').map(Number); WEEKS=isoWeeksOfMonth(y,m-1); WEEKISO=WEEKS.map(localISO); await Promise.all([loadPlans(),loadWeeks(),loadPPM(),loadProto()]); render(); }catch(e){ err.textContent='Ошибка: '+e.message; }
}
function toggleMetric(k){ EXP[k]=!EXP[k]; render(); }
function toggleGM(k){ GM[k]=!GM[k]; render(); }
function toggleProto(pid){ if(openProto.has(pid))openProto.delete(pid); else openProto.add(pid); render(); }
async function upsertPPM(pid,patch){
  const cur=PPM[pid]||{weekday:null,protocol:null,work_date:null};
  const next=Object.assign({},cur,patch);
  PPM[pid]=next;
  await fetch(SUPABASE_URL+'/rest/v1/product_plan_meta?on_conflict=product_id,month',{method:'POST',headers:{...HD,'Content-Type':'application/json',Prefer:'resolution=merge-duplicates'},body:JSON.stringify({product_id:pid,month:MONTH,weekday:next.weekday,protocol:next.protocol,work_date:next.work_date})});
}
async function setWorkDate(pid,val){ await upsertPPM(pid,{work_date:val||null}); render(); }
async function editField(pid,field){
  const p=BYID[pid]; if(!p)return;
  const pl=PLAN[pid]||{price:Number(p.price||0),plan_qty:0,margin_pct:0};
  const labels={price:'Цена продажи, ₽',plan_qty:'План, шт',margin_pct:'План маржинальность, %'};
  const val=prompt(labels[field]+':', pl[field]);
  if(val==null)return;
  const num=Number(String(val).replace(',','.'));
  if(!isFinite(num)||num<0){alert('Некорректное значение');return;}
  pl[field]=num; PLAN[pid]=pl;
  const r=await fetch(SUPABASE_URL+'/rest/v1/sales_plan?on_conflict=month,product_id',{method:'POST',headers:{...HD,'Content-Type':'application/json',Prefer:'resolution=merge-duplicates'},body:JSON.stringify({month:MONTH,product_id:pid,price:pl.price,plan_qty:pl.plan_qty,margin_pct:pl.margin_pct})});
  if(!r.ok){alert('Ошибка сохранения: HTTP '+r.status);return;}
  render();
}
async function editWeek(pid,week,metric){
  const rec=(WD[pid]&&WD[pid][metric]&&WD[pid][metric][week])?WD[pid][metric][week]:{forecast:null};
  const val=prompt(`Прогноз на ${week} (пусто = авторасчёт):`, rec.forecast==null?'':rec.forecast);
  if(val==null)return;
  let payload;
  if(String(val).trim()===''){ payload={forecast:null}; }
  else{ const num=Number(String(val).replace(',','.')); if(!isFinite(num)||num<0){alert('Некорректное значение');return;} payload={forecast:num}; }
  const r=await fetch(SUPABASE_URL+'/rest/v1/sales_plan_weeks?on_conflict=product_id,week,metric',{method:'POST',headers:{...HD,'Content-Type':'application/json',Prefer:'resolution=merge-duplicates'},body:JSON.stringify(Object.assign({product_id:pid,week,metric},payload))});
  if(!r.ok){alert('Ошибка сохранения: HTTP '+r.status);return;}
  ((WD[pid]=WD[pid]||{})[metric]=WD[pid][metric]||{})[week]=Object.assign(rec,payload);
  render();
}
async function addProto(pid){
  const mkeys=METRICS.map(m=>m.key).filter(k=>{const el=document.getElementById(`pm_${pid}_${k}`);return el&&el.checked;});
  if(!mkeys.length){alert('Выберите хотя бы одну метрику');return;}
  const action=(document.getElementById(`pa_${pid}`).value||'').trim();
  if(!action){alert('Опишите действие');return;}
  const targets={};
  for(const k of mkeys){
    const el=document.getElementById(`pt_${pid}_${k}`);
    const v=Number((el.value||'').replace(',','.'));
    if(!isFinite(v)){alert(`Укажите прогноз для «${MLBL[k]}»`);return;}
    targets[k]=v;
  }
  const week=document.getElementById(`pw_${pid}`).value;
  if(!week){alert('Выберите срок (неделю)');return;}
  const r=await fetch(SUPABASE_URL+'/rest/v1/product_protocol',{method:'POST',headers:{...HD,'Content-Type':'application/json',Prefer:'return=minimal'},body:JSON.stringify([{product_id:pid,month:MONTH,metrics:mkeys.join(','),action,targets:JSON.stringify(targets),week}])});
  if(!r.ok){alert('Ошибка сохранения: HTTP '+r.status);return;}
  await loadProto(); render();
}
function weekFact(pid,key,week){ const rec=(WD[pid]&&WD[pid][key]&&WD[pid][key][week])?WD[pid][key][week]:{fact:null}; return rec.fact; }
async function evalProto(id,field,value){
  let item=null;
  for(const k in PROTO){ const f=PROTO[k].find(x=>x.id===id); if(f){item=f;break;} }
  if(!item)return;
  let facts=item.facts?JSON.parse(item.facts):null;
  if(!facts){ facts={}; item.metrics.split(',').forEach(k=>{facts[k]=weekFact(item.product_id,k,item.week);}); }
  item[field]=value; item.facts=JSON.stringify(facts); item.evaluated_at=new Date().toISOString();
  const body={done:item.done,trend:item.trend,facts:item.facts,evaluated_at:item.evaluated_at};
  const r=await fetch(SUPABASE_URL+`/rest/v1/product_protocol?id=eq.${id}`,{method:'PATCH',headers:{...HD,'Content-Type':'application/json',Prefer:'return=minimal'},body:JSON.stringify(body)});
  if(!r.ok){alert('Ошибка сохранения: HTTP '+r.status);return;}
  render();
}
function getRec(pid,key,w){ return (WD[pid]&&WD[pid][key]&&WD[pid][key][w])?WD[pid][key][w]:{plan:0,forecast:null,fact:null}; }
function monthlyPlan(p,key){
  const pl=PLAN[p.product_id]||{price:Number(p.price||0),plan_qty:0,margin_pct:0};
  if(key==='qty')return pl.plan_qty;
  if(key==='rev')return pl.plan_qty*pl.price;
  if(key==='mar')return pl.plan_qty*pl.price*pl.margin_pct/100;
  if(key==='price')return pl.price;
  return pl.margin_pct;
}
function seriesFor(p,key){
  const P=monthlyPlan(p,key);
  const today=new Date(); today.setHours(0,0,0,0);
  const recs=WEEKISO.map(w=>getRec(p.product_id,key,w));
  const past=WEEKISO.map(w=>weekEnd(parseW(w))<today);
  let fixedSum=0;
  const kind=WEEKISO.map((w,i)=>{
    if(past[i]&&recs[i].fact!=null){ fixedSum+=recs[i].fact; return 'fact'; }
    if(recs[i].forecast!=null){ fixedSum+=recs[i].forecast; return 'manual'; }
    return null;
  });
  const free=kind.filter(x=>!x).length;
  const share=free>0?(P-fixedSum)/free:0;
  return WEEKISO.map((w,i)=>({
    past:past[i], fact:recs[i].fact, manual:kind[i]==='manual',
    forecast: kind[i]==='fact'?recs[i].fact : kind[i]==='manual'?recs[i].forecast : share
  }));
}
function collVal(p,key){
  const mt=METRICS.find(m=>m.key===key);
  if(mt.add) return seriesFor(p,key).reduce((a,x)=>a+x.forecast,0);
  const cur=(()=>{ const t=new Date();t.setHours(0,0,0,0);
    for(let i=0;i<WEEKS.length;i++){ if(t>=WEEKS[i]&&t<=weekEnd(WEEKS[i])) return WEEKISO[i]; } return null; })();
  if(cur){ const rec=getRec(p.product_id,key,cur);
    const today=new Date(); today.setHours(0,0,0,0);
    const v=(weekEnd(parseW(cur))<today&&rec.fact!=null)?rec.fact:(rec.forecast!=null?rec.forecast:null);
    if(v!=null) return v; }
  return monthlyPlan(p,key);
}
function forecastClose(p,key){
  const mt=METRICS.find(m=>m.key===key);
  const series=seriesFor(p,key);
  let lastFact=null; series.forEach(s=>{ if(s.fact!=null) lastFact=s.fact; });
  if(!mt.add){ return lastFact!=null?lastFact:collVal(p,key); }
  if(lastFact==null){ return series.reduce((a,s)=>a+s.forecast,0); }
  let sumFact=0,noFact=0;
  series.forEach(s=>{ if(s.fact!=null) sumFact+=s.fact; else noFact++; });
  return sumFact + lastFact*noFact;
}
function devFor(p,key){ return forecastClose(p,key)-monthlyPlan(p,key); }
function arcPath(cx,cy,rO,rI,a0,a1){
  const p=(r,a)=>[cx+r*Math.cos(a),cy+r*Math.sin(a)];
  const [x0,y0]=p(rO,a0),[x1,y1]=p(rO,a1),[x2,y2]=p(rI,a1),[x3,y3]=p(rI,a0);
  const large=(a1-a0)>Math.PI?1:0;
  return `M${x0.toFixed(2)} ${y0.toFixed(2)} A${rO} ${rO} 0 ${large} 1 ${x1.toFixed(2)} ${y1.toFixed(2)} L${x2.toFixed(2)} ${y2.toFixed(2)} A${rI} ${rI} 0 ${large} 0 ${x3.toFixed(2)} ${y3.toFixed(2)} Z`;
}
function drawPie(ids,buckets,total,get,fmtTotal,cap,fmtMain,fmtSide){
  const svg=document.getElementById(ids.svg);
  const pcVal=document.getElementById(ids.val), pcCap=document.getElementById(ids.cap);
  const legend=document.getElementById(ids.legend), tip=document.getElementById('tip');
  if(!svg)return;
  const CX=110,CY=110,RO=100,RI=62,PAD=0.02;
  let html='';
  if(total<=0){ html=`<circle cx="${CX}" cy="${CY}" r="${(RO+RI)/2}" fill="none" stroke="#e2e8f0" stroke-width="${RO-RI}"/>`; }
  else{
    let a=-Math.PI/2;
    buckets.forEach((b,i)=>{ const v=get(b); if(v<=0)return;
      const ang=Math.min(v/total*Math.PI*2,Math.PI*2-0.0001);
      const a0=a+PAD/2,a1=a+ang-PAD/2;
      if(a1>a0) html+=`<path class="seg" data-i="${i}" d="${arcPath(CX,CY,RO,RI,a0,a1)}" fill="${b.color}"/>`;
      a+=ang; });
  }
  svg.innerHTML=html;
  const setCenter=i=>{ if(i==null){pcVal.textContent=fmtTotal(total);pcCap.textContent=cap;} else{const b=buckets[i];const share=total>0?Math.round(get(b)/total*100):0;pcVal.textContent=share+'%';pcCap.textContent=b.label+' • '+b.cnt+' поз.';} };
  setCenter(null);
  const paths=[...svg.querySelectorAll('.seg')];
  const hl=(i,on)=>{ svg.classList.toggle('dim',on); paths.forEach(p=>p.classList.toggle('hl',on&&+p.dataset.i===i)); legend.querySelectorAll('.lrow').forEach(r=>r.classList.toggle('hl',on&&+r.dataset.i===i)); setCenter(on?i:null); };
  const showTip=(i,e)=>{ const b=buckets[i];const v=get(b);const share=total>0?(v/total*100).toLocaleString('ru-RU',{maximumFractionDigits:1}):0; tip.innerHTML=`<b>${b.label}</b>: ${share}% • ${fmtMain(b)} • ${fmtSide(b)}`; tip.style.opacity=1; moveTip(e); };
  const moveTip=e=>{ tip.style.left=(e.clientX+14)+'px'; tip.style.top=(e.clientY+14)+'px'; };
  const hideTip=()=>{ tip.style.opacity=0; };
  paths.forEach(p=>{ const i=+p.dataset.i; p.addEventListener('mouseenter',e=>{hl(i,true);showTip(i,e);}); p.addEventListener('mousemove',moveTip); p.addEventListener('mouseleave',()=>{hl(i,false);hideTip();}); });
  legend.innerHTML=buckets.map((b,i)=>{ const v=get(b);const share=total>0?(v/total*100).toLocaleString('ru-RU',{maximumFractionDigits:1}):'0'; return `<div class="lrow" data-i="${i}"><span class="dot" style="background:${b.color}"></span>${b.label}<span class="lcnt">${fmtSide(b)}</span><span class="lval">${share}% • ${fmtMain(b)}</span></div>`; }).join('');
  legend.querySelectorAll('.lrow').forEach(r=>{ const i=+r.dataset.i; r.addEventListener('mouseenter',()=>hl(i,true)); r.addEventListener('mouseleave',()=>hl(i,false)); });
}
function matrixStats(list){
  const buckets=[{label:'до 5%',color:'#E33D78',rev:0,cnt:0},{label:'5–10%',color:'#d97706',rev:0,cnt:0},{label:'свыше 10%',color:'#16a34a',rev:0,cnt:0}];
  let tRub=0,tMar=0,tFRev=0,tFMar=0;
  list.forEach(p=>{ const pl=PLAN[p.product_id]||{price:Number(p.price||0),plan_qty:0,margin_pct:0};
    const rev=pl.plan_qty*pl.price, mar=rev*pl.margin_pct/100; tRub+=rev; tMar+=mar;
    tFRev+=forecastClose(p,'rev'); tFMar+=forecastClose(p,'mar');
    const b=pl.margin_pct<=5?buckets[0]:(pl.margin_pct<=10?buckets[1]:buckets[2]); b.rev+=rev; b.cnt+=1; });
  return {buckets,tRub,tMar,tFRev,tFMar};
}
function mxCard(id,title,list){
  const s=matrixStats(list);
  const wMar=s.tRub>0?s.tMar/s.tRub*100:0;
  const wFMar=s.tFRev>0?s.tFMar/s.tFRev*100:0;
  return `<div class="mxcard"><div class="mxtitle">${title} • ${list.length} поз.</div><div class="mxbody">
    <div class="piecard"><div class="ptitle">Выручка по маржинальности</div><div class="piebox">
      <div class="pieWrap"><svg class="pie" id="pieRev${id}" viewBox="0 0 220 220"></svg><div class="pieCenter"><div class="pcVal" id="pcValRev${id}"></div><div class="pcCap" id="pcCapRev${id}"></div></div></div>
      <div class="legend" id="legendRev${id}"></div></div></div>
    <div class="piecard"><div class="ptitle">Позиции по маржинальности</div><div class="piebox">
      <div class="pieWrap"><svg class="pie" id="piePos${id}" viewBox="0 0 220 220"></svg><div class="pieCenter"><div class="pcVal" id="pcValPos${id}"></div><div class="pcCap" id="pcCapPos${id}"></div></div></div>
      <div class="legend" id="legendPos${id}"></div></div></div>
    <div class="kpiswrap">
      <div class="kpis"><div class="kgroup">План</div>
        <div class="kpi"><div class="klabel">Выручка, ₽</div><div class="kval">${fmt(s.tRub)}</div></div>
        <div class="kpi"><div class="klabel">Маржа, ₽</div><div class="kval">${fmt(s.tMar)}</div></div>
        <div class="kpi"><div class="klabel">Маржин. средневзвеш., %</div><div class="kval">${wMar.toLocaleString('ru-RU',{maximumFractionDigits:1})}</div></div>
      </div>
      <div class="kpis"><div class="kgroup">Прогноз в динамике</div>
        <div class="kpi"><div class="klabel">Выручка, ₽</div><div class="kval">${fmt(s.tFRev)}</div></div>
        <div class="kpi"><div class="klabel">Маржа, ₽</div><div class="kval">${fmt(s.tFMar)}</div></div>
        <div class="kpi"><div class="klabel">Маржин. средневзвеш., %</div><div class="kval">${wFMar.toLocaleString('ru-RU',{maximumFractionDigits:1})}</div></div>
      </div>
    </div></div></div>`;
}
function protoBlock(pid,offer){
  const items=PROTO[pid]||[];
  const today=new Date(); today.setHours(0,0,0,0);
  let h=`<div class="protohead">Протокол действий • ${esc(offer)}</div>`;
  h+=items.map(it=>{
    const mk=it.metrics.split(',');
    const tg=JSON.parse(it.targets||'{}');
    const past=weekEnd(parseW(it.week))<today;
    const facts=it.facts?JSON.parse(it.facts):null;
    let status;
    if(!past) status=`<span class="badge n">в работе</span>`;
    else if(it.done==null||it.trend==null) status=`
      <button onclick="evalProto(${it.id},'done',true)">Выполнено</button>
      <button onclick="evalProto(${it.id},'done',false)">Не выполнено</button>
      <button onclick="evalProto(${it.id},'trend','better')">Лучше</button>
      <button onclick="evalProto(${it.id},'trend','worse')">Хуже</button>`;
    else status=`<span class="badge ${it.done?'g':'r'}">${it.done?'выполнено':'не выполнено'}</span> <span class="badge ${it.trend==='better'?'g':'r'}">${it.trend==='better'?'лучше':'хуже'}</span>`;
    const tgt=mk.map(k=>`${MLBL[k]}: ${fmtFor(k,tg[k])}`).join(' • ');
    const fct=facts?mk.map(k=>`${MLBL[k]}: ${facts[k]==null?'—':fmtFor(k,facts[k])}`).join(' • '):'';
    return `<div class="pitem">
      <div><span class="pdate">${new Date(it.created_at).toLocaleDateString('ru-RU',{day:'2-digit',month:'2-digit'})}</span>
      <span class="pmetrics">${mk.map(k=>`<i>${MLBL[k]}</i>`).join('')}</span>
      <span class="paction">${esc(it.action)}</span></div>
      <div class="psub">Цель: ${tgt} • Срок: ${wlabel(parseW(it.week))}${fct?` • Факт: ${fct}`:''} ${status}</div>
    </div>`;
  }).join('')||'<div class="psub">Пока нет пунктов</div>';
  h+=`<div class="pform">
    <div class="pfrow">${METRICS.map(m=>`<label class="chk"><input type="checkbox" id="pm_${pid}_${m.key}">${MLBL[m.key]}</label>`).join('')}</div>
    <div class="pfrow">${METRICS.map(m=>`<label class="tgin">${MLBL[m.key]} <input id="pt_${pid}_${m.key}" placeholder="прогноз"></label>`).join('')}</div>
    <div class="pfrow"><input type="text" id="pa_${pid}" placeholder="Действие (свободная форма)">
      <select id="pw_${pid}">${WEEKISO.map(w=>`<option value="${w}">${wlabel(parseW(w))}</option>`).join('')}</select>
      <button onclick="addProto(${pid})">Добавить</button></div>
  </div>`;
  return h;
}
function render(){
  const q=document.getElementById('q').value.toLowerCase();
  const f=ROWS.filter(r=>(r.name||'').toLowerCase().includes(q)||(r.offer_id||'').toLowerCase().includes(q));
  const m1=f.filter(r=>matrixOf(r.offer_id)==='m1');
  const m2=f.filter(r=>matrixOf(r.offer_id)==='m2');
  document.getElementById('summary').innerHTML=mxCard('1','Матрица_1',m1)+mxCard('2','Матрица_2',m2);
  drawPie({svg:'pieRev1',legend:'legendRev1',val:'pcValRev1',cap:'pcCapRev1'},matrixStats(m1).buckets,matrixStats(m1).tRub,b=>b.rev,v=>fmtM(v)+' ₽','выручка плана',b=>fmtM(b.rev)+' ₽',b=>b.cnt+' поз.');
  drawPie({svg:'piePos1',legend:'legendPos1',val:'pcValPos1',cap:'pcCapPos1'},matrixStats(m1).buckets,m1.length,b=>b.cnt,v=>fmt(v)+' поз.','позиции',b=>fmt(b.cnt)+' поз.',b=>fmtM(b.rev)+' ₽');
  drawPie({svg:'pieRev2',legend:'legendRev2',val:'pcValRev2',cap:'pcCapRev2'},matrixStats(m2).buckets,matrixStats(m2).tRub,b=>b.rev,v=>fmtM(v)+' ₽','выручка плана',b=>fmtM(b.rev)+' ₽',b=>b.cnt+' поз.');
  drawPie({svg:'piePos2',legend:'legendPos2',val:'pcValPos2',cap:'pcCapPos2'},matrixStats(m2).buckets,m2.length,b=>b.cnt,v=>fmt(v)+' поз.','позиции',b=>fmt(b.cnt)+' поз.',b=>fmtM(b.rev)+' ₽');
  let totalCols=3;
  METRICS.forEach(mt=>{ totalCols+=3+(EXP[mt.key]?WEEKS.length*2:0); });
  let r1='<tr><th rowspan="3">Артикул</th><th rowspan="3">Название</th><th rowspan="3">Дата</th>';
  let r2='', r3='';
  METRICS.forEach(mt=>{
    const exp=EXP[mt.key];
    const span=3+(exp?WEEKS.length*2:0);
    r1+=`<th colspan="${span}" class="mhead"><button class="mtoggle" onclick="toggleMetric('${mt.key}')">${exp?'▾':'▸'}</button>${mt.label}</th>`;
    r2+=`<th rowspan="2" class="sub">План</th><th rowspan="2" class="sub">Прогноз/Факт</th><th rowspan="2" class="sub wrap2">Отклонение<br>в динамике</th>`;
    if(exp){ WEEKS.forEach(w=>{ r2+=`<th colspan="2" class="whead">${wlabel(w)}</th>`; });
             WEEKS.forEach(w=>{ r3+=`<th class="wsub">Пр</th><th class="wsub">Ф</th>`; }); }
  });
  document.getElementById('th').innerHTML=r1+'</tr><tr>'+r2+'</tr><tr>'+r3+'</tr></tr>';
  const devOf=p=>devFor(p,'mar');
  const prodRow=p=>{
    const pid=p.product_id;
    const wd=(PPM[pid]&&PPM[pid].work_date)||'';
    const pl=PLAN[pid]||{price:Number(p.price||0),plan_qty:0,margin_pct:0};
    const zp=(pl.plan_qty||0)===0;
    let h=`<tr${zp?' class="zeroplan"':''}>
      <td>${esc(p.offer_id)}</td>
      <td class="pname" title="Протокол действий" onclick="toggleProto(${pid})">${esc(p.name)}</td>
      <td><input type="date" class="dateinp" value="${wd}" onchange="setWorkDate(${pid},this.value)"></td>`;
    METRICS.forEach(mt=>{
      const planV=monthlyPlan(p,mt.key);
      const ffV=collVal(p,mt.key);
      const dev=devFor(p,mt.key);
      const dcls=dev>0?'g':dev<0?'r':'n';
      const editKey=mt.edit;
      h+=`<td class="num ${editKey?'editable':''}" ${editKey?`title="Изменить план" onclick="editField(${pid},'${editKey}')"`:''}>${fmtFor(mt.key,planV)}</td>`;
      h+=`<td class="num calc">${fmtFor(mt.key,ffV)}</td>`;
      h+=`<td class="num ${dcls}">${(dev>0?'+':'')+fmtFor(mt.key,dev)}</td>`;
      if(EXP[mt.key]){
        const series=mt.add?seriesFor(p,mt.key):null;
        WEEKISO.forEach((w,i)=>{
          const rec=getRec(pid,mt.key,w);
          let fc=mt.add?series[i].forecast:(rec.forecast!=null?rec.forecast:monthlyPlan(p,mt.key));
          const auto=mt.add&&!series[i].manual&&rec.fact==null;
          h+=`<td class="num editable wcell ${auto?'autocell':''}" title="Прогноз" onclick="editWeek(${pid},'${w}','${mt.key}')">${fmtFor(mt.key,fc)}</td>`;
          h+=`<td class="num wcell factcell" title="Факт (API)">${rec.fact==null?'—':fmtFor(mt.key,rec.fact)}</td>`;
        });
      }
    });
    h+=`</tr>`;
    if(openProto.has(pid)){
      h+=`<tr class="protorow"><td colspan="${totalCols}">${protoBlock(pid,p.offer_id)}</td></tr>`;
    }
    return h;
  };
  let html='';
  const groups=[['m1','Матрица_1',m1],['m2','Матрица_2',m2]];
  groups.forEach(([gid,gname,list])=>{
    html+=`<tr class="mgroup"><td colspan="${totalCols}"><button onclick="toggleGM('${gid}')">${GM[gid]?'▾':'▸'}</button>${gname} • ${list.length} поз.</td></tr>`;
    if(!GM[gid])return;
    const hasDate=list.some(p=>(PPM[p.product_id]&&PPM[p.product_id].work_date));
    if(hasDate){
      const byDate=new Map();
      list.forEach(p=>{ const d=(PPM[p.product_id]&&PPM[p.product_id].work_date)||null; if(!byDate.has(d))byDate.set(d,[]); byDate.get(d).push(p); });
      const dates=[...byDate.keys()].filter(x=>x).sort();
      dates.forEach(d=>{
        html+=`<tr class="dgroup"><td colspan="${totalCols}">${dateHead(d)}</td></tr>`;
        html+=byDate.get(d).sort((a,b)=>devOf(a)-devOf(b)).map(prodRow).join('');
      });
      if(byDate.has(null)){
        html+=`<tr class="dgroup"><td colspan="${totalCols}">Без даты</td></tr>`;
        html+=byDate.get(null).sort((a,b)=>devOf(a)-devOf(b)).map(prodRow).join('');
      }
    }else{
      html+=[...list].sort((a,b)=>devOf(a)-devOf(b)).map(prodRow).join('');
    }
  });
  document.getElementById('tb').innerHTML=html||`<tr><td colspan="${totalCols}" style="color:#94a3b8">нет данных</td></tr>`;
}
</script></body></html>
